<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Login</title>

<link rel="stylesheet" href="style.css">

<style>

.login-card {
    width: 460px;
    max-width: 94%;
    padding: 45px 40px;
    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(8,18,32,.92),
            rgba(0,0,0,.78)
        );

    backdrop-filter: blur(22px);

    border: 1px solid rgba(77,166,255,.28);
    border-radius: 28px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        0 0 45px rgba(0,110,255,.18);
}

.login-badge {
    width: 125px;
    height: 125px;
    object-fit: contain;
    margin-bottom: 18px;

    filter:
        drop-shadow(0 0 12px rgba(22,140,255,.7))
        drop-shadow(0 0 35px rgba(22,140,255,.25));
}

.login-card h1 {
    margin: 5px 0 8px;
    color: #fff;
    font-size: 30px;
}

.login-card h3 {
    margin-bottom: 12px;
    color: #4da6ff;
    font-size: 16px;
}

.login-card > p {
    color: #9ca9b8;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 25px;
}

.login-card input {
    width: 100%;
    height: 54px;
    margin-top: 13px;
    padding: 0 17px;

    border-radius: 13px;
    border: 1px solid rgba(255,255,255,.12);

    background: rgba(255,255,255,.055);
    color: #fff;

    outline: none;
    font-family: inherit;
    font-size: 14px;
}

.login-card input:focus {
    border-color: rgba(22,140,255,.8);

    box-shadow:
        0 0 0 3px rgba(22,140,255,.08),
        0 0 20px rgba(22,140,255,.12);
}

.login-button {
    width: 100%;
    height: 54px;
    margin-top: 22px;

    border: none;
    border-radius: 13px;

    font-size: 15px;
    font-weight: bold;

    color: white;

    background:
        linear-gradient(
            135deg,
            #087cff,
            #0055cc
        );

    cursor: pointer;
}

.login-button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

#loginResult {
    min-height: 25px;
    margin-top: 15px;
}

#loginResult p {
    margin: 0;
    padding: 11px;
    border-radius: 10px;
    font-size: 13px;
}

.login-error {
    background: rgba(255,40,40,.08);
    border: 1px solid rgba(255,70,70,.18);
    color: #ff7070;
}

.login-success {
    background: rgba(0,255,130,.08);
    border: 1px solid rgba(0,255,130,.18);
    color: #45e996;
}

.back-link {
    display: inline-block;
    margin-top: 20px;
    color: #8fa0b3;
    text-decoration: none;
    font-size: 13px;
}

@media(max-width:600px) {

    .login-card {
        padding: 35px 22px;
        border-radius: 22px;
    }

    .login-badge {
        width: 105px;
        height: 105px;
    }

    .login-card h1 {
        font-size: 25px;
    }

}

</style>

</head>

<body class="command-page">

<div class="overlay"></div>

<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="Vanguard LSPD Badge"
    >

    <div class="nav-title">

        <h2>Vanguard LSPD</h2>

        <span>
            Member Access
        </span>

    </div>

    <a
        href="index.html"
        class="login-btn"
    >
        بازگشت
    </a>

</header>


<main class="hero">

    <div class="login-card">

        <img
            src="badge.png"
            class="login-badge"
            alt="LSPD Badge"
        >

        <h1>
            ورود به LSPD
        </h1>

        <h3>
            Vanguard LSPD
        </h3>

        <p>
            با حساب اختصاصی خود وارد سامانه شوید.
        </p>


        <input
            type="text"
            id="username"
            placeholder="نام کاربری"
            autocomplete="username"
        >


        <input
            type="password"
            id="password"
            placeholder="رمز عبور"
            autocomplete="current-password"
        >


        <button
            type="button"
            id="loginButton"
            class="btn primary login-button"
            onclick="loginUser()"
        >
            🔐 ورود
        </button>


        <div id="loginResult"></div>


        <a
            href="index.html"
            class="back-link"
        >
            ← بازگشت به لابی
        </a>

    </div>

</main>


<script>

const API_URL =
    "https://lspd-site-11.onrender.com";


async function loginUser() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const result =
        document.getElementById("loginResult");

    const button =
        document.getElementById("loginButton");


    result.innerHTML = "";


    if (!username || !password) {

        result.innerHTML = `
            <p class="login-error">
                ⚠️ نام کاربری و رمز عبور را وارد کنید.
            </p>
        `;

        return;
    }


    button.disabled = true;

    button.innerText =
        "⏳ در حال بررسی...";


    try {

        const response =
            await fetch(
                API_URL + "/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "نام کاربری یا رمز عبور اشتباه است."
            );

        }


        /*
         * پاسخ Backend باید شامل:
         *
         * token
         * user
         *
         * باشد.
         */


        if (!data.token || !data.user) {

            throw new Error(
                "پاسخ نامعتبر از سرور دریافت شد."
            );

        }


        sessionStorage.setItem(
            "lspdToken",
            data.token
        );


        sessionStorage.setItem(
            "lspdUser",
            JSON.stringify(data.user)
        );


        result.innerHTML = `
            <p class="login-success">
                ✅ ورود موفق بود. در حال انتقال...
            </p>
        `;


        /*
         * انتقال بر اساس Role
         */


        const role =
            String(
                data.user.role || ""
            ).toLowerCase();


        const commandRoles = [
            "chief",
            "assistant_chief",
            "deputy_chief",
            "commander"
        ];


        if (
            commandRoles.includes(role)
        ) {

            window.location.href =
                "admin.html";

        } else {

            window.location.href =
                "officer.html";

        }


    } catch (error) {

        console.error(
            "Login Error:",
            error
        );


        result.innerHTML = `
            <p class="login-error">
                ❌ ${escapeHTML(error.message)}
            </p>
        `;


        document
            .getElementById("password")
            .value = "";


    } finally {

        button.disabled = false;

        button.innerText =
            "🔐 ورود";

    }

}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


document
    .getElementById("username")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                loginUser();

            }

        }
    );


document
    .getElementById("password")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                loginUser();

            }

        }
    );

</script>

</body>

</html>
