<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">

<style>

* {
    box-sizing: border-box;
}

body.command-page {
    min-height: 100vh;
}

/* =====================================================
   NAVBAR
===================================================== */

.admin-navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
    padding: 14px 35px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(3, 8, 15, .88);
    backdrop-filter: blur(20px);

    border-bottom: 1px solid rgba(255,255,255,.10);

    box-shadow:
        0 10px 40px rgba(0,0,0,.25);
}

.admin-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.admin-brand img {
    width: 52px;
    height: 52px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 0 12px
            rgba(30,145,255,.75)
        );
}

.admin-brand-text h2 {
    margin: 0;
    color: #4da6ff;
    font-size: 22px;
}

.admin-brand-text span {
    color: #8e9baa;
    font-size: 12px;
}

.admin-actions {
    display: flex;
    gap: 10px;
    align-items: center;
}

.admin-btn {
    border: 1px solid rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.06);

    color: white;

    padding: 10px 18px;

    border-radius: 10px;

    cursor: pointer;

    transition: .25s;
}

.admin-btn:hover {
    background:
        rgba(255,255,255,.12);

    transform:
        translateY(-2px);
}

.admin-btn.logout {
    background:
        rgba(255,55,55,.12);

    border-color:
        rgba(255,70,70,.25);
}

.admin-btn.logout:hover {
    background:
        rgba(255,55,55,.25);
}

/* =====================================================
   MAIN
===================================================== */

.admin-main {
    width: 1250px;
    max-width: 94%;

    margin:
        35px auto 70px;
}

/* =====================================================
   HEADER
===================================================== */

.admin-header {
    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom: 25px;
}

.admin-header h1 {
    margin: 0;

    font-size: 30px;

    color: white;
}

.admin-header p {
    margin-top: 8px;

    color: #8995a3;
}

.live-status {
    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        9px 14px;

    border-radius:
        20px;

    background:
        rgba(0,255,140,.08);

    border:
        1px solid
        rgba(0,255,140,.18);

    color:
        #53e89a;

    font-size: 13px;
}

.live-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        #00ff88;

    box-shadow:
        0 0 10px
        #00ff88;
}

/* =====================================================
   STATS
===================================================== */

.admin-stats {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 15px;

    margin-bottom: 22px;
}

.admin-stat {
    position: relative;

    padding: 20px;

    min-height: 120px;

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    overflow: hidden;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.18);
}

.admin-stat::after {
    content: "";

    position: absolute;

    width: 100px;
    height: 100px;

    left: -40px;
    bottom: -50px;

    background:
        rgba(0,120,255,.12);

    border-radius: 50%;

    filter: blur(15px);
}

.stat-icon {
    font-size: 22px;
}

.stat-number {
    display: block;

    margin-top: 10px;

    font-size: 28px;

    color: #4da6ff;

    font-weight: bold;
}

.stat-label {
    color: #9ba6b2;

    font-size: 13px;
}

/* =====================================================
   CONTROL PANEL
===================================================== */

.control-panel {
    padding: 18px;

    border-radius: 18px;

    background:
        rgba(3,8,15,.72);

    border:
        1px solid
        rgba(255,255,255,.10);

    backdrop-filter:
        blur(15px);

    margin-bottom: 20px;
}

.search-wrapper {
    position: relative;
}

.search-wrapper input {
    width: 100%;

    padding:
        15px 18px;

    border-radius:
        12px;

    border:
        1px solid
        rgba(255,255,255,.12);

    outline: none;

    background:
        rgba(255,255,255,.055);

    color: white;

    font-size: 14px;
}

.search-wrapper input:focus {
    border-color:
        rgba(50,150,255,.7);

    box-shadow:
        0 0 0 3px
        rgba(0,120,255,.10);
}

.filter-buttons {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin-top: 13px;
}

.filter-btn {
    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.05);

    color:
        #d9e0e8;

    padding:
        9px 15px;

    border-radius:
        9px;

    cursor: pointer;

    transition: .2s;
}

.filter-btn:hover {
    background:
        rgba(255,255,255,.10);
}

.filter-btn.active {
    background:
        #087cff;

    border-color:
        #087cff;

    color: white;

    box-shadow:
        0 5px 18px
        rgba(0,120,255,.25);
}

/* =====================================================
   REQUEST HEADER
===================================================== */

.requests-header {
    display: flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin:
        20px 0 12px;
}

.requests-header h2 {
    margin: 0;

    font-size: 20px;
}

.refresh-info {
    color:
        #758190;

    font-size: 12px;
}

/* =====================================================
   REQUESTS
===================================================== */

.requests {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 15px;
}

/* =====================================================
   TICKET
===================================================== */

.ticket {
    position: relative;

    padding: 20px;

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            rgba(18,25,34,.92),
            rgba(7,12,19,.92)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.20);

    transition: .25s;

    overflow: hidden;
}

.ticket:hover {
    transform:
        translateY(-3px);

    border-color:
        rgba(55,155,255,.30);

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.32);
}

.ticket.closed-ticket {
    border-color:
        rgba(130,130,255,.18);
}

.ticket-top {
    display: flex;

    justify-content:
        space-between;

    gap: 10px;

    align-items:
        flex-start;

    margin-bottom: 16px;
}

.ticket-title {
    display: flex;

    gap: 10px;

    align-items:
        center;
}

.ticket-type-icon {
    width: 42px;
    height: 42px;

    display: flex;

    justify-content:
        center;

    align-items:
        center;

    border-radius:
        12px;

    background:
        rgba(0,120,255,.10);

    border:
        1px solid
        rgba(0,140,255,.18);

    font-size: 20px;
}

.ticket-title h3 {
    margin: 0;

    font-size: 16px;
}

.ticket-code {
    color:
        #718092;

    font-size: 11px;

    margin-top: 4px;

    direction: ltr;

    text-align:
        right;
}

/* =====================================================
   STATUS
===================================================== */

.status {
    padding:
        6px 10px;

    border-radius:
        20px;

    font-size: 11px;

    white-space:
        nowrap;
}

.status.pending {
    background:
        rgba(255,180,0,.10);

    border:
        1px solid
        rgba(255,180,0,.18);

    color:
        #ffc44d;
}

.status.accepted {
    background:
        rgba(0,255,130,.09);

    border:
        1px solid
        rgba(0,255,130,.18);

    color:
        #45e996;
}

.status.rejected {
    background:
        rgba(255,50,50,.09);

    border:
        1px solid
        rgba(255,70,70,.18);

    color:
        #ff6565;
}

.status.closed {
    background:
        rgba(130,130,255,.10);

    border:
        1px solid
        rgba(130,130,255,.25);

    color:
        #a9a9ff;
}

/* =====================================================
   TICKET INFO
===================================================== */

.ticket-info {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;

    margin-bottom: 15px;
}

.info-item {
    padding: 10px;

    background:
        rgba(255,255,255,.035);

    border-radius:
        9px;

    border:
        1px solid
        rgba(255,255,255,.055);
}

.info-item small {
    display: block;

    color:
        #738091;

    font-size: 10px;

    margin-bottom: 4px;
}

.info-item span {
    color:
        #e4e8ed;

    font-size: 12px;

    word-break:
        break-word;
}

/* =====================================================
   EXAM
===================================================== */

.ticket-exam {
    padding: 12px;

    border-radius: 10px;

    background:
        rgba(0,120,255,.06);

    border:
        1px solid
        rgba(0,120,255,.10);

    margin-bottom: 13px;
}

.ticket-exam strong {
    color:
        #4da6ff;
}

/* =====================================================
   FOOTER
===================================================== */

.ticket-footer {
    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap: 10px;

    padding-top:
        13px;

    border-top:
        1px solid
        rgba(255,255,255,.07);
}

.ticket-date {
    color:
        #687483;

    font-size: 10px;
}

.ticket-actions {
    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}

/* =====================================================
   ACTION BUTTON
===================================================== */

.action-btn {
    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        rgba(255,255,255,.06);

    color: white;

    padding:
        8px 12px;

    border-radius:
        8px;

    cursor: pointer;

    font-family:
        inherit;

    transition:
        .2s;
}

.action-btn:hover {
    background:
        rgba(255,255,255,.12);
}

.action-btn.blue {
    background:
        rgba(0,120,255,.15);

    border-color:
        rgba(0,140,255,.25);
}

.action-btn.green {
    background:
        rgba(0,200,100,.10);

    border-color:
        rgba(0,220,110,.20);
}

.action-btn.red {
    background:
        rgba(255,50,50,.10);

    border-color:
        rgba(255,70,70,.20);
}

.action-btn.red:hover {
    background:
        rgba(255,50,50,.22);
}

.action-btn.purple {
    background:
        rgba(120,100,255,.12);

    border-color:
        rgba(130,110,255,.25);

    color:
        #b9b5ff;
}

.action-btn.purple:hover {
    background:
        rgba(120,100,255,.23);
}

/* =====================================================
   EMPTY
===================================================== */

.empty-box {
    grid-column:
        1 / -1;

    padding:
        50px 25px;

    text-align:
        center;

    border-radius:
        17px;

    background:
        rgba(255,255,255,.035);

    border:
        1px dashed
        rgba(255,255,255,.12);

    color:
        #7d8997;
}

.empty-icon {
    font-size: 40px;

    margin-bottom:
        10px;
}

/* =====================================================
   MODAL
===================================================== */

.modal {
    position: fixed;

    inset: 0;

    z-index: 3000;

    display: none;

    align-items:
        center;

    justify-content:
        center;

    padding: 20px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(8px);
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 750px;

    max-width:
        100%;

    max-height:
        90vh;

    overflow-y:
        auto;

    padding: 25px;

    border-radius:
        20px;

    background:
        linear-gradient(
            145deg,
            #101821,
            #050a10
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.60);
}

.modal-header {
    display: flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        20px;
}

.modal-header h2 {
    margin: 0;
}

.close-modal {
    width: 36px;
    height: 36px;

    border: none;

    border-radius:
        9px;

    background:
        rgba(255,255,255,.07);

    color: white;

    cursor: pointer;

    font-size: 18px;
}

/* =====================================================
   DETAILS
===================================================== */

.detail-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}

.detail {
    padding: 12px;

    border-radius:
        10px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.06);
}

.detail.full {
    grid-column:
        1 / -1;
}

.detail label {
    display: block;

    color:
        #718091;

    font-size: 11px;

    margin-bottom:
        5px;
}

.detail div {
    color:
        #e7ebef;

    white-space:
        pre-wrap;

    line-height:
        1.7;
}

/* =====================================================
   REPLY
===================================================== */

.reply-area {
    margin-top:
        20px;
}

.reply-area textarea {
    width: 100%;

    min-height:
        110px;

    padding:
        13px;

    resize:
        vertical;

    border-radius:
        11px;

    background:
        rgba(255,255,255,.045);
