<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="command-page">


<div class="overlay"></div>



<header class="navbar">

<img src="badge.png" class="badge">


<div class="nav-title">

<h2>
Vanguard LSPD
</h2>

<span>
Command Center
</span>

</div>



<button class="login-btn" onclick="logoutAdmin()">
خروج
</button>


</header>





<main class="hero">



<div class="dashboard">



<h1>
🚔 پنل فرماندهی LSPD
</h1>


<p class="dashboard-sub">
مدیریت و بررسی درخواست‌های نیروها
</p>





<div class="stats">



<div class="card stat-total">

<h2 id="total">
0
</h2>

<p>
کل درخواست‌ها
</p>

</div>




<div class="card stat-pending">

<h2 id="pending">
0
</h2>

<p>
در انتظار بررسی
</p>

</div>





<div class="card stat-accepted">

<h2 id="accepted">
0
</h2>

<p>
تایید شده
</p>

</div>



</div>







<input 
class="search-box"
id="search"
placeholder="🔍 جستجو نام یا Discord..."
>







<div id="tickets">

</div>





</div>



</main>






<script src="script.js"></script>


<script>


let allTickets=[];




async function loadTickets(){

allTickets = await getTickets();

showTickets(allTickets);

updateStats();

}






function updateStats(){


document.getElementById("total").innerText =
allTickets.length;


document.getElementById("pending").innerText =
allTickets.filter(
t=>t.status==="Pending"
).length;



document.getElementById("accepted").innerText =
allTickets.filter(
t=>t.status==="Accepted"
).length;



}







function showTickets(tickets){


let box =
document.getElementById("tickets");


box.innerHTML="";




if(tickets.length===0){


box.innerHTML=`

<div class="ticket-card empty">

<h2>
📭 تیکتی وجود ندارد
</h2>

</div>

`;

return;

}





tickets.forEach(t=>{


let statusClass="";


if(t.status==="Pending")
statusClass="pending-text";


if(t.status==="Accepted")
statusClass="approved-text";


if(t.status==="Rejected")
statusClass="rejected-text";




box.innerHTML += `



<div class="ticket-card">



<div class="ticket-header">

<h2>
👮 ${t.name}
</h2>


<span class="${statusClass}">
${t.status}
</span>


</div>





<p>
<b>Discord:</b>
${t.discord}
</p>




<p>
<b>سن:</b>
${t.age}
</p>





<p>
<b>تجربه:</b>
${t.experience}
</p>





<p>
<b>دلیل عضویت:</b>
${t.reason}
</p>






<textarea 
id="reply-${t._id}"
placeholder="✍️ پاسخ فرماندهی..."
>${t.reply || ""}</textarea>






<select id="status-${t._id}">


<option value="Pending"
${t.status==="Pending"?"selected":""}>
🟡 در انتظار
</option>



<option value="Accepted"
${t.status==="Accepted"?"selected":""}>
🟢 تایید شده
</option>




<option value="Rejected"
${t.status==="Rejected"?"selected":""}>
🔴 رد شده
</option>


</select>






<div class="ticket-buttons">


<button 
class="btn primary"
onclick="saveTicket('${t._id}')">

💾 ذخیره

</button>





<button 
class="btn delete-btn"
onclick="removeTicket('${t._id}')">

🗑 حذف

</button>


</div>




</div>



`;



});


}









async function saveTicket(id){


let status =
document.getElementById(
"status-"+id
).value;



let reply =
document.getElementById(
"reply-"+id
).value;




await updateTicket(
id,
status,
reply
);



alert(
"تیکت بروزرسانی شد ✅"
);



loadTickets();


}









async function removeTicket(id){


if(confirm(
"آیا حذف شود؟"
)){


await deleteTicket(id);


alert(
"تیکت حذف شد ✅"
);


loadTickets();


}


}









document
.getElementById("search")
.addEventListener(
"input",
function(){


let value =
this.value.toLowerCase();



let result =
allTickets.filter(t=>


(t.name || "")
.toLowerCase()
.includes(value)



||

(t.discord || "")
.toLowerCase()
.includes(value)



);



showTickets(result);



});







loadTickets();



</script>


</body>

</html>
