<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="overlay"></div>


<header class="navbar">

<img src="badge.png" class="badge">


<div class="nav-title">

<h2>Vanguard LSPD</h2>

<span>Command Dashboard</span>

</div>


<button class="login-btn" onclick="logoutAdmin()">
خروج
</button>


</header>





<main class="hero">


<div class="dashboard">


<h1>
پنل فرماندهی LSPD
</h1>




<div class="stats">


<div class="card">

<h2 id="total">0</h2>

<p>کل درخواست‌ها</p>

</div>


<div class="card">

<h2 id="pending">0</h2>

<p>در انتظار بررسی</p>

</div>


<div class="card">

<h2 id="accepted">0</h2>

<p>تایید شده</p>

</div>


</div>





<input 
id="search"
placeholder="جستجو بین درخواست‌ها..."
>





<div id="tickets"></div>




</div>


</main>




<script src="script.js"></script>


<script>


let allTickets = [];




// گرفتن تیکت ها

async function loadTickets(){


allTickets = await getTickets();


showTickets(allTickets);


updateStats();


}






function updateStats(){


document.getElementById("total").innerText =
allTickets.length;



document.getElementById("pending").innerText =

allTickets.filter(t =>
t.status === "Pending"
).length;



document.getElementById("accepted").innerText =

allTickets.filter(t =>
t.status === "Accepted"
).length;



}







function showTickets(tickets){


let box =
document.getElementById("tickets");


box.innerHTML = "";



if(tickets.length === 0){

box.innerHTML =
"<h3>تیکتی وجود ندارد</h3>";

return;

}




tickets.forEach(t=>{


box.innerHTML += `



<div class="ticket">


<h2>
${t.name}
</h2>



<p>
Discord:
${t.discord}
</p>


<p>
سن:
${t.age}
</p>


<p>
تجربه:
${t.experience}
</p>


<p>
دلیل:
${t.reason}
</p>



<p>
وضعیت فعلی:
<b>
${t.status}
</b>
</p>




<textarea 
id="reply-${t._id}"
placeholder="پاسخ فرمانده"
>${t.reply || ""}</textarea>





<select id="status-${t._id}">


<option value="Pending"
${t.status==="Pending"?"selected":""}>
در انتظار
</option>



<option value="Accepted"
${t.status==="Accepted"?"selected":""}>
تایید شده
</option>




<option value="Rejected"
${t.status==="Rejected"?"selected":""}>
رد شده
</option>


</select>





<button 
class="btn primary"
onclick="saveTicket('${t._id}')">

ذخیره پاسخ

</button>





<button 
class="btn danger"
onclick="removeTicket('${t._id}')">

حذف تیکت

</button>



</div>



`;



});


}









async function saveTicket(id){



let status =
document.getElementById(
"status-"+id
).value;




let reply =
document.getElementById(
"reply-"+id
).value;





let result =
await updateTicket(
id,
status,
reply
);




if(result){

alert("تیکت بروزرسانی شد ✅");

}



loadTickets();



}










async function removeTicket(id){



if(confirm("آیا از حذف این تیکت مطمئن هستید؟")){


await deleteTicket(id);



alert("تیکت حذف شد ✅");



loadTickets();


}



}









document
.getElementById("search")
.addEventListener(
"input",
function(){



let value =
this.value.toLowerCase();



let result =
allTickets.filter(t=>


(t.name || "")
.toLowerCase()
.includes(value)



||

(t.discord || "")
.toLowerCase()
.includes(value)



);



showTickets(result);



});






loadTickets();



</script>



</body>

</html>
