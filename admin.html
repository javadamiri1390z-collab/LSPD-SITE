<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">

<style>

* {
    box-sizing: border-box;
}

body.command-page {
    min-height: 100vh;
}

.hidden {
    display: none !important;
}

.command-wrap {
    width: 1200px;
    max-width: 96%;
    margin: 30px auto;
}

.command-panel {
    background: rgba(4, 9, 17, .78);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 20px 70px rgba(0,0,0,.35);
}

.command-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.command-header h1 {
    margin: 0;
    color: #55aaff;
}

.command-user {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);
    padding: 12px 18px;
    border-radius: 12px;
}

.command-user strong {
    color: #55aaff;
}

.toolbar {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    margin-bottom: 25px;
}

.toolbar input,
.toolbar select {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.07);
    color: white;
    outline: none;
}

.toolbar select option {
    background: #101722;
}

.ticket-list {
    display: grid;
    gap: 16px;
}

.ticket-card {
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px;
    padding: 20px;
}

.ticket-card:hover {
    border-color: rgba(77,166,255,.35);
}

.ticket-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.ticket-id {
    direction: ltr;
    text-align: left;
    font-family: monospace;
    color: #8fc8ff;
    font-size: 12px;
    word-break: break-all;
}

.status {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
}

.status.Pending {
    background: rgba(255,170,0,.12);
    color: #ffb52e;
}

.status.Accepted {
    background: rgba(0,255,130,.1);
    color: #00ff88;
}

.status.Rejected {
    background: rgba(255,50,50,.1);
    color: #ff5555;
}

.ticket-info {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 15px 0;
}

.info-box {
    padding: 12px;
    background: rgba(0,0,0,.2);
    border-radius: 10px;
}

.info-box small {
    display: block;
    color: #8995a3;
    margin-bottom: 5px;
}

.info-box span {
    word-break: break-word;
}

.ticket-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.ticket-actions button {
    flex: 1;
    min-width: 140px;
}

.reply-area {
    margin-top: 15px;
}

.reply-area textarea {
    width: 100%;
    min-height: 100px;
    padding: 14px;
    resize: vertical;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(0,0,0,.3);
    color: white;
    outline: none;
    font-family: inherit;
}

.reply-area textarea:focus {
    border-color: #168cff;
    box-shadow: 0 0 12px rgba(22,140,255,.2);
}

.chat-box {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.08);
}

.messages {
    max-height: 280px;
    overflow-y: auto;
    padding: 10px;
    background: rgba(0,0,0,.25);
    border-radius: 12px;
    margin-bottom: 10px;
}

.message {
    padding: 12px;
    margin-bottom: 9px;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
}

.message.command {
    border-right: 3px solid #55aaff;
}

.message.applicant {
    border-right: 3px solid #35d07f;
}

.message-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.message-text {
    white-space: pre-wrap;
    line-height: 1.7;
}

.message-time {
    display: block;
    margin-top: 5px;
    color: #7d8997;
    font-size: 11px;
}

.chat-row {
    display: flex;
    gap: 8px;
}

.chat-row input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(0,0,0,.25);
    color: white;
    outline: none;
}

.admin-only {
    border: 1px solid rgba(255,70,70,.25);
    background: rgba(255,40,40,.05);
    border-radius: 18px;
    padding: 20px;
    margin-top: 25px;
}

.admin-only h2 {
    color: #ff6969;
    margin-top: 0;
}

.logs {
    max-height: 500px;
    overflow-y: auto;
}

.log-item {
    padding: 15px;
    background: rgba(255,255,255,.05);
    border-radius: 12px;
    margin-bottom: 10px;
    border-right: 3px solid #ff6969;
}

.log-item strong {
    color: #55aaff;
}

.log-time {
    color: #8995a3;
    font-size: 11px;
    margin-top: 5px;
}

.empty {
    text-align: center;
    padding: 40px;
    color: #8995a3;
}

.error {
    color: #ff5555;
    background: rgba(255,0,0,.08);
    border: 1px solid rgba(255,0,0,.15);
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.success {
    color: #00ff88;
    background: rgba(0,255,130,.07);
    border: 1px solid rgba(0,255,130,.15);
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
}

@media(max-width:800px) {

    .toolbar {
        grid-template-columns: 1fr;
    }

    .ticket-info {
        grid-template-columns: 1fr;
    }

    .command-panel {
        padding: 18px;
    }

    .chat-row {
        flex-direction: column;
    }

}

</style>

</head>

<body class="command-page">

<div class="overlay"></div>

<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="Vanguard LSPD"
    >

    <div class="nav-title">

        <h2>Vanguard LSPD</h2>

        <span>Command Center</span>

    </div>

    <a
        href="index.html"
        class="login-btn"
    >
        خروج
    </a>

</header>


<main class="command-wrap">

<div class="command-panel">

    <div class="command-header">

        <div>

            <h1>👮 پنل فرماندهی</h1>

            <p style="color:#aaa;margin-top:8px;">
                مدیریت درخواست‌ها و ارتباط با متقاضیان
            </p>

        </div>

        <div class="command-user">

            👤
            <strong id="commanderName">
                در حال دریافت...
            </strong>

            <br>

            <small id="commanderRank">
                —
            </small>

        </div>

    </div>


    <div id="globalMessage"></div>


    <!-- =============================== -->
    <!-- TOOLBAR -->
    <!-- =============================== -->

    <div class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 جستجو با کد، نام، Discord..."
        >

        <select id="statusFilter">

            <option value="all">
                همه وضعیت‌ها
            </option>

            <option value="Pending">
                در انتظار
            </option>

            <option value="Accepted">
                تایید شده
            </option>

            <option value="Rejected">
                رد شده
            </option>

        </select>

        <button
            class="btn primary"
            onclick="loadTickets()"
        >
            🔄 بروزرسانی
        </button>

    </div>


    <div
        id="ticketList"
        class="ticket-list"
    >

        <div class="empty">
            ⏳ در حال دریافت تیکت‌ها...
        </div>

    </div>


    <!-- =============================== -->
    <!-- SUPER ADMIN -->
    <!-- =============================== -->

    <section
        id="superAdminSection"
        class="admin-only hidden"
    >

        <h2>
            🔐 بخش مدیریت ارشد
        </h2>

        <p style="color:#aaa;margin-bottom:15px;">
            این بخش فقط برای حساب مالک سیستم قابل مشاهده است.
        </p>

        <button
            class="btn primary"
            onclick="loadLogs()"
        >
            📋 دریافت لاگ‌ها
        </button>

        <div
            id="logs"
            class="logs"
            style="margin-top:18px;"
        >

            <div class="empty">
                برای مشاهده لاگ‌ها روی دکمه بالا بزنید.
            </div>

        </div>

    </section>

</div>

</main>


<script>

const API_URL =
"https://lspd-site-11.onrender.com";


let tickets = [];

let currentUser = null;


// =======================================
// AUTH
// =======================================

function getToken() {

    return localStorage.getItem("lspdToken");

}


function authHeaders() {

    const token = getToken();

    return {

        "Content-Type":
            "application/json",

        "Authorization":
            "Bearer " + token

    };

}


// =======================================
// CHECK LOGIN
// =======================================

async function checkAuth() {

    const token =
        getToken();

    if (!token) {

        window.location.href =
            "command.html";

        return false;

    }


    try {

        const response =
            await fetch(
                API_URL + "/auth/me",
                {
                    headers:
                        authHeaders()
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unauthorized"
            );

        }


        const data =
            await response.json();


        currentUser =
            data.user ||
            data;


        document.getElementById(
            "commanderName"
        ).innerText =
            currentUser.name ||
            currentUser.username ||
            "فرمانده";


        document.getElementById(
            "commanderRank"
        ).innerText =
            currentUser.rank ||
            currentUser.role ||
            "Commander";


        // فقط SuperAdmin لاگ را می‌بیند

        if (
            currentUser.role ===
                "superadmin" ||
            currentUser.role ===
                "owner"
        ) {

            document
                .getElementById(
                    "superAdminSection"
                )
                .classList
                .remove("hidden");

        }


        return true;


    } catch (error) {

        console.error(
            "Auth Error:",
            error
        );


        localStorage.removeItem(
            "lspdToken"
        );


        window.location.href =
            "command.html";


        return false;

    }

}


// =======================================
// MESSAGE
// =======================================

function showMessage(
    message,
    type = "success"
) {

    const box =
        document.getElementById(
            "globalMessage"
        );


    box.innerHTML = `

        <div class="${type}">

            ${escapeHTML(message)}

        </div>

    `;


    setTimeout(() => {

        box.innerHTML = "";

    }, 4000);

}


// =======================================
// ESCAPE
// =======================================

function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


// =======================================
// REQUEST TYPE
// =======================================

function requestType(type) {

    const types = {

        membership:
            "🚔 عضویت LSPD",

        division:
            "🎖️ دیویژن",

        resignation:
            "📤 استعفا",

        rankup:
            "⬆️ Rankup"

    };


    return types[type] ||
        "📄 درخواست";

}


// =======================================
// STATUS
// =======================================

function statusText(status) {

    if (
        status ===
        "Accepted"
    ) {

        return "🟢 تایید شده";

    }


    if (
        status ===
        "Rejected"
    ) {

        return "🔴 رد شده";

    }


    return "🟡 در انتظار";

}


// =======================================
// LOAD TICKETS
// =======================================

async function loadTickets() {

    const list =
        document.getElementById(
            "ticketList"
        );


    list.innerHTML = `

        <div class="empty">

            ⏳ در حال دریافت درخواست‌ها...

        </div>

    `;


    try {

        const response =
            await fetch(
                API_URL + "/tickets",
                {
                    headers:
                        authHeaders()
                }
            );


        if (
            response.status ===
            401
        ) {

            throw new Error(
                "AUTH"
            );

        }


        if (!response.ok) {

            throw new Error(
                "خطا در دریافت تیکت‌ها"
            );

        }


        const data =
            await response.json();


        tickets =
            Array.isArray(data)
            ? data
            : [];


        renderTickets();


    } catch (error) {

        console.error(
            "Load Tickets Error:",
            error
        );


        if (
            error.message ===
            "AUTH"
        ) {

            localStorage.removeItem(
                "lspdToken"
            );

            window.location.href =
                "command.html";

            return;

        }


        list.innerHTML = `

            <div class="error">

                ❌ دریافت تیکت‌ها با مشکل مواجه شد.

            </div>

        `;

    }

}


// =======================================
// RENDER
// =======================================

function renderTickets() {

    const list =
        document.getElementById(
            "ticketList"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const status =
        document.getElementById(
            "statusFilter"
        )
        .value;


    let filtered =
        tickets.filter(ticket => {

            const text = (

                String(
                    ticket._id ||
                    ""
                )

                + " " +

                String(
                    ticket.icName ||
                    ticket.name ||
                    ""
                )

                + " " +

                String(
                    ticket.ocName ||
                    ticket.oocName ||
                    ""
                )

                + " " +

                String(
                    ticket.discord ||
                    ticket.discordId ||
                    ""
                )

            ).toLowerCase();


            const searchMatch =
                !search ||
                text.includes(search);


            const statusMatch =
                status === "all" ||
                ticket.status === status;


            return (
                searchMatch &&
                statusMatch
            );

        });


    if (
        filtered.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                📭 تیکتی پیدا نشد.

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered
        .map(
            ticket =>
                ticketHTML(ticket)
        )
        .join("");

}


// =======================================
// TICKET HTML
// =======================================

function ticketHTML(ticket) {

    const id =
        String(ticket._id);


    const isSuperAdmin =
        currentUser &&
        (
            currentUser.role ===
                "superadmin" ||
            currentUser.role ===
                "owner"
        );


    const messages =
        Array.isArray(
            ticket.messages
        )
        ? ticket.messages
        : [];


    return `

        <article
            class="ticket-card"
            id="ticket-${escapeHTML(id)}"
        >

            <div class="ticket-top">

                <div>

                    <strong>
                        ${requestType(
                            ticket.requestType
                        )}
                    </strong>

                    <div class="ticket-id">

                        ${escapeHTML(id)}

                    </div>

                </div>


                <span class="status ${escapeHTML(
                    ticket.status ||
                    "Pending"
                )}">

                    ${statusText(
                        ticket.status
                    )}

                </span>

            </div>


            <div class="ticket-info">

                <div class="info-box">

                    <small>
                        IC Name
                    </small>

                    <span>
                        ${escapeHTML(
                            ticket.icName ||
                            ticket.name ||
                            "—"
                        )}
                    </span>

                </div>


                <div class="info-box">

                    <small>
                        OC Name
                    </small>

                    <span>
                        ${escapeHTML(
                            ticket.ocName ||
                            ticket.oocName ||
                            "—"
                        )}
                    </span>

                </div>


                <div class="info-box">

                    <small>
                        Discord
                    </small>

                    <span>
                        ${escapeHTML(
                            ticket.discord ||
                            ticket.discordId ||
                            "—"
                        )}
                    </span>

                </div>


                <div class="info-box">

                    <small>
                        Steam Hex
                    </small>

                    <span>
                        ${escapeHTML(
                            ticket.steamHex ||
                            "—"
                        )}
                    </span>

                </div>


                <div class="info-box">

                    <small>
                        سن
                    </small>

                    <span>
                        ${escapeHTML(
                            ticket.age ||
                            "—"
                        )}
                    </span>

                </div>


                ${
                    ticket.score !==
                    null &&
                    ticket.score !==
                    undefined
                    ?

                    `

                    <div class="info-box">

                        <small>
                            نمره آزمون
                        </small>

                        <span>

                            ${escapeHTML(
                                ticket.score
                            )}
                            / 20

                        </span>

                    </div>

                    `

                    :

                    ""

                }

            </div>


            ${
                ticket.experience
                ?

                `

                <div class="info-box">

                    <small>
                        سابقه RP
                    </small>

                    <span>
                        ${escapeHTML(
                            ticket.experience
                        )}
                    </span>

                </div>

                `

                :

                ""

            }


            ${
                ticket.reason
                ?

                `

                <div class="info-box"
                    style="margin-top:10px;">

                    <small>
                        دلیل درخواست
                    </small>

                    <span>
                        ${escapeHTML(
                            ticket.reason
                        )}
                    </span>

                </div>

                `

                :

                ""

            }


            <!-- ===================== -->
            <!-- REPLY -->
            <!-- ===================== -->

            <div class="reply-area">

                <textarea
                    id="reply-${escapeHTML(id)}"
                    placeholder="پاسخ فرماندهی..."
                >${escapeHTML(
                    ticket.reply ===
                    "در انتظار پاسخ فرماندهی"
                    ? ""
                    : (
                        ticket.reply ||
                        ""
                    )
                )}</textarea>


                <div class="ticket-actions">

                    <button
                        class="btn primary"
                        onclick="updateTicket(
                            '${escapeJS(id)}',
                            'Accepted'
                        )"
                    >

                        ✅ تایید درخواست

                    </button>


                    <button
                        class="btn"
                        style="
                            background:#8d2525;
                        "
                        onclick="updateTicket(
                            '${escapeJS(id)}',
                            'Rejected'
                        )"
                    >

                        ❌ رد درخواست

                    </button>


                    ${
                        isSuperAdmin

                        ?

                        `

                        <button
                            class="btn"
                            style="
                                background:#4d1111;
                                border-color:#ff4444;
                            "
                            onclick="deleteTicket(
                                '${escapeJS(id)}'
                            )"
                        >

                            🗑️ حذف تیکت

                        </button>

                        `

                        :

                        ""

                    }

                </div>

            </div>


            <!-- ===================== -->
            <!-- CHAT -->
            <!-- ===================== -->

            <div class="chat-box">

                <h3>
                    💬 گفتگوی متقاضی
                </h3>

                <div
                    id="messages-${escapeHTML(id)}"
                    class="messages"
                >

                    ${
                        messages.length
                        ?

                        renderMessages(
                            messages
                        )

                        :

                        `<p style="color:#777;">
                            هنوز پیامی وجود ندارد.
                        </p>`

                    }

                </div>


                <div class="chat-row">

                    <input
                        type="text"
                        id="message-${escapeHTML(id)}"
                        placeholder="پیام برای متقاضی..."
                        onkeydown="
                            if(event.key==='Enter'){
                                event.preventDefault();
                                sendMessage('${escapeJS(id)}');
                            }
                        "
                    >


                    <button
                        class="btn primary"
                        onclick="
                            sendMessage(
                                '${escapeJS(id)}'
                            )
                        "
                    >

                        📨 ارسال

                    </button>

                </div>

            </div>


            <div
                style="
                    margin-top:15px;
                    color:#788594;
                    font-size:12px;
                "
            >

                ثبت:
                ${
                    ticket.createdAt
                    ?
                    new Date(
                        ticket.createdAt
                    ).toLocaleString(
                        "fa-IR"
                    )
                    :
                    "—"
                }

            </div>

        </article>

    `;

}


// =======================================
// ESCAPE JS
// =======================================

function escapeJS(value) {

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}


// =======================================
// RENDER MESSAGES
// =======================================

function renderMessages(
    messages
) {

    return messages
        .map(message => {

            const command =
                message.sender ===
                "command";


            const commander =
                message.commander ||
                message.senderName ||
                "";


            const rank =
                message.rank ||
                "";


            return `

                <div class="
                    message
                    ${
                        command
                        ? "command"
                        : "applicant"
                    }
                ">

                    <div class="message-name">

                        ${
                            command
                            ? "👮 فرماندهی"
                            : "👤 متقاضی"
                        }

                        ${
                            command &&
                            commander
                            ?

                            `

                            -
                            ${escapeHTML(
                                commander
                            )}

                            ${
                                rank
                                ?
                                `(${escapeHTML(
                                    rank
                                )})`
                                :
                                ""
                            }

                            `

                            :

                            ""

                        }

                    </div>


                    <div class="message-text">

                        ${escapeHTML(
                            message.message
                        )}

                    </div>


                    <small
                        class="message-time"
                    >

                        ${
                            message.createdAt
                            ?
                            new Date(
                                message.createdAt
                            ).toLocaleString(
                                "fa-IR"
                            )
                            :
                            ""
                        }

                    </small>

                </div>

            `;

        })
        .join("");

}


// =======================================
// UPDATE TICKET
// =======================================

async function updateTicket(
    id,
    status
) {

    const textarea =
        document.getElementById(
            "reply-" + id
        );


    const reply =
        textarea
        ? textarea.value.trim()
        : "";


    if (!reply) {

        showMessage(
            "لطفاً متن پاسخ فرماندهی را وارد کنید.",
            "error"
        );

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id),

                {

                    method: "PUT",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({

                            status,

                            reply

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "خطا در بروزرسانی"
            );

        }


        showMessage(
            "تیکت با موفقیت بروزرسانی شد."
        );


        await loadTickets();

    } catch (error) {

        console.error(
            "Update Ticket Error:",
            error
        );


        showMessage(
            error.message ||
            "بروزرسانی انجام نشد.",
            "error"
        );

    }

}


// =======================================
// SEND COMMAND MESSAGE
// =======================================

async function sendMessage(
    id
) {

    const input =
        document.getElementById(
            "message-" + id
        );


    if (!input) {
        return;
    }


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id) +
                "/messages",

                {

                    method: "POST",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({

                            message,

                            sender:
                                "command"

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "خطا در ارسال پیام"
            );

        }


        input.value = "";


        showMessage(
            "پیام ارسال شد."
        );


        await loadTickets();

    } catch (error) {

        console.error(
            "Send Message Error:",
            error
        );


        showMessage(
            error.message ||
            "ارسال پیام انجام نشد.",
            "error"
        );

    }

}


// =======================================
// DELETE TICKET
// فقط SuperAdmin
// =======================================

async function deleteTicket(
    id
) {

    if (
        !currentUser ||
        (
            currentUser.role !==
                "superadmin" &&
            currentUser.role !==
                "owner"
        )
    ) {

        showMessage(
            "شما اجازه حذف تیکت را ندارید.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "⚠️ آیا مطمئن هستید که می‌خواهید این تیکت را حذف کنید؟"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id),

                {

                    method: "DELETE",

                    headers:
                        authHeaders()

                }

            );


        const data =
            await response.json();


        if (!response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "حذف انجام نشد"
            );

        }


        showMessage(
            "🗑️ تیکت حذف شد."
        );


        await loadTickets();


    } catch (error) {

        console.error(
            "Delete Error:",
            error
        );


        showMessage(
            error.message ||
            "حذف تیکت انجام نشد.",
            "error"
        );

    }

}


// =======================================
// LOAD LOGS
// فقط SuperAdmin
// =======================================

async function loadLogs() {

    if (
        !currentUser ||
        (
            currentUser.role !==
                "superadmin" &&
            currentUser.role !==
                "owner"
        )
    ) {

        return;

    }


    const box =
        document.getElementById(
            "logs"
        );


    box.innerHTML = `

        <div class="empty">

            ⏳ در حال دریافت لاگ‌ها...

        </div>

    `;


    try {

        const response =
            await fetch(
                API_URL + "/logs",
                {
                    headers:
                        authHeaders()
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "خطا در دریافت لاگ‌ها"
            );

        }


        const logs =
            Array.isArray(data)
            ? data
            : (
                Array.isArray(
                    data.logs
                )
                ? data.logs
                : []
            );


        if (
            logs.length === 0
        ) {

            box.innerHTML = `

                <div class="empty">

                    📭 هنوز لاگی ثبت نشده است.

                </div>

            `;

            return;

        }


        box.innerHTML =
            logs
            .map(log => `

                <div class="log-item">

                    <div>

                        <strong>
                            ${escapeHTML(
                                log.action ||
                                "ACTION"
                            )}
                        </strong>

                    </div>


                    <div
                        style="
                            margin-top:8px;
                            line-height:1.8;
                        "
                    >

                        👮 فرمانده:

                        <strong>

                            ${escapeHTML(
                                log.commanderName ||
                                log.userName ||
                                log.username ||
                                "—"
                            )}

                        </strong>


                        <br>


                        🎖️ Rank:

                        ${escapeHTML(
                            log.rank ||
                            "—"
                        )}


                        <br>


                        🆔 تیکت:

                        <span
                            style="
                                direction:ltr;
                                display:inline-block;
                            "
                        >

                            ${escapeHTML(
                                log.ticketId ||
                                "—"
                            )}

                        </span>


                        ${
                            log.message
                            ?

                            `

                            <br>

                            💬 پیام:

                            ${escapeHTML(
                                log.message
                            )}

                            `

                            :

                            ""

                        }

                    </div>


                    <div class="log-time">

                        ${
                            log.createdAt
                            ?
                            new Date(
                                log.createdAt
                            ).toLocaleString(
                                "fa-IR"
                            )
                            :
                            "—"
                        }

                    </div>

                </div>

            `)
            .join("");


    } catch (error) {

        console.error(
            "Logs Error:",
            error
        );


        box.innerHTML = `

            <div class="error">

                ❌ دریافت لاگ‌ها انجام نشد.

            </div>

        `;

    }

}

document
.getElementById(
    "searchInput"
)
.addEventListener(
    "input",
    renderTickets
);


document
.getElementById(
    "statusFilter"
)
.addEventListener(
    "change",

);


// =======================================
// AUTO REFRESH
// =======================================

let refreshTimer = null;


function startAutoRefresh() {

    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(
            async () => {

                try {

                    await loadTickets();

                } catch (error) {

                    console.error(
                        error
                    );

                }

            },
            2000
        );

}

// START
// =======================================

(async function() {

    const authenticated =
        await checkAuth();


    if (!authenticated) {
        return;
    }


    await loadTickets();


    startAutoRefresh();

})();

document.addEventListener(

    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            loadTickets();

        }

    }
);
