<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">

<style>

* {
    box-sizing: border-box;
}

body.command-page {
    min-height: 100vh;
}

/* ================================
   ADMIN
================================ */

.admin-container {
    width: 1200px;
    max-width: 96%;
    margin: 30px auto;
}

.admin-panel {
    background: rgba(5, 10, 18, .78);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 20px 70px rgba(0,0,0,.35);
}

/* ================================
   HEADER
================================ */

.command-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    padding-bottom: 22px;
    border-bottom: 1px solid rgba(255,255,255,.1);
}

.command-user {
    display: flex;
    align-items: center;
    gap: 15px;
}

.command-avatar {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    object-fit: contain;
    background: rgba(255,255,255,.08);
    padding: 8px;
    border: 1px solid rgba(77,166,255,.3);
}

.command-user h1 {
    margin: 0;
    color: #4da6ff;
    font-size: 24px;
}

.command-user p {
    margin: 5px 0 0;
    color: #aaa;
}

/* ================================
   TABS
================================ */

.admin-tabs {
    display: flex;
    gap: 10px;
    margin: 25px 0;
    flex-wrap: wrap;
}

.admin-tab {
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06);
    color: white;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    transition: .25s;
}

.admin-tab:hover {
    background: rgba(255,255,255,.12);
}

.admin-tab.active {
    background: #006eff;
    border-color: #168cff;
}

/* ================================
   STATS
================================ */

.admin-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat-box {
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 20px;
}

.stat-box span {
    display: block;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 8px;
}

.stat-box strong {
    font-size: 28px;
    color: #4da6ff;
}

/* ================================
   SEARCH
================================ */

.admin-search {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(0,0,0,.25);
    color: white;
    outline: none;
    margin-bottom: 20px;
}

.admin-search:focus {
    border-color: #168cff;
    box-shadow: 0 0 15px rgba(22,140,255,.2);
}

/* ================================
   TICKET
================================ */

.ticket-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.ticket-card {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px;
    padding: 22px;
}

.ticket-card:hover {
    border-color: rgba(77,166,255,.35);
}

.ticket-head {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 15px;
}

.ticket-id {
    direction: ltr;
    font-family: monospace;
    color: #aaa;
    font-size: 12px;
}

.ticket-type {
    color: #4da6ff;
    font-weight: bold;
}

.ticket-info {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 15px 0;
}

.info-item {
    background: rgba(0,0,0,.18);
    padding: 12px;
    border-radius: 10px;
}

.info-item span {
    display: block;
    color: #888;
    font-size: 12px;
    margin-bottom: 5px;
}

.info-item strong {
    word-break: break-word;
}

/* ================================
   STATUS
================================ */

.status {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
}

.status-pending {
    color: #ffd166;
    background: rgba(255,209,102,.1);
}

.status-accepted {
    color: #00ff88;
    background: rgba(0,255,136,.1);
}

.status-rejected {
    color: #ff5555;
    background: rgba(255,85,85,.1);
}

/* ================================
   DETAILS
================================ */

.ticket-details {
    margin-top: 15px;
    padding: 15px;
    background: rgba(0,0,0,.18);
    border-radius: 12px;
    white-space: pre-wrap;
    line-height: 1.8;
}

/* ================================
   CONTROLS
================================ */

.ticket-controls {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 10px;
    margin-top: 18px;
}

.ticket-controls select,
.ticket-controls textarea {
    width: 100%;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 12px;
    outline: none;
}

.ticket-controls textarea {
    min-height: 90px;
    resize: vertical;
}

.ticket-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
}

/* ================================
   CHAT
================================ */

.chat-box {
    margin-top: 20px;
    border-top: 1px solid rgba(255,255,255,.1);
    padding-top: 20px;
}

.chat-title {
    color: #4da6ff;
    margin-bottom: 12px;
}

.messages {
    max-height: 350px;
    overflow-y: auto;
    background: #03070d;
    border-radius: 12px;
    padding: 12px;
}

.message {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    background: rgba(255,255,255,.05);
}

.message.command {
    border-right: 3px solid #3aa0ff;
}

.message.applicant {
    border-right: 3px solid #35d07f;
}

.message-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.message-text {
    white-space: pre-wrap;
    line-height: 1.7;
}

.message-time {
    color: #777;
    font-size: 11px;
    display: block;
    margin-top: 5px;
}

.chat-send-area {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.chat-send-area textarea {
    flex: 1;
    min-height: 70px;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 12px;
    resize: vertical;
}

/* ================================
   LOGS
================================ */

.logs-panel {
    display: none;
}

.log-card {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 15px;
    padding: 17px;
    margin-bottom: 12px;
}

.log-card.danger {
    border-right: 3px solid #ff4444;
}

.log-card.message {
    border-right: 3px solid #3aa0ff;
}

.log-card.update {
    border-right: 3px solid #ffd166;
}

.log-card.create {
    border-right: 3px solid #35d07f;
}

.log-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.log-action {
    color: #4da6ff;
    font-weight: bold;
}

.log-time {
    color: #777;
    font-size: 11px;
}

.log-info {
    margin-top: 10px;
    color: #ddd;
    line-height: 1.8;
}

.log-admin {
    color: #00ff88;
    font-weight: bold;
}

/* ================================
   HIDDEN
================================ */

.hidden {
    display: none !important;
}

/* ================================
   RESPONSIVE
================================ */

@media(max-width:800px) {

    .admin-stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .ticket-info {
        grid-template-columns: 1fr;
    }

    .ticket-controls {
        grid-template-columns: 1fr;
    }

}

@media(max-width:500px) {

    .admin-panel {
        padding: 18px;
    }

    .admin-stats {
        grid-template-columns: 1fr;
    }

    .chat-send-area {
        flex-direction: column;
    }

}

</style>

</head>

<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
"https://lspd-site-11.onrender.com";


const POLL_INTERVAL =
2000;


let tickets = [];

let currentAdmin = null;

let currentOpenTicket = null;


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function safeText(value) {

    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {

        return "—";

    }

    return escapeHTML(value);

}


function statusClass(status) {

    if (status === "Accepted") {
        return "status-accepted";
    }

    if (status === "Rejected") {
        return "status-rejected";
    }

    return "status-pending";

}


function statusText(status) {

    if (status === "Accepted") {
        return "🟢 تایید شده";
    }

    if (status === "Rejected") {
        return "🔴 رد شده";
    }

    return "🟡 در انتظار";

}


function requestType(type) {

    const types = {

        membership: "🚔 عضویت LSPD",

        division: "🎖️ دیویژن",

        resignation: "📤 استعفا",

        rankup: "⬆️ Rank Up"

    };

    return types[type] || "📄 درخواست";

}


/* =====================================================
   AUTH
===================================================== */

async function verifyAdmin() {

    const token =
        localStorage.getItem("lspdAdminToken");

    const oldLogin =
        localStorage.getItem("lspdAdmin");


    /*
     * اگر نسخه قدیمی لاگین هنوز استفاده می‌شود
     * اجازه نمایش اولیه داده می‌شود.
     */

    if (!token && oldLogin !== "true") {

        window.location.href =
            "command.html";

        return;

    }


    try {

        if (!token) {

            currentAdmin = {

                username: "LSPD",

                name: "LSPD Command",

                rank: "Command"

            };

            updateAdminUI();

            return;

        }


        const response =
            await fetch(
                API_URL + "/auth/me",
                {

                    headers: {

                        Authorization:
                            "Bearer " + token

                    }

                }
            );


        if (!response.ok) {

            throw new Error(
                "Unauthorized"
            );

        }


        const data =
            await response.json();


        currentAdmin =
            data.user ||
            data;


        updateAdminUI();


    } catch (error) {

        console.error(
            "Auth error:",
            error
        );

        localStorage.removeItem(
            "lspdAdminToken"
        );

        localStorage.removeItem(
            "lspdAdmin"
        );

        window.location.href =
            "command.html";

    }

}


function updateAdminUI() {

    if (!currentAdmin) {
        return;
    }


    const username =
        currentAdmin.username ||
        currentAdmin.name ||
        "LSPD";


    const name =
        currentAdmin.name ||
        username;


    const rank =
        currentAdmin.rank ||
        currentAdmin.role ||
        "Command";


    document.getElementById(
        "commanderName"
    ).innerText =
        "👮 " + name;


    document.getElementById(
        "commanderRank"
    ).innerText =
        "Rank: " + rank;


    /*
     * فقط SEDJAVAD لاگ‌ها و حذف را می‌بیند.
     */

    const isSuperAdmin =
        username.toUpperCase() ===
        "SEDJAVAD";


    if (isSuperAdmin) {

        document
        .getElementById("logsTab")
        .classList
        .remove("hidden");

    }

}


/* =====================================================
   LOAD TICKETS
===================================================== */

async function loadTickets(silent = false) {

    try {

        const response =
            await fetch(
                API_URL + "/tickets",
                {

                    cache: "no-store",

                    headers: {

                        "Cache-Control":
                            "no-cache"

                    }

                }
            );


        if (!response.ok) {

            throw new Error(
                "Tickets request failed"
            );

        }


        const data =
            await response.json();


        if (!Array.isArray(data)) {

            throw new Error(
                "Invalid ticket data"
            );

        }


        /*
         * جلوگیری از رندر بی‌دلیل
         */

        const oldData =
            JSON.stringify(tickets);

        const newData =
            JSON.stringify(data);


        tickets = data;


        updateStats();


        if (
            !silent ||
            oldData !== newData
        ) {

            renderTickets();

        }


        setConnection(
            true
        );


    } catch (error) {

        console.error(
            "Load tickets error:",
            error
        );


        setConnection(
            false
        );

    }

}


/* =====================================================
   CONNECTION
===================================================== */

function setConnection(connected) {

    const box =
        document.getElementById(
            "connectionStatus"
        );


    if (connected) {

        box.className =
            "status status-accepted";

        box.innerText =
            "🟢 متصل";

    } else {

        box.className =
            "status status-rejected";

        box.innerText =
            "🔴 خطا در اتصال";

    }

}


/* =====================================================
   STATS
===================================================== */

function updateStats() {

    const total =
        tickets.length;


    const pending =
        tickets.filter(
            t =>
                t.status ===
                "Pending"
        ).length;


    const accepted =
        tickets.filter(
            t =>
                t.status ===
                "Accepted"
        ).length;


    const rejected =
        tickets.filter(
            t =>
                t.status ===
                "Rejected"
        ).length;


    document.getElementById(
        "totalTickets"
    ).innerText =
        total;


    document.getElementById(
        "pendingTickets"
    ).innerText =
        pending;


    document.getElementById(
        "acceptedTickets"
    ).innerText =
        accepted;


    document.getElementById(
        "rejectedTickets"
    ).innerText =
        rejected;

}


/* =====================================================
   RENDER
===================================================== */

function renderTickets() {

    const list =
        document.getElementById(
            "ticketList"
        );


    const search =
        document
        .getElementById(
            "ticketSearch"
        )
        .value
        .trim()
        .toLowerCase();


    let filtered =
        tickets.filter(
            ticket => {

                if (!search) {
                    return true;
                }


                const content =
                    [

                        ticket._id,

                        ticket.icName,

                        ticket.ocName,

                        ticket.name,

                        ticket.discord,

                        ticket.discordId,

                        ticket.steamHex,

                        ticket.cmx,

                        ticket.requestType,

                        ticket.status

                    ]
                    .join(" ")
                    .toLowerCase();


                return content.includes(
                    search
                );

            }
        );


    if (!filtered.length) {

        list.innerHTML = `

            <div class="ticket-card">

                <p style="
                    color:#888;
                    text-align:center;
                ">

                    📭 هیچ تیکتی پیدا نشد.

                </p>

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered
        .map(
            ticket =>
                createTicketHTML(ticket)
        )
        .join("");

}


/* =====================================================
   TICKET HTML
===================================================== */

function createTicketHTML(ticket) {

    const isSuperAdmin =
        currentAdmin &&
        String(
            currentAdmin.username ||
            ""
        ).toUpperCase() ===
        "SEDJAVAD";


    let exam = "";


    if (
        ticket.score !== null &&
        ticket.score !== undefined
    ) {

        exam = `

            <div class="info-item">

                <span>نمره آزمون</span>

                <strong>

                    ${safeText(ticket.score)}
                    / 20

                    ${
                        ticket.passed
                        ? " ✅"
                        : " ❌"
                    }

                </strong>

            </div>

        `;

    }


    const deleteButton =
        isSuperAdmin
        ?
        `

            <button
                class="btn"
                style="
                    background:#9e1b1b;
                "
                onclick="deleteTicket('${ticket._id}')"
            >

                🗑️ حذف تیکت

            </button>

        `
        :
        "";


    return `

        <article
            class="ticket-card"
            data-ticket="${escapeHTML(ticket._id)}"
        >


            <div class="ticket-head">

                <div>

                    <div class="ticket-type">

                        ${requestType(
                            ticket.requestType
                        )}

                    </div>

                    <div class="ticket-id">

                        ${escapeHTML(
                            ticket._id
                        )}

                    </div>

                </div>


                <span class="
                    status
                    ${statusClass(ticket.status)}
                ">

                    ${statusText(ticket.status)}

                </span>

            </div>


            <div class="ticket-info">


                <div class="info-item">

                    <span>IC Name</span>

                    <strong>
                        ${safeText(
                            ticket.icName ||
                            ticket.name
                        )}
                    </strong>

                </div>


                <div class="info-item">

                    <span>OC Name</span>

                    <strong>
                        ${safeText(
                            ticket.ocName
                        )}
                    </strong>

                </div>


                <div class="info-item">

                    <span>Discord</span>

                    <strong>
                        ${safeText(
                            ticket.discord ||
                            ticket.discordId
                        )}
                    </strong>

                </div>


                <div class="info-item">

                    <span>Steam Hex</span>

                    <strong>
                        ${safeText(
                            ticket.steamHex
                        )}
                    </strong>

                </div>


                <div class="info-item">

                    <span>CMX</span>

                    <strong>
                        ${safeText(
                            ticket.cmx
                        )}
                    </strong>

                </div>


                <div class="info-item">

                    <span>سن</span>

                    <strong>
                        ${safeText(
                            ticket.age
                        )}
                    </strong>

                </div>


                ${exam}


            </div>


            ${
                ticket.experience
                ?
                `
                <div class="ticket-details">

                    <b>📚 سابقه:</b>

                    ${safeText(
                        ticket.experience
                    )}

                </div>
                `
                :
                ""
            }


            ${
                ticket.reason
                ?
                `
                <div class="ticket-details">

                    <b>📝 دلیل درخواست:</b>

                    ${safeText(
                        ticket.reason
                    )}

                </div>
                `
                :
                ""
            }


            <div class="ticket-controls">


                <select
                    id="status-${ticket._id}"
                >

                    <option
                        value="Pending"
                        ${
                            ticket.status === "Pending"
                            ? "selected"
                            : ""
                        }
                    >
                        🟡 در انتظار
                    </option>


                    <option
                        value="Accepted"
                        ${
                            ticket.status === "Accepted"
                            ? "selected"
                            : ""
                        }
                    >
                        🟢 تایید
                    </option>


                    <option
                        value="Rejected"
                        ${
                            ticket.status === "Rejected"
                            ? "selected"
                            : ""
                        }
                    >
                        🔴 رد
                    </option>

                </select>


                <textarea
                    id="reply-${ticket._id}"
                    placeholder="پاسخ فرماندهی..."
                >${escapeHTML(
                    ticket.reply || ""
                )}</textarea>


            </div>


            <div class="ticket-actions">


                <button
                    class="btn primary"
                    onclick="updateTicket('${ticket._id}')"
                >

                    💾 ثبت پاسخ و وضعیت

                </button>


                <button
                    class="btn"
                    onclick="openChat('${ticket._id}')"
                >

                    💬 مشاهده چت

                </button>


                ${deleteButton}


            </div>


            <div
                id="chat-${ticket._id}"
                class="chat-box hidden"
            >

                <h3 class="chat-title">

                    💬 گفتگوی درخواست

                </h3>


                <div
                    id="messages-${ticket._id}"
                    class="messages"
                >

                    ⏳ در حال دریافت...

                </div>


                <div class="chat-send-area">

                    <textarea
                        id="chatInput-${ticket._id}"
                        placeholder="پیام فرماندهی..."
                    ></textarea>


                    <button
                        class="btn primary"
                        onclick="sendCommandMessage('${ticket._id}')"
                    >

                        📨 ارسال

                    </button>

                </div>

            </div>


        </article>

    `;

}


/* =====================================================
   UPDATE TICKET
===================================================== */

async function updateTicket(id) {

    const status =
        document.getElementById(
            "status-" + id
        ).value;


    const reply =
        document.getElementById(
            "reply-" + id
        ).value
        .trim();


    try {

        const token =
            localStorage.getItem(
                "lspdAdminToken"
            );


        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id),

                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        ...(token
                            ?
                            {
                                Authorization:
                                    "Bearer " + token
                            }
                            :
                            {})

                    },

                    body: JSON.stringify({

                        status,

                        reply,

                        /*
                         * مشخصات فرمانده
                         * برای ثبت خودکار لاگ
                         */

                        commander:
                            currentAdmin || null

                    })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Update error"
            );

        }


        alert(
            "✅ تیکت با موفقیت بروزرسانی شد."
        );


        await loadTickets();


        if (
            currentAdmin &&
            String(
                currentAdmin.username
            ).toUpperCase() ===
            "SEDJAVAD"
        ) {

            await loadLogs();

        }


    } catch (error) {

        console.error(
            "Update ticket error:",
            error
        );


        alert(
            "❌ بروزرسانی تیکت انجام نشد."
        );

    }

}


/* =====================================================
   CHAT
===================================================== */

async function openChat(id) {

    const box =
        document.getElementById(
            "chat-" + id
        );


    if (!box) {
        return;
    }


    box.classList.toggle(
        "hidden"
    );


    if (
        !box.classList.contains(
            "hidden"
        )
    ) {

        await loadTicketMessages(
            id
        );

    }

}


async function loadTicketMessages(id) {

    const messagesBox =
        document.getElementById(
            "messages-" + id
        );


    if (!messagesBox) {
        return;
    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id) +
                "/messages",

                {
                    cache: "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                "Messages error"
            );

        }


        const messages =
            await response.json();


        if (
            !Array.isArray(messages) ||
            messages.length === 0
        ) {

            messagesBox.innerHTML = `

                <p style="color:#777;">
                    هنوز پیامی ثبت نشده است.
                </p>

            `;

            return;

        }


        messagesBox.innerHTML =
            messages
            .map(
                message => {

                    const command =
                        message.sender ===
                        "command";


                    return `

                        <div class="
                            message
                            ${
                                command
                                ? "command"
                                : "applicant"
                            }
                        ">

                            <div class="message-name">

                                ${
                                    command
                                    ? "👮 فرماندهی"
                                    : "👤 متقاضی"
                                }

                            </div>


                            <div class="message-text">

                                ${escapeHTML(
                                    message.message
                                )}

                            </div>


                            <small class="message-time">

                                ${
                                    message.createdAt
                                    ?
                                    new Date(
                                        message.createdAt
                                    ).toLocaleString(
                                        "fa-IR"
                                    )
                                    :
                                    ""
                                }

                            </small>

                        </div>

                    `;

                }
            )
            .join("");


        messagesBox.scrollTop =
            messagesBox.scrollHeight;


    } catch (error) {

        console.error(
            error
        );


        messagesBox.innerHTML = `

            <p style="color:#f55;">
                ❌ خطا در دریافت پیام‌ها
            </p>

        `;

    }

}


/* =====================================================
   SEND COMMAND MESSAGE
===================================================== */

async function sendCommandMessage(id) {

    const input =
        document.getElementById(
            "chatInput-" + id
        );


    if (!input) {
        return;
    }


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    if (message.length > 2000) {

        alert(
            "پیام نمی‌تواند بیشتر از ۲۰۰۰ کاراکتر باشد."
        );

        return;

    }


    try {

        const token =
            localStorage.getItem(
                "lspdAdminToken"
            );


        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id) +
                "/messages",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        ...(token
                            ?
                            {
                                Authorization:
                                    "Bearer " + token
                            }
                            :
                            {})

                    },

                    body: JSON.stringify({

                        message,

                        sender:
                            "command",

                        commander:
                            currentAdmin || null

                    })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Send message error"
            );

        }


        input.value = "";


        await loadTicketMessages(
            id
        );


        if (
            currentAdmin &&
            String(
                currentAdmin.username
            ).toUpperCase() ===
            "SEDJAVAD"
        ) {

            await loadLogs();

        }


    } catch (error) {

        console.error(
            "Command message error:",
            error
        );


        alert(
            "❌ ارسال پیام انجام نشد."
        );

    }

}


/* =====================================================
   DELETE TICKET
===================================================== */

async function deleteTicket(id) {

    const username =
        currentAdmin &&
        String(
            currentAdmin.username ||
            ""
        ).toUpperCase();


    if (
        username !==
        "SEDJAVAD"
    ) {

        alert(
            "⛔ فقط Super Admin اجازه حذف تیکت دارد."
        );

        return;

    }


    const confirmed =
        confirm(
            "⚠️ آیا مطمئن هستید این تیکت حذف شود؟\nاین عملیات قابل بازگشت نیست."
        );


    if (!confirmed) {
        return;
    }


    try {

        const token =
            localStorage.getItem(
                "lspdAdminToken"
            );


        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id),

                {

                    method: "DELETE",

                    headers: {

                        ...(token
                            ?
                            {
                                Authorization:
                                    "Bearer " + token
                            }
                            :
                            {})

                    }

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Delete error"
            );

        }


        alert(
            "🗑️ تیکت حذف شد."
        );


        await loadTickets();


        await loadLogs();


    } catch (error) {

        console.error(
            "Delete error:",
            error
        );


        alert(
            "❌ حذف تیکت انجام نشد."
        );

    }

}


/* =====================================================
   LOGS
===================================================== */

async function loadLogs() {

    if (!currentAdmin) {
        return;
    }


    const username =
        String(
            currentAdmin.username ||
            ""
        ).toUpperCase();


    if (
        username !==
        "SEDJAVAD"
    ) {

        return;

    }


    const list =
        document.getElementById(
            "logsList"
        );


    try {

        const token =
            localStorage.getItem(
                "lspdAdminToken"
            );


        const response =
            await fetch(

                API_URL +
                "/logs",

                {

                    cache: "no-store",

                    headers: {

                        ...(token
                            ?
                            {
                                Authorization:
                                    "Bearer " + token
                            }
                            :
                            {})

                    }

                }

            );


        if (!response.ok) {

            throw new Error(
                "Logs error"
            );

        }


        const logs =
            await response.json();


        if (
            !Array.isArray(logs) ||
            logs.length === 0
        ) {

            list.innerHTML = `

                <div class="log-card">

                    <p style="color:#777;">

                        هنوز لاگی ثبت نشده است.

                    </p>

                </div>

            `;

            return;

        }


        list.innerHTML =
            logs
            .map(
                log => {

                    let actionText =
                        "رویداد";


                    let className =
                        "log-card";


                    if (
                        log.action ===
                        "message"
                    ) {

                        actionText =
                            "💬 ارسال پیام";

                        className +=
                            " message";

                    }


                    if (
                        log.action ===
                        "update_ticket"
                    ) {

                        actionText =
                            "📝 بروزرسانی تیکت";

                        className +=
                            " update";

                    }


                    if (
                        log.action ===
                        "delete_ticket"
                    ) {

                        actionText =
                            "🗑️ حذف تیکت";

                        className +=
                            " danger";

                    }


                    if (
                        log.action ===
                        "create_ticket"
                    ) {

                        actionText =
                            "📨 ثبت تیکت";

                        className +=
                            " create";

                    }


                    const commander =
                        log.commander ||
                        {};


                    const commanderName =
                        commander.name ||
                        commander.username ||
                        "نامشخص";


                    const commanderRank =
                        commander.rank ||
                        commander.role ||
                        "نامشخص";


                    return `

                        <div class="${className}">


                            <div class="log-top">

                                <span class="log-action">

                                    ${actionText}

                                </span>


                                <span class="log-time">

                                    ${
                                        log.createdAt
                                        ?
                                        new Date(
                                            log.createdAt
                                        ).toLocaleString(
                                            "fa-IR"
                                        )
                                        :
                                        ""
                                    }

                                </span>

                            </div>


                            <div class="log-info">

                                <b>
                                    فرمانده:
                                </b>

                                <span class="log-admin">

                                    ${safeText(
                                        commanderName
                                    )}

                                </span>

                                <br>


                                <b>
                                    رنک:
                                </b>

                                ${safeText(
                                    commanderRank
                                )}

                                <br>


                                ${
                                    commander.username
                                    ?
                                    `
                                    <b>
                                        Username:
                                    </b>

                                    ${safeText(
                                        commander.username
                                    )}

                                    <br>
                                    `
                                    :
                                    ""
                                }


                                ${
                                    log.ticketId
                                    ?
                                    `
                                    <b>
                                        Ticket ID:
                                    </b>

                                    <span style="direction:ltr;display:inline-block;">

                                        ${safeText(
                                            log.ticketId
                                        )}

                                    </span>

                                    <br>
                                    `
                                    :
                                    ""
                                }


                                ${
                                    log.message
                                    ?
                                    `
                                    <b>
                                        پیام:
                                    </b>

                                    ${safeText(
                                        log.message
                                    )}

                                    <br>
                                    `
                                    :
                                    ""
                                }


                                ${
                                    log.details
                                    ?
                                    `
                                    <b>
                                        جزئیات:
                                    </b>

                                    ${safeText(
                                        log.details
                                    )}
                                    `
                                    :
                                    ""
                                }

                            </div>


                        </div>

                    `;

                }
            )
            .join("");


    } catch (error) {

        console.error(
            "Load logs error:",
            error
        );


        list.innerHTML = `

            <div class="log-card danger">

                ❌ دریافت لاگ‌ها با مشکل مواجه شد.

            </div>

        `;

    }

}


/* =====================================================
   TABS
===================================================== */

function showTab(tab) {

    const ticketsPanel =
        document.getElementById(
            "ticketsPanel"
        );


    const logsPanel =
        document.getElementById(
            "logsPanel"
        );


    const ticketsTab =
        document.getElementById(
            "ticketsTab"
        );


    const logsTab =
        document.getElementById(
            "logsTab"
        );


    if (
        tab ===
        "logs"
    ) {

        const username =
            currentAdmin &&
            String(
                currentAdmin.username ||
                ""
            ).toUpperCase();


        if (
            username !==
            "SEDJAVAD"
        ) {

            return;

        }


        ticketsPanel.style.display =
            "none";

        logsPanel.style.display =
            "block";


        ticketsTab.classList.remove(
            "active"
        );

        logsTab.classList.add(
            "active"
        );


        loadLogs();


    } else {

        ticketsPanel.style.display =
            "block";

        logsPanel.style.display =
            "none";


        ticketsTab.classList.add(
            "active"
        );

        logsTab.classList.remove(
            "active"
        );

    }

}


/* =====================================================
   SEARCH
===================================================== */

document
.getElementById("ticketSearch")
.addEventListener(
    "input",
    renderTickets
);


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    async function() {

        await loadTickets(
            true
        );


        /*
         * اگر چت باز است،
         * پیام‌ها هم هر 2 ثانیه بروزرسانی شوند.
         */

        const openChats =
            document.querySelectorAll(
                ".chat-box:not(.hidden)"
            );


        for (
            const chat of openChats
        ) {

            const id =
                chat.id.replace(
                    "chat-",
                    ""
                );


            if (id) {

                await loadTicketMessages(
                    id
                );

            }

        }


        /*
         * فقط Super Admin لاگ‌ها را
         * اتوماتیک می‌گیرد.
         */

        if (
            currentAdmin &&
            String(
                currentAdmin.username ||
                ""
            ).toUpperCase() ===
            "SEDJAVAD"
        ) {

            const logsPanel =
                document.getElementById(
                    "logsPanel"
                );


            if (
                logsPanel.style.display !==
                "none"
            ) {

                await loadLogs();

            }

        }

    },
    POLL_INTERVAL
);


/* =====================================================
   LOGOUT
===================================================== */

function logoutAdmin() {

    localStorage.removeItem(
        "lspdAdminToken"
    );

    localStorage.removeItem(
        "lspdAdmin"
    );

}


/* =====================================================
   START
===================================================== */

(async function() {

    await verifyAdmin();

    await loadTickets();

})();
