<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vanguard LSPD | Command Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #080d14;
            color: #eef4ff;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        .topbar {
            min-height: 70px;
            padding: 15px 25px;
            background: #0d1520;
            border-bottom: 1px solid #26384d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
        }

        .brand small {
            display: block;
            color: #8fa4bc;
            font-size: 11px;
            margin-top: 5px;
        }

        .top-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            color: white;
            background: #1d5fa7;
        }

        button:hover {
            opacity: .9;
        }

        .danger {
            background: #a92d38;
        }

        .success {
            background: #18794e;
        }

        .warning {
            background: #9a6b13;
        }

        .secondary {
            background: #27384d;
        }

        .container {
            max-width: 1500px;
            margin: auto;
            padding: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: #101a27;
            border: 1px solid #24364a;
            border-radius: 12px;
            padding: 18px;
        }

        .stat span {
            color: #8fa4bc;
            font-size: 12px;
        }

        .stat strong {
            display: block;
            margin-top: 10px;
            font-size: 28px;
        }

        .panel {
            background: #0d1622;
            border: 1px solid #24364a;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #09111b;
            color: #fff;
            border: 1px solid #2b4057;
            border-radius: 8px;
            padding: 10px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3789dd;
        }

        .filter-item {
            min-width: 180px;
            flex: 1;
        }

        .tickets {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .ticket {
            background: #101b28;
            border: 1px solid #263a50;
            border-radius: 12px;
            padding: 16px;
        }

        .ticket-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ticket-id {
            color: #72b7ff;
            font-family: monospace;
            font-size: 12px;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
        }

        .status.Pending {
            background: #715713;
        }

        .status.Accepted {
            background: #17633f;
        }

        .status.Rejected {
            background: #762932;
        }

        .status.Closed {
            background: #394758;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .field {
            background: #0a121c;
            border: 1px solid #1e3042;
            padding: 10px;
            border-radius: 8px;
        }

        .field label {
            display: block;
            color: #7890aa;
            font-size: 10px;
            margin-bottom: 6px;
        }

        .field div {
            overflow-wrap: anywhere;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 15px;
        }

        .chat {
            margin-top: 15px;
            border-top: 1px solid #26384d;
            padding-top: 15px;
        }

        .messages {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .message {
            border-radius: 8px;
            padding: 10px;
            background: #162333;
        }

        .message.command {
            background: #153b35;
        }

        .message-meta {
            color: #8fa4bc;
            font-size: 10px;
            margin-bottom: 5px;
        }

        .message-body {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .chat-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .empty {
            text-align: center;
            color: #7d91a8;
            padding: 30px;
        }

        .hidden {
            display: none !important;
        }

        #toast {
            position: fixed;
            left: 20px;
            bottom: 20px;
            background: #172536;
            border: 1px solid #34506d;
            padding: 12px 18px;
            border-radius: 8px;
            display: none;
            z-index: 9999;
        }

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .stats,
            .grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        🚔 Vanguard LSPD
        <small>Command Center</small>
    </div>

    <div class="top-actions">
        <button class="secondary" onclick="loadTickets()">بروزرسانی</button>
        <button class="danger" onclick="logout()">خروج</button>
    </div>
</header>

<main class="container">

    <section class="stats">
        <div class="stat">
            <span>کل تیکت‌ها</span>
            <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
            <span>در انتظار</span>
            <strong id="pendingCount">0</strong>
        </div>

        <div class="stat">
            <span>تأیید شده</span>
            <strong id="acceptedCount">0</strong>
        </div>

        <div class="stat">
            <span>بسته شده</span>
            <strong id="closedCount">0</strong>
        </div>
    </section>

    <section class="panel">

        <h3>فیلتر درخواست‌ها</h3>

        <div class="filters">

            <div class="filter-item">
                <label>وضعیت</label>

                <select id="statusFilter" onchange="renderTickets()">
                    <option value="">همه</option>
                    <option value="Pending">Pending</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Rejected">Rejected</option>
                    <option value="Closed">Closed</option>
                </select>
            </div>

            <div class="filter-item">
                <label>نوع درخواست</label>

                <select id="typeFilter" onchange="renderTickets()">
                    <option value="">همه</option>
                    <option value="membership">Membership</option>
                    <option value="division">Division</option>
                    <option value="resignation">Resignation</option>
                    <option value="rankup">Rank Up</option>
                    <option value="exam">Exam</option>
                </select>
            </div>

            <div class="filter-item">
                <label>جستجو</label>

                <input
                    id="searchFilter"
                    oninput="renderTickets()"
                    placeholder="نام، Discord یا ID"
                >
            </div>

        </div>

    </section>

    <section class="panel">

        <h3>درخواست‌ها</h3>

        <div id="tickets" class="tickets">
            <div class="empty">در حال دریافت...</div>
        </div>

    </section>

</main>

<div id="toast"></div>

<script>
    const API = "";

    let allTickets = [];

    function authHeaders() {
        const token = localStorage.getItem("vanguardAdminToken");

        return {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        };
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function toast(message) {
        const element = document.getElementById("toast");

        element.textContent = message;
        element.style.display = "block";

        setTimeout(() => {
            element.style.display = "none";
        }, 2500);
    }

    async function checkLogin() {
        const token = localStorage.getItem("vanguardAdminToken");

        if (!token) {
            location.href = "/login.html";
            return false;
        }

        try {
            const response = await fetch(`${API}/auth/me`, {
                headers: authHeaders()
            });

            if (!response.ok) {
                localStorage.removeItem("vanguardAdminToken");
                location.href = "/login.html";
                return false;
            }

            return true;

        } catch {
            toast("خطا در بررسی ورود");
            return false;
        }
    }

    async function loadTickets() {

        const container = document.getElementById("tickets");

        container.innerHTML =
            '<div class="empty">در حال دریافت تیکت‌ها...</div>';

        try {

            const response = await fetch(`${API}/tickets`, {
                headers: authHeaders()
            });

            if (response.status === 401) {
                logout();
                return;
            }

            if (!response.ok) {
                throw new Error("Failed");
            }

            allTickets = await response.json();

            updateStats();
            renderTickets();

        } catch (error) {

            console.error(error);

            container.innerHTML =
                '<div class="empty">خطا در دریافت تیکت‌ها</div>';

        }
    }

    function updateStats() {

        document.getElementById("totalCount").textContent =
            allTickets.length;

        document.getElementById("pendingCount").textContent =
            allTickets.filter(x => x.status === "Pending").length;

        document.getElementById("acceptedCount").textContent =
            allTickets.filter(x => x.status === "Accepted").length;

        document.getElementById("closedCount").textContent =
            allTickets.filter(x => x.status === "Closed").length;
    }

    function renderTickets() {

        const status =
            document.getElementById("statusFilter").value;

        const type =
            document.getElementById("typeFilter").value;

        const search =
            document.getElementById("searchFilter")
                .value
                .trim()
                .toLowerCase();

        const filtered =
            allTickets.filter(ticket => {

                if (status && ticket.status !== status) {
                    return false;
                }

                if (type && ticket.requestType !== type) {
                    return false;
                }

                if (search) {

                    const haystack = [
                        ticket._id,
                        ticket.icName,
                        ticket.name,
                        ticket.discord,
                        ticket.discordId,
                        ticket.callSign
                    ]
                    .join(" ")
                    .toLowerCase();

                    if (!haystack.includes(search)) {
                        return false;
                    }
                }

                return true;
            });

        const container =
            document.getElementById("tickets");

        if (!filtered.length) {

            container.innerHTML =
                '<div class="empty">تیکتی پیدا نشد.</div>';

            return;
        }

        container.innerHTML =
            filtered.map(ticket => ticketHtml(ticket)).join("");
    }

    function ticketHtml(ticket) {

        const id = ticket._id;

        return `
            <article class="ticket">

                <div class="ticket-head">

                    <div>
                        <strong>
                            ${escapeHtml(ticket.icName || ticket.name || "بدون نام")}
                        </strong>

                        <div class="ticket-id">
                            ${escapeHtml(id)}
                        </div>
                    </div>

                    <div class="status ${escapeHtml(ticket.status)}">
                        ${escapeHtml(ticket.status)}
                    </div>

                </div>

                <div class="grid">

                    ${field("نوع درخواست", ticket.requestType)}
                    ${field("Discord", ticket.discord || ticket.discordId)}
                    ${field("Steam Hex", ticket.steamHex)}
                    ${field("CMX", ticket.cmx)}
                    ${field("سن", ticket.age)}
                    ${field("Rank", ticket.rank)}
                    ${field("Call Sign", ticket.callSign)}
                    ${field("درخواست Rank", ticket.requestRank)}
                    ${field("Score", ticket.score ?? ticket.examScore)}
                    ${field("Division فعلی", ticket.currentDivision)}
                    ${field("Division درخواستی", ticket.requestedDivision)}
                    ${field("تجربه", ticket.experience)}

                </div>

                <div class="field" style="margin-top:10px">
                    <label>دلیل / توضیحات</label>
                    <div>
                        ${escapeHtml(
                            ticket.reason ||
                            ticket.reasonForRequest ||
                            ticket.resignationReason ||
                            ticket.note ||
                            ticket.additionalInformation ||
                            "-"
                        )}
                    </div>
                </div>

                <div class="field" style="margin-top:10px">
                    <label>پاسخ فعلی</label>
                    <div>
                        ${escapeHtml(ticket.reply || "-")}
                    </div>
                </div>

                <div class="actions">

                    <button
                        class="success"
                        onclick="updateTicket('${id}', 'Accepted')"
                    >
                        تأیید
                    </button>

                    <button
                        class="danger"
                        onclick="updateTicket('${id}', 'Rejected')"
                    >
                        رد
                    </button>

                    <button
                        class="secondary"
                        onclick="updateTicket('${id}', 'Pending')"
                    >
                        Pending
                    </button>

                    <button
                        class="warning"
                        onclick="updateTicket('${id}', 'Closed')"
                    >
                        بستن
                    </button>

                    <button
                        class="danger"
                        onclick="deleteTicket('${id}')"
                    >
                        حذف
                    </button>

                </div>

                <div class="chat">

                    <strong>💬 گفت‌وگو</strong>

                    <div
                        class="messages"
                        id="messages-${id}"
                    >
                        در حال دریافت...
                    </div>

                    <div class="chat-row">

                        <input
                            id="message-${id}"
                            maxlength="2000"
                            placeholder="پاسخ فرماندهی..."
                        >

                        <button
                            onclick="sendMessage('${id}')"
                        >
                            ارسال
                        </button>

                    </div>

                </div>

            </article>
        `;
    }

    function field(label, value) {

        return `
            <div class="field">
                <label>${escapeHtml(label)}</label>
                <div>${escapeHtml(value || "-")}</div>
            </div>
        `;
    }

    async function updateTicket(id, status) {

        let reply =
            prompt(
                "پاسخ فرماندهی:",
                ""
            );

        if (reply === null) {
            reply = "";
        }

        const commanderName =
            localStorage.getItem("vanguardAdminName") || "فرماندهی";

        const commanderUsername =
            localStorage.getItem("vanguardAdminUsername") || "";

        const commanderRank =
            localStorage.getItem("vanguardAdminRank") || "Command";

        try {

            const response =
                await fetch(`${API}/tickets/${id}`, {

                    method: "PUT",

                    headers: authHeaders(),

                    body: JSON.stringify({

                        status,
                        reply,

                        commanderName,
                        commanderUsername,
                        commanderRank

                    })

                });

            if (response.status === 401) {
                logout();
                return;
            }

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "خطا");
            }

            toast(data.message);

            await loadTickets();

        } catch (error) {

            console.error(error);

            toast(error.message || "خطا در بروزرسانی");

        }
    }

    async function deleteTicket(id) {

        if (!confirm("آیا از حذف این تیکت مطمئن هستید؟")) {
            return;
        }

        try {

            const response =
                await fetch(`${API}/tickets/${id}`, {

                    method: "DELETE",

                    headers: authHeaders()

                });

            if (response.status === 401) {
                logout();
                return;
            }

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "خطا");
            }

            toast(data.message);

            await loadTickets();

        } catch (error) {

            toast(error.message || "خطا در حذف");

        }
    }

    async function loadMessages(id) {

        const element =
            document.getElementById(`messages-${id}`);

        if (!element) {
            return;
        }

        try {

            const response =
                await fetch(
                    `${API}/tickets/${id}/messages`,
                    {
                        headers: authHeaders()
                    }
                );

            if (!response.ok) {
                throw new Error();
            }

            const messages =
                await response.json();

            if (!messages.length) {

                element.innerHTML =
                    '<div class="empty">هنوز پیامی ثبت نشده است.</div>';

                return;
            }

            element.innerHTML =
                messages.map(message => {

                    const command =
                        message.sender === "command";

                    return `
                        <div class="message ${command ? "command" : ""}">

                            <div class="message-meta">
                                ${escapeHtml(
                                    message.senderName ||
                                    (command ? "فرماندهی" : "متقاضی")
                                )}

                                ${message.senderRank
                                    ? ` | ${escapeHtml(message.senderRank)}`
                                    : ""
                                }

                                | ${new Date(message.createdAt)
                                    .toLocaleString("fa-IR")
                                }
                            </div>

                            <div class="message-body">
                                ${escapeHtml(message.message)}
                            </div>

                        </div>
                    `;

                }).join("");

            element.scrollTop = element.scrollHeight;

        } catch {

            element.innerHTML =
                '<div class="empty">خطا در دریافت پیام‌ها</div>';
        }
    }

    async function sendMessage(id) {

        const input =
            document.getElementById(`message-${id}`);

        const message =
            input.value.trim();

        if (!message) {
            return;
        }

        try {

            const response =
                await fetch(
                    `${API}/tickets/${id}/messages`,
                    {

                        method: "POST",

                        headers: authHeaders(),

                        body: JSON.stringify({

                            message,

                            sender: "command",

                            commanderName:
                                localStorage.getItem("vanguardAdminName") ||
                                "فرماندهی",

                            commanderUsername:
                                localStorage.getItem("vanguardAdminUsername") ||
                                "",

                            commanderRank:
                                localStorage.getItem("vanguardAdminRank") ||
                                "Command"

                        })

                    }
                );

            if (response.status === 401) {
                logout();
                return;
            }

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "خطا");
            }

            input.value = "";

            await loadMessages(id);

        } catch (error) {

            toast(error.message || "خطا در ارسال پیام");

        }
    }

    async function refreshChats() {

        for (const ticket of allTickets) {
            await loadMessages(ticket._id);
        }

    }

    function logout() {

        localStorage.removeItem("vanguardAdminToken");
        localStorage.removeItem("vanguardAdminName");
        localStorage.removeItem("vanguardAdminUsername");
        localStorage.removeItem("vanguardAdminRank");

        location.href = "/login.html";
    }

    async function init() {

        const logged =
            await checkLogin();

        if (!logged) {
            return;
        }

        await loadTickets();
        await refreshChats();

        setInterval(async () => {

            await loadTickets();
            await refreshChats();

        }, 10000);
    }

    init();
</script>

</body>
</html>
