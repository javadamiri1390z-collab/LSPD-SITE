<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================================
   ADMIN PANEL - VANGUARD LSPD
========================================================= */

* {
    box-sizing: border-box;
}

body.command-page {
    min-height: 100vh;
}

/* =========================
   NAVBAR
========================= */

.admin-navbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    width: 100%;

    padding: 14px 35px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(3, 8, 15, 0.88);

    backdrop-filter: blur(20px);

    border-bottom: 1px solid rgba(255,255,255,.10);

    box-shadow: 0 10px 40px rgba(0,0,0,.25);
}

.admin-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.admin-brand img {
    width: 52px;
    height: 52px;
    object-fit: contain;

    filter:
        drop-shadow(0 0 12px rgba(30,145,255,.75));
}

.admin-brand-text h2 {
    margin: 0;

    color: #4da6ff;

    font-size: 22px;
}

.admin-brand-text span {
    color: #8e9baa;
    font-size: 12px;
}

.admin-actions {
    display: flex;
    gap: 10px;
    align-items: center;
}

.admin-btn {
    border: 1px solid rgba(255,255,255,.12);

    background: rgba(255,255,255,.06);

    color: white;

    padding: 10px 18px;

    border-radius: 10px;

    cursor: pointer;

    transition: .25s;
}

.admin-btn:hover {
    background: rgba(255,255,255,.12);
    transform: translateY(-2px);
}

.admin-btn.logout {
    background: rgba(255,55,55,.12);
    border-color: rgba(255,70,70,.25);
}

.admin-btn.logout:hover {
    background: rgba(255,55,55,.25);
}

/* =========================
   MAIN
========================= */

.admin-main {
    width: 1250px;
    max-width: 94%;

    margin: 35px auto 70px;
}

/* =========================
   HEADER
========================= */

.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;
}

.admin-header h1 {
    margin: 0;

    font-size: 30px;

    color: white;
}

.admin-header p {
    margin-top: 8px;

    color: #8995a3;
}

.live-status {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 9px 14px;

    border-radius: 20px;

    background: rgba(0,255,140,.08);

    border: 1px solid rgba(0,255,140,.18);

    color: #53e89a;

    font-size: 13px;
}

.live-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #00ff88;

    box-shadow: 0 0 10px #00ff88;
}

/* =========================
   STATS
========================= */

.admin-stats {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-bottom: 22px;
}

.admin-stat {
    position: relative;

    padding: 20px;

    min-height: 120px;

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(255,255,255,.10);

    overflow: hidden;

    box-shadow:
        0 15px 35px rgba(0,0,0,.18);
}

.admin-stat::after {
    content: "";

    position: absolute;

    width: 100px;
    height: 100px;

    left: -40px;
    bottom: -50px;

    background: rgba(0,120,255,.12);

    border-radius: 50%;

    filter: blur(15px);
}

.stat-icon {
    font-size: 22px;
}

.stat-number {
    display: block;

    margin-top: 10px;

    font-size: 28px;

    color: #4da6ff;

    font-weight: bold;
}

.stat-label {
    color: #9ba6b2;

    font-size: 13px;
}

/* =========================
   CONTROL PANEL
========================= */

.control-panel {
    padding: 18px;

    border-radius: 18px;

    background: rgba(3,8,15,.72);

    border: 1px solid rgba(255,255,255,.10);

    backdrop-filter: blur(15px);

    margin-bottom: 20px;
}

.search-wrapper {
    position: relative;
}

.search-wrapper input {
    width: 100%;

    padding: 15px 18px;

    border-radius: 12px;

    border: 1px solid rgba(255,255,255,.12);

    outline: none;

    background: rgba(255,255,255,.055);

    color: white;

    font-size: 14px;
}

.search-wrapper input:focus {
    border-color: rgba(50,150,255,.7);

    box-shadow:
        0 0 0 3px rgba(0,120,255,.10);
}

.filter-buttons {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin-top: 13px;
}

.filter-btn {
    border: 1px solid rgba(255,255,255,.12);

    background: rgba(255,255,255,.05);

    color: #d9e0e8;

    padding: 9px 15px;

    border-radius: 9px;

    cursor: pointer;

    transition: .2s;
}

.filter-btn:hover {
    background: rgba(255,255,255,.10);
}

.filter-btn.active {
    background: #087cff;

    border-color: #087cff;

    color: white;

    box-shadow:
        0 5px 18px rgba(0,120,255,.25);
}

/* =========================
   REQUESTS
========================= */

.requests-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin: 20px 0 12px;
}

.requests-header h2 {
    margin: 0;

    font-size: 20px;
}

.refresh-info {
    color: #758190;

    font-size: 12px;
}

.requests {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 15px;
}

/* =========================
   TICKET CARD
========================= */

.ticket {
    position: relative;

    padding: 20px;

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            rgba(18,25,34,.92),
            rgba(7,12,19,.92)
        );

    border: 1px solid rgba(255,255,255,.10);

    box-shadow:
        0 15px 35px rgba(0,0,0,.20);

    transition: .25s;

    overflow: hidden;
}

.ticket:hover {
    transform: translateY(-3px);

    border-color:
        rgba(55,155,255,.30);

    box-shadow:
        0 18px 45px rgba(0,0,0,.32);
}

.ticket.unread {
    border-color:
        rgba(0,150,255,.45);

    box-shadow:
        0 0 25px rgba(0,120,255,.10);
}

.ticket-top {
    display: flex;

    justify-content: space-between;

    gap: 10px;

    align-items: flex-start;

    margin-bottom: 16px;
}

.ticket-title {
    display: flex;

    gap: 10px;

    align-items: center;
}

.ticket-type-icon {
    width: 42px;
    height: 42px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 12px;

    background: rgba(0,120,255,.10);

    border: 1px solid rgba(0,140,255,.18);

    font-size: 20px;
}

.ticket-title h3 {
    margin: 0;

    font-size: 16px;
}

.ticket-code {
    color: #718092;

    font-size: 11px;

    margin-top: 4px;

    direction: ltr;

    text-align: right;
}

.status {
    padding: 6px 10px;

    border-radius: 20px;

    font-size: 11px;

    white-space: nowrap;
}

.status.pending {
    background: rgba(255,180,0,.10);

    border: 1px solid rgba(255,180,0,.18);

    color: #ffc44d;
}

.status.accepted {
    background: rgba(0,255,130,.09);

    border: 1px solid rgba(0,255,130,.18);

    color: #45e996;
}

.status.rejected {
    background: rgba(255,50,50,.09);

    border: 1px solid rgba(255,50,50,.18);

    color: #ff6565;
}

.ticket-info {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;

    margin-bottom: 15px;
}

.info-item {
    padding: 10px;

    background: rgba(255,255,255,.035);

    border-radius: 9px;

    border: 1px solid rgba(255,255,255,.055);
}

.info-item small {
    display: block;

    color: #738091;

    font-size: 10px;

    margin-bottom: 4px;
}

.info-item span {
    color: #e4e8ed;

    font-size: 12px;

    word-break: break-word;
}

.ticket-exam {
    padding: 12px;

    border-radius: 10px;

    background: rgba(0,120,255,.06);

    border: 1px solid rgba(0,120,255,.10);

    margin-bottom: 13px;
}

.ticket-exam strong {
    color: #4da6ff;
}

.ticket-footer {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    padding-top: 13px;

    border-top: 1px solid rgba(255,255,255,.07);
}

.ticket-date {
    color: #687483;

    font-size: 10px;
}

.ticket-actions {
    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}

.action-btn {
    border: 1px solid rgba(255,255,255,.10);

    background: rgba(255,255,255,.06);

    color: white;

    padding: 8px 12px;

    border-radius: 8px;

    cursor: pointer;

    font-family: inherit;

    transition: .2s;
}

.action-btn:hover {
    background: rgba(255,255,255,.12);
}

.action-btn.blue {
    background: rgba(0,120,255,.15);

    border-color: rgba(0,140,255,.25);
}

.action-btn.green {
    background: rgba(0,200,100,.10);

    border-color: rgba(0,220,110,.20);
}

.action-btn.red {
    background: rgba(255,50,50,.10);

    border-color: rgba(255,70,70,.20);
}

/* =========================
   EMPTY
========================= */

.empty-box {
    grid-column: 1 / -1;

    padding: 50px 25px;

    text-align: center;

    border-radius: 17px;

    background: rgba(255,255,255,.035);

    border: 1px dashed rgba(255,255,255,.12);

    color: #7d8997;
}

.empty-icon {
    font-size: 40px;

    margin-bottom: 10px;
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 3000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.72);

    backdrop-filter: blur(8px);
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 750px;

    max-width: 100%;

    max-height: 90vh;

    overflow-y: auto;

    padding: 25px;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #101821,
            #050a10
        );

    border: 1px solid rgba(255,255,255,.12);

    box-shadow:
        0 30px 80px rgba(0,0,0,.60);
}

.modal-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}

.modal-header h2 {
    margin: 0;
}

.close-modal {
    width: 36px;
    height: 36px;

    border: none;

    border-radius: 9px;

    background: rgba(255,255,255,.07);

    color: white;

    cursor: pointer;

    font-size: 18px;
}

.detail-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}

.detail {
    padding: 12px;

    border-radius: 10px;

    background: rgba(255,255,255,.04);

    border: 1px solid rgba(255,255,255,.06);
}

.detail.full {
    grid-column: 1 / -1;
}

.detail label {
    display: block;

    color: #718091;

    font-size: 11px;

    margin-bottom: 5px;
}

.detail div {
    color: #e7ebef;

    white-space: pre-wrap;

    line-height: 1.7;
}

.reply-area {
    margin-top: 20px;
}

.reply-area textarea {
    width: 100%;

    min-height: 110px;

    padding: 13px;

    resize: vertical;

    border-radius: 11px;

    background: rgba(255,255,255,.045);

    border: 1px solid rgba(255,255,255,.10);

    color: white;

    outline: none;

    font-family: inherit;
}

.reply-area textarea:focus {
    border-color: #198cff;

    box-shadow:
        0 0 0 3px rgba(0,120,255,.10);
}

.modal-buttons {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin-top: 12px;
}

/* =========================
   CHAT
========================= */

.chat-container {
    margin-top: 20px;

    padding-top: 20px;

    border-top: 1px solid rgba(255,255,255,.08);
}

.chat-container h3 {
    margin-bottom: 12px;
}

.chat-messages {
    max-height: 280px;

    overflow-y: auto;

    padding: 10px;

    border-radius: 12px;

    background: #03070c;

    border: 1px solid rgba(255,255,255,.08);
}

.chat-message {
    padding: 10px 12px;

    border-radius: 10px;

    margin-bottom: 8px;

    background: rgba(255,255,255,.045);
}

.chat-message.command {
    border-right: 3px solid #3aa0ff;
}

.chat-message.applicant {
    border-right: 3px solid #35d07f;
}

.chat-message strong {
    display: block;

    margin-bottom: 4px;
}

.chat-message p {
    white-space: pre-wrap;

    line-height: 1.6;

    margin: 0;
}

.chat-message small {
    display: block;

    margin-top: 5px;

    color: #687483;

    font-size: 10px;
}

.chat-send-row {
    display: flex;

    gap: 8px;

    margin-top: 8px;
}

.chat-send-row textarea {
    flex: 1;

    min-height: 65px;

    padding: 12px;

    border-radius: 10px;

    border: 1px solid rgba(255,255,255,.10);

    background: rgba(255,255,255,.04);

    color: white;

    font-family: inherit;

    resize: vertical;

    outline: none;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    left: 25px;

    bottom: 25px;

    z-index: 5000;

    min-width: 250px;

    padding: 14px 18px;

    border-radius: 12px;

    background: rgba(10,18,28,.95);

    border: 1px solid rgba(255,255,255,.12);

    box-shadow: 0 15px 40px rgba(0,0,0,.4);

    transform: translateY(120px);

    opacity: 0;

    transition: .3s;
}

.toast.show {
    transform: translateY(0);

    opacity: 1;
}

.toast.success {
    border-color: rgba(0,255,130,.25);
}

.toast.error {
    border-color: rgba(255,50,50,.25);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px) {

    .admin-stats {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .requests {
        grid-template-columns: 1fr;
    }

}

@media(max-width:600px) {

    .admin-navbar {
        padding: 12px 15px;
    }

    .admin-brand-text {
        display: none;
    }

    .admin-main {
        max-width: 94%;
        margin-top: 20px;
    }

    .admin-header {
        flex-direction: column;

        align-items: flex-start;

        gap: 12px;
    }

    .admin-stats {
        grid-template-columns: 1fr;
    }

    .ticket-info {
        grid-template-columns: 1fr;
    }

    .detail-grid {
        grid-template-columns: 1fr;
    }

    .detail.full {
        grid-column: auto;
    }

    .ticket-footer {
        flex-direction: column;

        align-items: flex-start;
    }

    .chat-send-row {
        flex-direction: column;
    }

}

</style>

</head>


<body class="command-page">


<div class="overlay"></div>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="admin-navbar">

    <div class="admin-brand">

        <img
            src="badge.png"
            alt="LSPD"
        >

        <div class="admin-brand-text">

            <h2>
                Vanguard LSPD
            </h2>

            <span>
                Command Center
            </span>

        </div>

    </div>


    <div class="admin-actions">

        <button
            class="admin-btn"
            onclick="manualRefresh()"
        >
            🔄 بروزرسانی
        </button>

        <button
            class="admin-btn logout"
            onclick="logout()"
        >

        </button>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="admin-main">


    <div class="admin-header">

        <div>

            <h1>
                🚔 پنل فرماندهی LSPD
            </h1>

            <p>
                مدیریت درخواست‌ها و ارتباط مستقیم با متقاضیان

    <!-- =================================================

                کل درخواست‌ها
            </span>

        </div>


        <div class="admin-stat">

            <span class="stat-icon">
                ⏳
            </span>

            <span
                id="pendingCount"
                class="stat-number"
            >
                0
            </span>

            <span class="stat-label">
                در انتظار بررسی
            </span>

        </div>


        <div class="admin-stat">

            <span class="stat-icon">
                ✅
            </span>

            <span
                id="acceptedCount"
                class="stat-number"
            >
                0
            </span>

            <span

            </span>

    <!-- =================================================
         CONTROL
    ================================================= -->

    <section class="control-panel">


        <div class="search-wrapper">

            <input
                type="text"
                id="searchInput"
                placeholder="🔎 جستجو بر اساس کد، IC Name، OC Name، Discord..."
                autocomplete="off"
            >

        </div>

            <button
                class="filter-btn active"
                data-filter="all"

            <button

                🚔 عضویت

                class="filter-btn"

    </section>


    <!-- =================================================
         REQUESTS
    ================================================= -->

    <div class="requests-header">

        <h2>
            📄 درخواست‌ها
        </h2>

        <span
            id="refreshInfo"
            class="refresh-info"
        >
            بروزرسانی خودکار فعال است
        </span>

    </div>


    <section
        id="requests"
        class="requests"
    >

        <div class="empty-box">

            <div class="empty-icon">
                ⏳
            </div>

            در حال دریافت درخواست‌ها...

        </div>

    </section>


</main>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="ticketModal"
    class="modal"
>


    <div class="modal-box">


        <div class="modal-header">

            <h2>
                📄 جزئیات درخواست
            </h2>

            <button
                class="close-modal"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <div id="modalContent">

        </div>


    </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
    id="toast"
    class="toast"
>
</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "https://lspd-site-11.onrender.com";


const REFRESH_INTERVAL =
    2000;


let tickets = [];

let activeFilter = "all";

let selectedTicketId = null;

let refreshTimer = null;

let firstLoad = true;


/* =========================================================
   AUTH
========================================================= */

if (
    localStorage.getItem("lspdAdmin") !== "true"
) {

    window.location.href =
        "login.html";

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   REQUEST TYPE
========================================================= */

function getRequestType(type) {

    switch (type) {

        case "membership":
            return {
                text: "درخواست عضویت",
                icon: "🚔"
            };

        case "division":
            return {
                text: "درخواست دیویژن",
                icon: "🎖️"
            };

        case "resignation":
            return {
                text: "درخواست استعفا",
                icon: "📤"
            };

        case "rankup":
            return {
                text: "درخواست Rankup",
                icon: "⬆️"
            };

        default:
            return {
                text: "درخواست",
                icon: "📄"
            };

    }

}


/* =========================================================
   STATUS
========================================================= */

function getStatus(status) {

    if (status === "Accepted") {

        return {
            text: "تایید شده",
            className: "accepted"
        };

    }

    if (status === "Rejected") {

        return {
            text: "رد شده",
            className: "rejected"
        };

    }

    return {
        text: "در انتظار بررسی",
        className: "pending"
    };

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(date) {

    if (!date) {
        return "—";
    }

    try {

        return new Date(date)
            .toLocaleString("fa-IR");

    } catch {

        return "—";

    }

}


/* =========================================================
   LOAD TICKETS
========================================================= */

async function loadTickets(silent = false) {

    try {

        const response =
            await fetch(
                API_URL + "/tickets",
                {
                    method: "GET",

                    cache: "no-store",

                    headers: {
                        "Cache-Control":
                            "no-cache"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (!Array.isArray(data)) {

            throw new Error(
                "Invalid tickets response"
            );

        }


        /*
         * مرتب‌سازی:
         * جدیدترین درخواست اول
         */

        data.sort(
            (a, b) =>
                new Date(
                    b.createdAt || 0
                ) -
                new Date(
                    a.createdAt || 0
                )
        );


        const oldIds =
            new Set(
                tickets.map(
                    ticket =>
                        String(ticket._id)
                )
            );


        const newTicket =
            data.find(
                ticket =>
                    !oldIds.has(
                        String(ticket._id)
                    )
            );


        tickets = data;


        updateStats();

        renderTickets();


        /*
         * اگر درخواست جدید آمده باشد
         */

        if (
            !firstLoad &&
            newTicket
        ) {

            showToast(
                "📨 درخواست جدید دریافت شد.",
                "success"
            );

        }


        firstLoad = false;


        document
            .getElementById(
                "refreshInfo"
            )
            .innerText =
                "آخرین بروزرسانی: " +
                new Date()
                    .toLocaleTimeString(
                        "fa-IR"
                    );


    } catch (error) {

        console.error(
            "Load Tickets Error:",
            error
        );


        if (!silent) {

            document
                .getElementById(
                    "requests"
                )
                .innerHTML = `

                    <div class="empty-box">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        دریافت درخواست‌ها ناموفق بود.

                        <br><br>

                        <small>
                            ${escapeHTML(
                                error.message
                            )}
                        </small>

                    </div>

                `;

        }

    }

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    const total =
        tickets.length;


    const pending =
        tickets.filter(
            ticket =>
                !ticket.status ||
                ticket.status === "Pending"
        ).length;


    const accepted =
        tickets.filter(
            ticket =>
                ticket.status ===
                "Accepted"
        ).length;


    const rejected =
        tickets.filter(
            ticket =>
                ticket.status ===
                "Rejected"
        ).length;


    document
        .getElementById(
            "totalCount"
        )
        .innerText =
            total;


    document
        .getElementById(
            "pendingCount"
        )
        .innerText =
            pending;


    document
        .getElementById(
            "acceptedCount"
        )
        .innerText =
            accepted;


    document
        .getElementById(
            "rejectedCount"
        )
        .innerText =
            rejected;

}


/* =========================================================
   FILTER
========================================================= */

function getFilteredTickets() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    return tickets.filter(
        ticket => {

            const type =
                ticket.requestType ||
                "";


            const status =
                ticket.status ||
                "Pending";


            let matchesFilter =
                true;


            if (
                activeFilter !==
                "all"
            ) {

                if (
                    activeFilter ===
                    "pending"
                ) {

                    matchesFilter =
                        !ticket.status ||
                        ticket.status ===
                            "Pending";

                } else {

                    matchesFilter =
                        type ===
                        activeFilter;

                }

            }


            if (!matchesFilter) {

                return false;

            }


            if (!search) {

                return true;

            }


            const searchable = [

                ticket._id,

                ticket.icName,

                ticket.name,

                ticket.oocName,

                ticket.ocName,

                ticket.discord,

                ticket.discordId,

                ticket.steamHex,

                ticket.cmx,

                ticket.requestType,

                ticket.status

            ]
            .join(" ")
            .toLowerCase();


            return searchable
                .includes(search);

        }
    );

}


/* =========================================================
   RENDER TICKETS
========================================================= */

function renderTickets() {

    const container =
        document.getElementById(
            "requests"
        );


    const filtered =
        getFilteredTickets();


    if (
        filtered.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    📭
                </div>

                درخواستی پیدا نشد.

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered
            .map(
                ticket =>
                    createTicketHTML(
                        ticket
                    )
            )
            .join("");

}


/* =========================================================
   CREATE TICKET
========================================================= */

function createTicketHTML(ticket) {

    const type =
        getRequestType(
            ticket.requestType
        );


    const status =
        getStatus(
            ticket.status
        );


    const id =
        escapeHTML(
            ticket._id
        );


    const ic =
        escapeHTML(
            ticket.icName ||
            ticket.name ||
            "—"
        );


    const oc =
        escapeHTML(
            ticket.ocName ||
            ticket.oocName ||
            "—"
        );


    const discord =
        escapeHTML(
            ticket.discord ||
            ticket.discordId ||
            "—"
        );


    let examHTML = "";


    if (
        ticket.score !==
            undefined &&
        ticket.score !== null
    ) {

        const score =
            Number(ticket.score);


        const passed =
            score >= 12;


        examHTML = `

            <div class="ticket-exam">

                📚 نمره آزمون:

                <strong>
                    ${score} / 20
                </strong>

                —

                ${
                    passed
                    ? "🟢 قبول"
                    : "🔴 رد"
                }

            </div>

        `;

    }


    return `

        <article class="ticket">


            <div class="ticket-top">


                <div class="ticket-title">


                    <div class="ticket-type-icon">

                        ${type.icon}

                    </div>


                    <div>

                        <h3>

                            ${type.text}

                        </h3>


                        <div class="ticket-code">

                            ${id}

                        </div>

                    </div>


                </div>


                <span
                    class="status ${status.className}"
                >

                    ${status.text}

                </span>


            </div>


            <div class="ticket-info">


                <div class="info-item">

                    <small>
                        IC Name
                    </small>

                    <span>
                        ${ic}
                    </span>

                </div>


                <div class="info-item">

                    <small>
                        OC Name
                    </small>

                    <span>
                        ${oc}
                    </span>

                </div>


                <div class="info-item">

                    <small>
                        Discord
                    </small>

                    <span>
                        ${discord}
                    </span>

                </div>


                <div class="info-item">

                    <small>
                        نوع درخواست
                    </small>

                    <span>
                        ${type.text}
                    </span>

                </div>


            </div>


            ${examHTML}


            <div class="ticket-footer">


                <span class="ticket-date">

                    ثبت شده:
                    ${formatDate(
                        ticket.createdAt
                    )}

                </span>


                <div class="ticket-actions">


                    <button
                        class="action-btn blue"
                        onclick="openTicket('${id}')"
                    >

                        👁 مشاهده

                    </button>


                    <button
                        class="action-btn green"
                        onclick="changeStatus('${id}','Accepted')"
                    >

                        ✅ تایید

                    </button>


                    <button
                        class="action-btn red"
                        onclick="changeStatus('${id}','Rejected')"
                    >

                        ❌ رد

                    </button>


                </div>


            </div>


        </article>

    `;

}


/* =========================================================
   OPEN TICKET
========================================================= */

async function openTicket(id) {

    const ticket =
        tickets.find(
            item =>
                String(item._id) ===
                String(id)
        );


    if (!ticket) {

        showToast(
            "درخواست پیدا نشد.",
            "error"
        );

        return;

    }


    selectedTicketId =
        String(id);


    const type =
        getRequestType(
            ticket.requestType
        );


    const status =
        getStatus(
            ticket.status
        );


    const modal =
        document.getElementById(
            "ticketModal"
        );


    const content =
        document.getElementById(
            "modalContent"
        );


    content.innerHTML = `

        <div class="detail-grid">


            <div class="detail">

                <label>
                    کد پیگیری
                </label>

                <div dir="ltr">

                        ticket._id

                </div>

            </div>


            <div class="detail">

                <label>
                    وضعیت
                </label>

                <div>
                    ${status.text}
                </div>

            </div>


            <div class="detail">

                <label>
                    نوع درخواست
                </label>

                <div>
                    ${type.icon}
                    ${type.text}
                </div>

            </div>


            <div class="detail">

                <label>
                    IC Name
                </label>

                <div>
                    ${escapeHTML(
                        ticket.icName ||
                        ticket.name ||
                        "—"
                    )}
                </div>

            </div>


            <div class="detail">

                <label>
                    OC Name
                </label>

                <div>
                    ${escapeHTML(
                        ticket.ocName ||
                        ticket.oocName ||
                        "—"
                    )}
                </div>

            </div>


            <div class="detail">

                <label>
                    Discord
                </label>

                <div>
                    ${escapeHTML(
                        ticket.discord ||
                        ticket.discordId ||
                        "—"
                    )}
                </div>

            </div>


            <div class="detail">

                <label>
                    Steam Hex
                </label>

                <div dir="ltr">
                    ${escapeHTML(
                        ticket.steamHex
                    )}
                </div>

            </div>


            <div class="detail">

                <label>
                    CMX
                </label>

                <div>
                    ${escapeHTML(
                        ticket.cmx
                    )}
                </div>

            </div>


            <div class="detail">

                <label>
                    سن
                </label>

                <div>
                    ${escapeHTML(
                        ticket.age
                    )}
                </div>

            </div>


            <div class="detail">

                <label>
                    نمره آزمون
                </label>

                <div>

                    ${
                        ticket.score !==
                        undefined &&
                        ticket.score !==
                        null

                        ? escapeHTML(
                            ticket.score
                        ) +
                        " / 20"

                        : "—"
                    }

                </div>

            </div>


            <div class="detail full">

                <label>
                    سابقه رول پلی
                </label>

                <div>
                    ${escapeHTML(
                        ticket.experience
                    )}
                </div>

            </div>


            <div class="detail full">

                <label>
                    دلیل درخواست
                </label>

                <div>
                    ${escapeHTML(
                        ticket.reason
                    )}
                </div>

            </div>


            <div class="detail full">

                <label>
                    پاسخ فعلی فرماندهی
                </label>

                <div>
                    ${escapeHTML(
                        ticket.reply ||
                        "هنوز پاسخی ثبت نشده است."
                    )}
                </div>

            </div>


        </div>


        <div class="reply-area">

            <h3>
                ✍️ پاسخ فرماندهی
            </h3>

            <textarea
                id="replyInput"
                placeholder="پاسخ خود را برای متقاضی بنویسید..."
            >${escapeHTML(
                ticket.reply || ""
            )}</textarea>


            <div class="modal-buttons">


                <button
                    class="action-btn green"
                    onclick="saveTicket('${escapeHTML(id)}','Accepted')"
                >

                    ✅ تایید و ارسال پاسخ

                </button>


                <button
                    class="action-btn red"
                    onclick="saveTicket('${escapeHTML(id)}','Rejected')"
                >

                    ❌ رد و ارسال پاسخ

                </button>


                <button
                    class="action-btn blue"
                    onclick="saveTicket('${escapeHTML(id)}','Pending')"
                >

                    ⏳ در انتظار

                </button>


            </div>

        </div>


        <div class="chat-container">

            <h3>
                💬 گفتگوی زنده با متقاضی
            </h3>

                id="adminChatMessages"
                class="chat-messages"
            >

                در حال دریافت پیام‌ها...

            </div>


            <div class="chat-send-row">

                <textarea
                    id="adminChatInput"
                    placeholder="پیام خود را برای متقاضی بنویسید..."
                ></textarea>

    );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {

    document
        .getElementById(
            "ticketModal"
        )
        .classList
        .remove("show");


    selectedTicketId =
        null;

}


/* =========================================================
   CHANGE STATUS
========================================================= */

async function changeStatus(
    id,
    status
) {

    const text =
        status === "Accepted"
            ? "تایید"
            : "رد";


    if (
        !confirm(
            `آیا از ${text} این درخواست مطمئن هستید؟`
        )
    ) {

        return;

    }


    await saveTicket(
        id,
        status
    );

}


/* =========================================================
   SAVE TICKET
========================================================= */

async function saveTicket(
    id,
    status
) {

    let reply = "";


    const replyInput =
        document.getElementById(
            "replyInput"
        );


    if (replyInput) {

        reply =
            replyInput.value.trim();

    }


    try {

        /*
         * Endpoint اصلی
         */

        const response =
            await fetch(
                API_URL +
                "/tickets/" +
                encodeURIComponent(id),
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            status:
                                status,

                            reply:
                                reply

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "خطا در بروزرسانی"
            );

        }


        showToast(
            "✅ درخواست با موفقیت بروزرسانی شد.",
            "success"
        );


        await loadTickets(
            true
        );


        /*
         * اگر Modal باز است
         * دوباره اطلاعات را تازه می‌کنیم
         */

        if (
            selectedTicketId
        ) {

            await openTicket(
                selectedTicketId
            );

        }


    } catch (error) {

        console.error(
            "Update Ticket Error:",
            error
        );


        showToast(
            "❌ بروزرسانی درخواست انجام نشد.",
            "error"
        );

    }

}


/* =========================================================
   LOAD CHAT
========================================================= */

async function loadAdminMessages() {

    if (!selectedTicketId) {

        return;

    }


    const box =
        document.getElementById(
            "adminChatMessages"
        );


    if (!box) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ) +
                "/messages",

                {

                    method: "GET",

                    cache: "no-store",

                    headers: {

                        "Cache-Control":
                            "no-cache"

                    }

                }

            );


        if (!response.ok) {

            throw new Error(
                "Chat request failed"
            );

        }


        const messages =
            await response.json();


        if (
            !Array.isArray(messages) ||
            messages.length === 0
        ) {

            box.innerHTML = `

                <p style="
                    color:#697583;
                    text-align:center;
                ">

                    هنوز پیامی وجود ندارد.

                </p>

            `;

            return;

        }


        box.innerHTML =
            messages
                .map(
                    message => {

                        const command =
                            message.sender ===
                            "command";


                        return `

                            <div class="
                                chat-message
                                ${
                                    command
                                    ? "command"
                                    : "applicant"
                                }
                            ">

                                <strong>

                                    ${
                                        command
                                        ? "👮 فرماندهی"
                                        : "👤 متقاضی"
                                    }

                                </strong>


                                <p>

                                    ${
                                        escapeHTML(
                                            message.message
                                        )
                                    }

                                </p>


                                <small>

                                    ${
                                        formatDate(
                                            message.createdAt
                                        )
                                    }

                                </small>

                            </div>

                        `;

                    }
                )
                .join("");


        box.scrollTop =
            box.scrollHeight;


    } catch (error) {

        console.error(
            "Admin Chat Error:",
            error
        );

    }

}


/* =========================================================
   SEND COMMAND MESSAGE
========================================================= */

async function sendCommandMessage() {

    if (
        !selectedTicketId
    ) {

        return;

    }


    const input =
        document.getElementById(
            "adminChatInput"
        );


    if (!input) {

        return;

    }


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ) +
                "/messages",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            sender:
                                "command"

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Send error"
            );

        }


        input.value = "";


        await loadAdminMessages();


        showToast(
            "📨 پیام ارسال شد.",
            "success"
        );


    } catch (error) {

        console.error(
            "Send Command Message Error:",
            error
        );


        showToast(
            "❌ ارسال پیام ناموفق بود.",
            "error"
        );

    }

}


/* =========================================================
   AUTO REFRESH
========================================================= */

function startAutoRefresh() {

    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(
            async () => {

                /*
                 * درخواست‌ها هر ۲ ثانیه
                 */

                await loadTickets(
                    true
                );


                /*
                 * اگر Modal باز است،
                 * پیام‌های چت هم هر ۲ ثانیه
                 */

                if (
                    selectedTicketId
                ) {

                    await loadAdminMessages();

                }

            },

            REFRESH_INTERVAL

        );

}


/* =========================================================
   MANUAL REFRESH
========================================================= */

async function manualRefresh() {

    showToast(
        "🔄 در حال بروزرسانی...",
        "success"
    );


    await loadTickets(
        true
    );


    if (
        selectedTicketId
    ) {

        await loadAdminMessages();

    }

}


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function() {

            renderTickets();

        }
    );


/* =========================================================
   FILTER BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".filter-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".filter-btn"
                        )
                        .forEach(
                            btn =>
                                btn.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    this.classList
                        .add("active");


                    activeFilter =
                        this.dataset.filter;


                    renderTickets();

                }
            );

        }
    );


/* =========================================================
   ESC CLOSE MODAL
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeModal();

        }

    }
);


/* =========================================================
   CLICK OUTSIDE MODAL
========================================================= */

document
    .getElementById(
        "ticketModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeModal();

            }

        }
    );


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(
    message,
    type = "success"
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        message;


    toast.className =
        "toast " +
        type +
        " show";


    if (toastTimer) {

        clearTimeout(
            toastTimer
        );

    }


    toastTimer =
        setTimeout(
            () => {

                toast.classList
                    .remove(
                        "show"
                    );

            },

            3000

        );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    localStorage.removeItem(
        "lspdAdmin"
    );


    window.location.href =
        "login.html";

}


/* =========================================================
   INITIAL LOAD
========================================================= */

(async function init() {

    await loadTickets();

    startAutoRefresh();

})();

</script>
