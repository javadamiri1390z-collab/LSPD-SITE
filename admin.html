<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vanguard LSPD | Command Center</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

/* ==========================================
   CHAT
========================================== */

.command-chat-box {

    margin-top: 22px;

    padding: 18px;

    border-top:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(0,0,0,.12);

    border-radius: 14px;

}


.command-chat-box h3 {

    margin-top: 0;

}


.chat-messages {

    max-height: 350px;

    overflow-y: auto;

    padding: 10px;

    margin: 12px 0;

    border-radius: 12px;

    background:
        rgba(0,0,0,.18);

}


.chat-empty {

    text-align: center;

    color: #888;

    padding: 20px;

}


.chat-message {

    padding: 12px;

    margin: 10px 0;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,.08);

}


.chat-message.command {

    background:
        rgba(0,120,255,.14);

    border-color:
        rgba(0,150,255,.22);

}


.chat-message.applicant {

    background:
        rgba(255,255,255,.06);

}


.chat-message-header {

    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 7px;

}


.chat-message-time {

    color: #888;

    font-size: 12px;

}


.chat-message-text {

    white-space: pre-wrap;

    word-break: break-word;

    line-height: 1.8;

}


.chat-send-row {

    display: flex;

    gap: 10px;

    align-items: stretch;

}


.chat-input {

    flex: 1;

    min-height: 48px;

    resize: vertical;

}


.chat-send-button {

    min-width: 110px;

}


.chat-loading {

    text-align: center;

    color: #aaa;

    padding: 15px;

}


/* ==========================================
   STATUS
========================================== */

.approved-text {

    color: #35e889;

    font-weight: bold;

}


.rejected-text {

    color: #ff5555;

    font-weight: bold;

}


.pending-text {

    color: #ffc400;

    font-weight: bold;

}


/* ==========================================
   SEARCH / TABS
========================================== */

.request-tabs {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin: 25px 0;

}


/* ==========================================
   EMPTY
========================================== */

.empty {

    text-align: center;

}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:700px) {

    .chat-send-row {

        flex-direction: column;

    }

    .chat-send-button {

        width: 100%;

    }

}

</style>

</head>


<body class="command-page">


<div class="overlay"></div>


<!-- ==========================================
     NAVBAR

<header class="navbar">

<!-- ==========================================

========================================== -->

<main class="hero">


<div class="dashboard">


    <h1>

    </h1>


    <p class="dashboard-sub">
        مدیریت درخواست‌ها و ارتباط با متقاضیان
    </p>


    <!-- ======================================
         STATS
    ======================================= -->

    <div class="stats">


        <div class="card">

            <h2 id="total">
                0
            </h2>

            <p>
                کل درخواست‌ها

        </div>


        <div class="card">

            <h2 id="pending">
                0
            </h2>

            <p>
                در انتظار بررسی
            </p>

        </div>


        <div class="card">

            <h2 id="accepted">
                0
            </h2>

            <p>
                تایید شده
            </p>

        </div>


        <div class="card">

            <h2 id="rejected">
                0
            </h2>

            <p>
                رد شده
            </p>

        </div>


    </div>


    <!-- ======================================
         SEARCH
    ======================================= -->

    <input
        class="search-box"
        id="search"
        type="text"
        placeholder="🔍 جستجو IC Name، OOC Name، Discord یا کد پیگیری..."
        autocomplete="off"
    >


    <!-- ======================================
         FILTER
    ======================================= -->

    <div class="request-tabs">


        <button
            class="btn primary"
            onclick="filterRequests('all')"
        >
            📋 همه درخواست‌ها
        </button>


        <button
            class="btn"
            onclick="filterRequests('membership')"
        >
            🚔 درخواست عضویت
        </button>


        <button
            class="btn"
            onclick="filterRequests('division')"
        >
            🎖️ درخواست دیویژن
        </button>


        <button
            class="btn"
            onclick="filterRequests('resignation')"
        >
            📤 درخواست استعفا
        </button>


        <button
            class="btn"
            onclick="filterRequests('rankup')"
        >
            ⬆️ درخواست رنکاپ
        </button>


    </div>


    <div
        id="sectionTitle"
        style="margin-bottom:20px;"
    >

        <h2>
            📋 همه درخواست‌ها
        </h2>

    </div>


    <!-- ======================================
         TICKETS
    ======================================= -->

    <div id="tickets">

        <div class="ticket-card">

            <h3>
                ⏳ در حال دریافت درخواست‌ها...
            </h3>

        </div>

    </div>


</div>

</main>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
    "https://lspd-site-11.onrender.com";


const CHAT_REFRESH_TIME = 2000;


/* =====================================================
   ADMIN LOGIN
===================================================== */

function checkAdmin() {

    const admin =
        localStorage.getItem("lspdAdmin");


    if (admin !== "true") {

        window.location.href =
            "login.html";

        return false;

    }

    return true;

}


function logoutAdmin() {

    localStorage.removeItem(
        "lspdAdmin"
    );

    window.location.href =
        "login.html";

}


/* =====================================================
   GLOBAL
===================================================== */

let allTickets = [];

let currentFilter = "all";

let currentSearch = "";

let chatRefreshTimer = null;


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   GET TICKETS
===================================================== */

async function getTickets() {

    const response =
        await fetch(
            API_URL + "/tickets",
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "GET TICKETS ERROR"
        );

    }


    const data =
        await response.json();


    return Array.isArray(data)
        ? data
        : [];

}


/* =====================================================
   LOAD TICKETS
===================================================== */

async function loadTickets() {

    const box =
        document.getElementById(
            "tickets"
        );


    try {

        allTickets =
            await getTickets();


        updateStats();

        renderRequests();


        /*
         شروع بروزرسانی خودکار چت
        */

        startChatRefresh();


    } catch(error) {

        console.error(error);


        box.innerHTML = `

            <div class="ticket-card empty">

                <h2>
                    ❌ خطا در دریافت درخواست‌ها
                </h2>

                <p>
                    اتصال به سرور برقرار نشد.
                </p>

                <button
                    class="btn primary"
                    onclick="loadTickets()"
                >
                    🔄 تلاش دوباره
                </button>

            </div>

        `;

    }

}


/* =====================================================
   STATS
===================================================== */

function updateStats() {

    document.getElementById("total").innerText =
        allTickets.length;


    document.getElementById("pending").innerText =
        allTickets.filter(
            t =>
                (t.status || "Pending")
                === "Pending"
        ).length;


    document.getElementById("accepted").innerText =
        allTickets.filter(
            t =>
                t.status === "Accepted"
        ).length;


    document.getElementById("rejected").innerText =
        allTickets.filter(
            t =>
                t.status === "Rejected"
        ).length;

}


/* =====================================================
   REQUEST TYPE
===================================================== */

function getRequestType(ticket) {

    return (

        ticket.requestType ||

        ticket.type ||

        "membership"

    );

}


function getRequestTitle(type) {

    switch(type) {

        case "membership":

            return "🚔 درخواست عضویت";


        case "division":

            return "🎖️ درخواست دیویژن";


        case "resignation":

            return "📤 درخواست استعفا";


        case "rankup":

            return "⬆️ درخواست رنکاپ";


        default:

            return "📋 درخواست";

    }

}


/* =====================================================
   STATUS
===================================================== */

function getStatusClass(status) {

    if(status === "Accepted") {

        return "approved-text";

    }


    if(status === "Rejected") {

        return "rejected-text";

    }


    return "pending-text";

}


function getStatusText(status) {

    if(status === "Accepted") {

        return "🟢 تایید شده";

    }


    if(status === "Rejected") {

        return "🔴 رد شده";

    }


    return "🟡 در انتظار";

}


/* =====================================================
   FILTER
===================================================== */

function filterRequests(type) {

    currentFilter =
        type;


    const title =
        document.getElementById(
            "sectionTitle"
        );


    if(type === "all") {

        title.innerHTML =
            "<h2>📋 همه درخواست‌ها</h2>";

    } else {

        title.innerHTML =
            `<h2>${getRequestTitle(type)}</h2>`;

    }


    renderRequests();

}


/* =====================================================
   SEARCH
===================================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    function() {

        currentSearch =
            this.value
                .toLowerCase()
                .trim();


        renderRequests();

    }
);


/* =====================================================
   RENDER REQUESTS
===================================================== */

function renderRequests() {

    let filtered =
        allTickets.filter(
            ticket => {

                const type =
                    getRequestType(ticket);


                if(

                    currentFilter !== "all" &&

                    type !== currentFilter

                ) {

                    return false;

                }


                if(!currentSearch) {

                    return true;

                }


                const searchText = (

                    (ticket._id || "") +

                    " " +

                    (ticket.icName || "") +

                    " " +

                    (ticket.name || "") +

                    " " +

                    (ticket.ocName || "") +

                    " " +

                    (ticket.oocName || "") +

                    " " +

                    (ticket.discord || "") +

                    " " +

                    (ticket.discordId || "") +

                    " " +

                    (ticket.steamHex || "") +

                    " " +

                    (ticket.cmx || "")

                ).toLowerCase();


                return searchText.includes(
                    currentSearch
                );

            }
        );


    showTickets(filtered);

}


/* =====================================================
   SHOW TICKETS
===================================================== */

function showTickets(ticketList) {

    const box =
        document.getElementById(
            "tickets"
        );


    box.innerHTML = "";


    if(!ticketList.length) {

        box.innerHTML = `

            <div class="ticket-card empty">

                <h2>
                    📭 درخواستی وجود ندارد
                </h2>

                <p>
                    در این بخش درخواستی پیدا نشد.
                </p>

            </div>

        `;

        return;

    }


    ticketList.forEach(
        ticket => {

            const type =
                getRequestType(ticket);


            const status =
                ticket.status ||
                "Pending";


            const statusClass =
                getStatusClass(status);


            const statusText =
                getStatusText(status);


            const id =
                String(ticket._id || "");


            let html = `

                <div
                    class="ticket-card"
                    id="ticket-card-${escapeHTML(id)}"
                >


                    <div class="ticket-header">

                        <div>

                            <h2>

                                ${getRequestTitle(type)}

                            </h2>


                            <small>

                                کد پیگیری:

                                ${escapeHTML(id)}

                            </small>

                        </div>


                        <span
                            class="${statusClass}"
                        >

                            ${statusText}

                        </span>

                    </div>


                    <!-- ==========================
                         COMMON
                    =========================== -->

                    <p>

                        <b>
                            👤 IC Name:
                        </b>

                        ${escapeHTML(

                            ticket.icName ||

                            ticket.name ||

                            "-"

                        )}

                    </p>


                    <p>

                        <b>
                            🎭 OOC Name:
                        </b>

                        ${escapeHTML(

                            ticket.oocName ||

                            ticket.ocName ||

                            "-"

                        )}

                    </p>


                    <p>

                        <b>
                            💬 Discord:
                        </b>

                        ${escapeHTML(

                            ticket.discordId ||

                            ticket.discord ||

                            "-"

                        )}

                    </p>

            `;


            /* =================================
               MEMBERSHIP
            ================================= */

            if(type === "membership") {

                html += `

                    <p>

                        <b>
                            🎮 Steam Hex:
                        </b>

                        ${escapeHTML(
                            ticket.steamHex || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            🆔 CMX:
                        </b>

                        ${escapeHTML(
                            ticket.cmx || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            🎂 سن:
                        </b>

                        ${escapeHTML(
                            ticket.age || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            🚔 تجربه رول‌پلی:
                        </b>

                        ${escapeHTML(
                            ticket.experience || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            📄 دلیل عضویت:
                        </b>

                        ${escapeHTML(
                            ticket.reason || "-"
                        )}

                    </p>

                `;

            }


            /* =================================
               DIVISION
            ================================= */

            if(type === "division") {

                html += `

                    <p>

                        <b>
                            ⭐ Rank:
                        </b>

                        ${escapeHTML(
                            ticket.rank || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            📻 Call Sign:
                        </b>

                        ${escapeHTML(
                            ticket.callSign || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            🎖️ Current Division:
                        </b>

                        ${escapeHTML(
                            ticket.currentDivision || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            🎯 Requested Division:
                        </b>

                        ${escapeHTML(
                            ticket.requestedDivision || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            📄 Reason:
                        </b>

                        ${escapeHTML(
                            ticket.reasonForRequest || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            📚 Previous Experience:
                        </b>

                        ${escapeHTML(
                            ticket.previousDivisionExperience || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            📝 Additional Information:
                        </b>

                        ${escapeHTML(
                            ticket.additionalInformation || "-"
                        )}

                    </p>

                `;

            }


            /* =================================
               RESIGNATION
            ================================= */

            if(type === "resignation") {

                html += `

                    <p>

                        <b>
                            ⭐ Rank:
                        </b>

                        ${escapeHTML(
                            ticket.rank || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            📻 Call Sign:
                        </b>

                        ${escapeHTML(
                            ticket.callSign || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            📄 Reason:
                        </b>

                        ${escapeHTML(

                            ticket.resignationReason ||

                            ticket.reason ||

                            "-"

                        )}

                    </p>

                `;

            }


            /* =================================
               RANK UP
            ================================= */

            if(type === "rankup") {

                html += `

                    <p>

                        <b>
                            ⭐ Current Rank:
                        </b>

                        ${escapeHTML(
                            ticket.rank || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            ⬆️ Requested Rank:
                        </b>

                        ${escapeHTML(
                            ticket.requestRank || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            ⏱️ Current Rank Timeplay:
                        </b>

                        ${escapeHTML(
                            ticket.currentRankTimeplay || "-"
                        )}

                    </p>


                    <p>

                        <b>
                            📝 Note:
                        </b>

                        ${escapeHTML(
                            ticket.note || "-"
                        )}

                    </p>

                `;

            }


            /* =================================
               DATE
            ================================= */

            html += `

                    <p>

                        <b>
                            🕒 تاریخ ثبت:
                        </b>

                        ${
                            ticket.createdAt

                            ?

                            new Date(
                                ticket.createdAt
                            ).toLocaleString(
                                "fa-IR"
                            )

                            :

                            "-"
                        }

                    </p>


                    <hr>


                    <!-- ==========================
                         REPLY
                    =========================== -->

                    <label>

                        ✍️ پاسخ فرماندهی

                    </label>


                    <textarea
                        id="reply-${escapeHTML(id)}"
                        placeholder="پاسخ فرماندهی..."
                    >${escapeHTML(
                        ticket.reply || ""
                    )}</textarea>


                    <label>

                        وضعیت درخواست

                    </label>


                    <select
                        id="status-${escapeHTML(id)}"
                    >

                        <option
                            value="Pending"
                            ${
                                status === "Pending"
                                ? "selected"
                                : ""
                            }
                        >
                            🟡 در انتظار
                        </option>


                        <option
                            value="Accepted"
                            ${
                                status === "Accepted"
                                ? "selected"
                                : ""
                            }
                        >
                            🟢 تایید شده
                        </option>


                        <option
                            value="Rejected"
                            ${
                                status === "Rejected"
                                ? "selected"
                                : ""
                            }
                        >
                            🔴 رد شده
                        </option>

                    </select>


                    <div
                        class="ticket-buttons"
                        style="
                            display:flex;
                            gap:10px;
                            flex-wrap:wrap;
                            margin-top:15px;
                        "
                    >

                        <button
                            class="btn primary"
                            onclick="saveTicket('${escapeHTML(id)}')"
                        >
                            💾 ذخیره
                        </button>


                        <button
                            class="btn delete-btn"
                            onclick="removeTicket('${escapeHTML(id)}')"
                        >
                            🗑 حذف
                        </button>

                    </div>


                    <!-- ==========================
                         COMMAND CHAT
                    =========================== -->

                    <div
                        class="command-chat-box"
                    >

                        <h3>
                            💬 چت با متقاضی
                        </h3>


                        <div
                            id="command-chat-${escapeHTML(id)}"
                            class="chat-messages"
                        >

                            <div class="chat-loading">

                                ⏳ در حال دریافت پیام‌ها...

                            </div>

                        </div>


                        <div class="chat-send-row">

                            <textarea
                                id="command-message-${escapeHTML(id)}"
                                class="chat-input"
                                rows="2"
                                placeholder="پیام خود را برای متقاضی بنویسید..."
                                onkeydown="commandChatKeydown(event, '${escapeHTML(id)}')"
                            ></textarea>


                            <button
                                class="btn primary chat-send-button"
                                onclick="sendCommandMessage('${escapeHTML(id)}')"
                            >
                                📤 ارسال
                            </button>

                        </div>

                    </div>


                </div>

            `;


            box.innerHTML += html;


            /*
             بلافاصله چت همین تیکت را بخوان
            */

            loadCommandMessages(id);

        }
    );

}


/* =====================================================
   SAVE TICKET
===================================================== */

async function saveTicket(id) {

    const statusElement =
        document.getElementById(
            "status-" + id
        );


    const replyElement =
        document.getElementById(
            "reply-" + id
        );


    if(!statusElement || !replyElement) {

        return;

    }


    const status =
        statusElement.value;


    const reply =
        replyElement.value;


    try {

        const response =
            await fetch(
                API_URL +
                "/tickets/" +
                id,
                {

                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        status,
                        reply

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success) {

            throw new Error(
                "Update failed"
            );

        }


        alert(
            "درخواست با موفقیت بروزرسانی شد ✅"
        );


        await loadTickets();


    } catch(error) {

        console.error(error);


        alert(
            "بروزرسانی انجام نشد ❌"
        );

    }

}


/* =====================================================
   DELETE
===================================================== */

async function removeTicket(id) {

    if(
        !confirm(
            "آیا از حذف این درخواست مطمئن هستید؟"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                API_URL +
                "/tickets/" +
                id,
                {

                    method:"DELETE"

                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success) {

            throw new Error(
                "Delete failed"
            );

        }


        alert(
            "درخواست حذف شد ✅"
        );


        await loadTickets();


    } catch(error) {

        console.error(error);


        alert(
            "حذف درخواست انجام نشد ❌"
        );

    }

}


/* =====================================================
   LOAD COMMAND MESSAGES
===================================================== */

async function loadCommandMessages(id) {

    if(!id) return;


    const box =
        document.getElementById(
            "command-chat-" + id
        );


    if(!box) return;


    try {

        const response =
            await fetch(
                API_URL +
                "/tickets/" +
                id +
                "/messages",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok) {

            throw new Error(
                "Chat API Error"
            );

        }


        const messages =
            await response.json();


        renderCommandMessages(
            id,
            messages
        );


    } catch(error) {

        console.error(
            "Chat Load Error:",
            error
        );


        /*
         خطا را فقط اگر هنوز محتوایی نداریم نشان بده
        */

        if(
            !box.innerHTML ||
            box.innerHTML.includes(
                "در حال دریافت"
            )
        ) {

            box.innerHTML = `

                <div class="chat-empty">

                    ❌ دریافت پیام‌ها ناموفق بود.

                </div>

            `;

        }

    }

}


/* =====================================================
   RENDER CHAT
===================================================== */

function renderCommandMessages(
    id,
    messages
) {

    const box =
        document.getElementById(
            "command-chat-" + id
        );


    if(!box) return;


    if(!Array.isArray(messages)) {

        messages = [];

    }


    if(messages.length === 0) {

        box.innerHTML = `

            <div class="chat-empty">

                💬 هنوز پیامی وجود ندارد.

            </div>

        `;

        return;

    }


    box.innerHTML = "";


    messages.forEach(
        message => {

            const sender =
                message.sender === "command"
                ? "command"
                : "applicant";


            const senderName =
                sender === "command"
                ? "👮 فرماندهی"
                : "👤 متقاضی";


            const date =
                message.createdAt

                ?

                new Date(
                    message.createdAt
                ).toLocaleString(
                    "fa-IR"
                )

                :

                "";


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "chat-message " +
                sender;


            div.innerHTML = `

                <div class="chat-message-header">

                    <strong>

                        ${senderName}

                    </strong>


                    <span
                        class="chat-message-time"
                    >

                        ${escapeHTML(date)}

                    </span>

                </div>


                <div
                    class="chat-message-text"
                >

                    ${escapeHTML(
                        message.message || ""
                    )}

                </div>

            `;


            box.appendChild(div);

        }
    );


    /*
     اسکرول به آخرین پیام
    */

    box.scrollTop =
        box.scrollHeight;

}


/* =====================================================
   SEND COMMAND MESSAGE
===================================================== */

async function sendCommandMessage(id) {

    const input =
        document.getElementById(
            "command-message-" + id
        );


    if(!input) return;


    const message =
        input.value.trim();


    if(!message) {

        return;

    }


    const button =
        input
        .parentElement
        .querySelector(
            "button"
        );


    input.disabled = true;


    if(button) {

        button.disabled = true;

        button.innerText =
            "⏳";

    }


    try {

        const response =
            await fetch(
                API_URL +
                "/tickets/" +
                id +
                "/messages",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        sender:"command",

                        message

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success) {

            throw new Error(
                "Send message failed"
            );

        }


        /*
         پاک کردن input
        */

        input.value = "";


        /*
         بلافاصله پیام را نمایش بده
        */

        await loadCommandMessages(
            id
        );


    } catch(error) {

        console.error(
            "Send Command Message Error:",
            error
        );


        alert(
            "ارسال پیام انجام نشد ❌"
        );

    } finally {

        input.disabled = false;


        if(button) {

            button.disabled = false;

            button.innerText =
                "📤 ارسال";

        }


        input.focus();

    }

}


/* =====================================================
   ENTER TO SEND
===================================================== */

function commandChatKeydown(
    event,
    id
) {

    /*
     Enter = ارسال
     Shift + Enter = خط جدید
    */

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendCommandMessage(id);

    }

}


/* =====================================================
   AUTO CHAT REFRESH
===================================================== */

function startChatRefresh() {

    stopChatRefresh();


    chatRefreshTimer =
        setInterval(
            () => {

                /*
                 تمام تیکت‌هایی که در حال حاضر
                 در صفحه هستند دوباره چک می‌شوند.
                */

                allTickets.forEach(
                    ticket => {

                        if(ticket._id) {

                            loadCommandMessages(
                                String(ticket._id)
                            );

                        }

                    }
                );

            },
            CHAT_REFRESH_TIME
        );

}


/* =====================================================
   STOP CHAT REFRESH
===================================================== */

function stopChatRefresh() {

    if(chatRefreshTimer) {

        clearInterval(
            chatRefreshTimer
        );

        chatRefreshTimer = null;

    }

}


/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.hidden
        ) {

            stopChatRefresh();

        } else {

            startChatRefresh();

        }

    }
);


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        if(!checkAdmin()) {

            return;

        }


        loadTickets();

    }
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        stopChatRefresh();

    }
);

</script>
