<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">

<style>

.ticket-card {
    margin-bottom: 25px;
}

.ticket-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 20px;
}

.ticket-header small {
    display: block;
    margin-top: 8px;
    color: #999;
    direction: ltr;
    word-break: break-all;
}

.ticket-card textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    box-sizing: border-box;
    margin-top: 8px;
    margin-bottom: 15px;
}

.ticket-card select {
    width: 100%;
    box-sizing: border-box;
    margin-top: 8px;
    margin-bottom: 15px;
}

.ticket-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

.pending-text {
    color: #ffaa00;
}

.approved-text {
    color: #00ff88;
}

.rejected-text {
    color: #ff4444;
}

.empty {
    text-align: center;
}

.command-chat-box {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.15);
}

.chat-messages {
    max-height: 350px;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 10px;
    background: rgba(0,0,0,.15);
}

.chat-message {
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
}

.chat-message.command {
    border-right: 3px solid #00aaff;
}

.chat-message.applicant {
    border-right: 3px solid #ffaa00;
}

.chat-message small {
    display: block;
    color: #999;
    margin-top: 5px;
}

.chat-input-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
}

.chat-input-row input {
    flex: 1;
    margin: 0;
}

.server-status {
    margin: 15px 0 25px;
    padding: 12px 15px;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
}

.server-online {
    color: #00ff88;
}

.server-offline {
    color: #ff4444;
}

.refresh-btn {
    margin-bottom: 20px;
}

@media (max-width: 700px) {

    .ticket-header {
        flex-direction: column;
    }

    .chat-input-row {
        flex-direction: column;
    }

}

</style>

</head>


<body class="command-page">


<div class="overlay"></div>


<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="LSPD Badge"
    >


    <div class="nav-title">

        <h2>Vanguard LSPD</h2>

        <span>Command Center</span>

    </div>


    <button
        class="login-btn"
        type="button"
        onclick="logoutAdmin()"
    >
        خروج
    </button>

</header>



<main class="hero">


<div class="dashboard">


    <h1>
        🚔 پنل فرماندهی LSPD
    </h1>


    <p class="dashboard-sub">
        مدیریت درخواست‌ها و ارتباط با متقاضیان
    </p>


    <!-- ===================================
         SERVER STATUS
    =================================== -->

    <div
        id="serverStatus"
        class="server-status"
    >
        ⏳ در حال بررسی اتصال به سرور...
    </div>


    <!-- ===================================
         REFRESH
    =================================== -->

    <button
        type="button"
        class="btn primary refresh-btn"
        onclick="loadTickets()"
    >
        🔄 بروزرسانی درخواست‌ها
    </button>


    <!-- ===================================
         STATS
    =================================== -->

    <div class="stats">


        <div class="card">

            <h2 id="total">
                0
            </h2>

            <p>
                کل درخواست‌ها
            </p>

        </div>


        <div class="card">

            <h2 id="pending">
                0
            </h2>

            <p>
                در انتظار بررسی
            </p>

        </div>


        <div class="card">

            <h2 id="accepted">
                0
            </h2>

            <p>
                تایید شده
            </p>

        </div>


        <div class="card">

            <h2 id="rejected">
                0
            </h2>

            <p>
                رد شده
            </p>

        </div>


    </div>


    <!-- ===================================
         SEARCH
    =================================== -->

    <input
        class="search-box"
        id="search"
        type="text"
        placeholder="🔍 جستجو نام، Discord یا کد پیگیری..."
        autocomplete="off"
    >


    <!-- ===================================
         FILTER
    =================================== -->

    <div
        class="request-tabs"
        style="
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin:25px 0;
        "
    >

        <button
            type="button"
            class="btn primary"
            onclick="filterRequests('all')"
        >
            📋 همه درخواست‌ها
        </button>


        <button
            type="button"
            class="btn"
            onclick="filterRequests('membership')"
        >
            🚔 درخواست عضویت
        </button>


        <button
            type="button"
            class="btn"
            onclick="filterRequests('division')"
        >
            🎖️ درخواست دیویژن
        </button>


        <button
            type="button"
            class="btn"
            onclick="filterRequests('resignation')"
        >
            📤 درخواست استعفا
        </button>


        <button
            type="button"
            class="btn"
            onclick="filterRequests('rankup')"
        >
            ⬆️ درخواست رنکاپ
        </button>

    </div>


    <!-- ===================================
         SECTION TITLE
    =================================== -->

    <div
        id="sectionTitle"
        style="margin-bottom:20px;"
    >

        <h2>
            📋 همه درخواست‌ها
        </h2>

    </div>


    <!-- ===================================
         TICKETS
    =================================== -->

    <div id="tickets">

        <div class="ticket-card">

            <h3>
                ⏳ در حال دریافت درخواست‌ها...
            </h3>

        </div>

    </div>


</div>

</main>



<!-- ===================================
     MAIN SCRIPT
=================================== -->

<script src="script.js"></script>


<script>


// ===================================
// ADMIN CHECK
// ===================================

if (!checkAdmin()) {

    throw new Error(
        "Admin authentication required."
    );

}


// ===================================
// VARIABLES
// ===================================

let allTickets = [];

let currentFilter = "all";

let currentSearch = "";



// ===================================
// LOAD TICKETS
// ===================================

async function loadTickets() {

    const box =
        document.getElementById("tickets");


    const serverStatus =
        document.getElementById("serverStatus");


    box.innerHTML = `

        <div class="ticket-card">

            <h3>
                ⏳ در حال دریافت درخواست‌ها...
            </h3>

            <p>
                در حال اتصال به سرور MongoDB
            </p>

        </div>

    `;


    serverStatus.innerHTML =
        "⏳ در حال دریافت اطلاعات از سرور...";


    try {


        const tickets =
            await getTickets();


        if (!Array.isArray(tickets)) {

            throw new Error(
                "Invalid tickets response"
            );

        }


        allTickets =
            tickets;


        serverStatus.innerHTML = `
            <span class="server-online">
                🟢 اتصال به سرور برقرار است
            </span>
        `;


        updateStats();

        renderRequests();


    } catch (error) {


        console.error(
            "Load Tickets Error:",
            error
        );


        allTickets = [];


        updateStats();


        serverStatus.innerHTML = `
            <span class="server-offline">
                🔴 اتصال به سرور برقرار نیست
            </span>
        `;


        box.innerHTML = `

            <div class="ticket-card empty">

                <h2>
                    ❌ دریافت درخواست‌ها ناموفق بود
                </h2>

                <p>
                    سرور پاسخ مناسبی ارسال نکرد.
                </p>

                <button
                    type="button"
                    class="btn primary"
                    onclick="loadTickets()"
                >
                    🔄 تلاش مجدد
                </button>

            </div>

        `;

    }

}



// ===================================
// STATS
// ===================================

function updateStats() {


    document.getElementById("total").innerText =
        allTickets.length;


    document.getElementById("pending").innerText =
        allTickets.filter(
            ticket =>
                (ticket.status || "Pending") ===
                "Pending"
        ).length;


    document.getElementById("accepted").innerText =
        allTickets.filter(
            ticket =>
                ticket.status === "Accepted"
        ).length;


    document.getElementById("rejected").innerText =
        allTickets.filter(
            ticket =>
                ticket.status === "Rejected"
        ).length;

}



// ===================================
// REQUEST TYPE
// ===================================

function getTicketType(ticket) {

    return (
        ticket.requestType ||
        ticket.type ||
        "membership"
    );

}



// ===================================
// REQUEST TITLE
// ===================================

function getRequestTitle(type) {


    switch (type) {


        case "membership":

            return "🚔 درخواست عضویت";


        case "division":

            return "🎖️ درخواست دیویژن";


        case "resignation":

            return "📤 درخواست استعفا";


        case "rankup":

            return "⬆️ درخواست رنکاپ";


        default:

            return "📋 درخواست";


    }

}



// ===================================
// STATUS
// ===================================

function getAdminStatusClass(status) {


    if (status === "Accepted") {

        return "approved-text";

    }


    if (status === "Rejected") {

        return "rejected-text";

    }


    return "pending-text";

}



function getAdminStatusText(status) {


    if (status === "Accepted") {

        return "🟢 تایید شده";

    }


    if (status === "Rejected") {

        return "🔴 رد شده";

    }


    return "🟡 در انتظار بررسی";

}



// ===================================
// FILTER
// ===================================

function filterRequests(type) {


    currentFilter =
        type;


    const title =
        document.getElementById(
            "sectionTitle"
        );


    if (type === "all") {

        title.innerHTML =
            "<h2>📋 همه درخواست‌ها</h2>";

    } else {

        title.innerHTML =
            `<h2>${escapeHTML(
                getRequestTitle(type)
            )}</h2>`;

    }


    renderRequests();

}



// ===================================
// SEARCH
// ===================================

function applySearch() {

    const input =
        document.getElementById(
            "search"
        );


    currentSearch =
        input.value
        .toLowerCase()
        .trim();


    renderRequests();

}



// ===================================
// FILTER + SEARCH
// ===================================

function renderRequests() {


    const filtered =
        allTickets.filter(ticket => {


            const type =
                getTicketType(ticket);


            if (
                currentFilter !== "all" &&
                type !== currentFilter
            ) {

                return false;

            }


            if (!currentSearch) {

                return true;

            }


            const searchText = (

                String(
                    ticket._id || ""
                ) + " " +

                String(
                    ticket.icName || ""
                ) + " " +

                String(
                    ticket.name || ""
                ) + " " +

                String(
                    ticket.ocName || ""
                ) + " " +

                String(
                    ticket.oocName || ""
                ) + " " +

                String(
                    ticket.discord || ""
                ) + " " +

                String(
                    ticket.discordId || ""
                ) + " " +

                String(
                    ticket.steamHex || ""
                ) + " " +

                String(
                    ticket.cmx || ""
                )

            ).toLowerCase();


            return searchText.includes(
                currentSearch
            );

        });


    showTickets(filtered);

}



// ===================================
// SHOW TICKETS
// ===================================

function showTickets(tickets) {


    const box =
        document.getElementById(
            "tickets"
        );


    box.innerHTML = "";


    if (!tickets.length) {


        box.innerHTML = `

            <div class="ticket-card empty">

                <h2>
                    📭 درخواستی وجود ندارد
                </h2>

                <p>
                    در این بخش درخواستی پیدا نشد.
                </p>

            </div>

        `;


        return;

    }



    tickets.forEach(ticket => {


        const type =
            getTicketType(ticket);


        const status =
            ticket.status ||
            "Pending";


        const statusClass =
            getAdminStatusClass(
                status
            );


        const statusText =
            getAdminStatusText(
                status
            );


        const id =
            String(
                ticket._id || ""
            );


        let html = `

        <div
            class="ticket-card"
            data-ticket-id="${escapeHTML(id)}"
        >

            <div class="ticket-header">

                <div>

                    <h2>
                        ${escapeHTML(
                            getRequestTitle(type)
                        )}
                    </h2>

                    <small>
                        کد پیگیری:
                        ${escapeHTML(
                            id || "-"
                        )}
                    </small>

                </div>


                <span class="${statusClass}">
                    ${statusText}
                </span>

            </div>


            <p>
                <b>👤 IC Name:</b>
                ${escapeHTML(
                    ticket.icName ||
                    ticket.name ||
                    "-"
                )}
            </p>


            <p>
                <b>🎭 OC/OOC Name:</b>
                ${escapeHTML(
                    ticket.ocName ||
                    ticket.oocName ||
                    "-"
                )}
            </p>


            <p>
                <b>💬 Discord:</b>
                ${escapeHTML(
                    ticket.discordId ||
                    ticket.discord ||
                    "-"
                )}
            </p>

        `;



        // ===================================
        // MEMBERSHIP
        // ===================================

        if (type === "membership") {


            html += `

                <hr>

                <p>
                    <b>🎮 Steam Hex:</b>
                    ${escapeHTML(
                        ticket.steamHex ||
                        "-"
                    )}
                </p>

                <p>
                    <b>🆔 CMX:</b>
                    ${escapeHTML(
                        ticket.cmx ||
                        "-"
                    )}
                </p>

                <p>
                    <b>🎂 سن:</b>
                    ${escapeHTML(
                        ticket.age ||
                        "-"
                    )}
                </p>

                <p>
                    <b>🚔 تجربه رول‌پلی:</b>
                    ${escapeHTML(
                        ticket.experience ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📄 دلیل عضویت:</b>
                    ${escapeHTML(
                        ticket.reason ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📊 نمره آزمون:</b>
                    ${escapeHTML(
                        ticket.score ??
                        "-"
                    )}
                    از 20
                </p>

                <p>
                    <b>🎓 نتیجه آزمون:</b>
                    ${
                        ticket.passed === true
                        ? "🟢 قبول"
                        : "🔴 رد"
                    }
                </p>

            `;

        }



        // ===================================
        // DIVISION
        // ===================================

        if (type === "division") {


            html += `

                <hr>

                <p>
                    <b>⭐ Rank:</b>
                    ${escapeHTML(
                        ticket.rank ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📻 Call Sign:</b>
                    ${escapeHTML(
                        ticket.callSign ||
                        "-"
                    )}
                </p>

                <p>
                    <b>🎖️ Current Division:</b>
                    ${escapeHTML(
                        ticket.currentDivision ||
                        "-"
                    )}
                </p>

                <p>
                    <b>🎯 Requested Division:</b>
                    ${escapeHTML(
                        ticket.requestedDivision ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📄 Reason:</b>
                    ${escapeHTML(
                        ticket.reasonForRequest ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📚 Previous Experience:</b>
                    ${escapeHTML(
                        ticket.previousDivisionExperience ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📝 Additional Information:</b>
                    ${escapeHTML(
                        ticket.additionalInformation ||
                        "-"
                    )}
                </p>

            `;

        }



        // ===================================
        // RESIGNATION
        // ===================================

        if (type === "resignation") {


            html += `

                <hr>

                <p>
                    <b>⭐ Rank:</b>
                    ${escapeHTML(
                        ticket.rank ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📻 Call Sign:</b>
                    ${escapeHTML(
                        ticket.callSign ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📄 Reason:</b>
                    ${escapeHTML(
                        ticket.resignationReason ||
                        ticket.reason ||
                        "-"
                    )}
                </p>

            `;

        }



        // ===================================
        // RANK UP
        // ===================================

        if (type === "rankup") {


            html += `

                <hr>

                <p>
                    <b>⭐ Current Rank:</b>
                    ${escapeHTML(
                        ticket.rank ||
                        "-"
                    )}
                </p>

                <p>
                    <b>⬆️ Requested Rank:</b>
                    ${escapeHTML(
                        ticket.requestRank ||
                        "-"
                    )}
                </p>

                <p>
                    <b>⏱️ Current Rank Timeplay:</b>
                    ${escapeHTML(
                        ticket.currentRankTimeplay ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📝 Note:</b>
                    ${escapeHTML(
                        ticket.note ||
                        "-"
                    )}
                </p>

            `;

        }



        // ===================================
        // DATE + COMMAND
        // ===================================

        const createdDate =
            ticket.createdAt
            ? new Date(
                ticket.createdAt
              ).toLocaleString(
                "fa-IR"
              )
            : "-";


        html += `

            <hr>

            <p>
                <b>🕒 تاریخ ثبت:</b>
                ${escapeHTML(
                    createdDate
                )}
            </p>


            <label>
                ✍️ پاسخ فرماندهی
            </label>


            <textarea
                id="reply-${escapeHTML(id)}"
                placeholder="پاسخ فرماندهی..."
            >${escapeHTML(
                ticket.reply || ""
            )}</textarea>


            <label>
                وضعیت درخواست
            </label>


            <select
                id="status-${escapeHTML(id)}"
            >

                <option
                    value="Pending"
                    ${
                        status === "Pending"
                        ? "selected"
                        : ""
                    }
                >
                    🟡 در انتظار بررسی
                </option>


                <option
                    value="Accepted"
                    ${
                        status === "Accepted"
                        ? "selected"
                        : ""
                    }
                >
                    🟢 تایید شده
                </option>


                <option
                    value="Rejected"
                    ${
                        status === "Rejected"
                        ? "selected"
                        : ""
                    }
                >
                    🔴 رد شده
                </option>

            </select>


            <div class="ticket-buttons">

                <button
                    type="button"
                    class="btn primary"
                    onclick="saveTicket('${escapeJS(id)}')"
                >
                    💾 ذخیره تغییرات
                </button>


                <button
                    type="button"
                    class="btn delete-btn"
                    onclick="removeTicket('${escapeJS(id)}')"
                >
                    🗑 حذف درخواست
                </button>

            </div>


            <!-- CHAT -->

            <div
                class="command-chat-box"
                id="chat-${escapeHTML(id)}"
            >

                <h3>
                    💬 چت با متقاضی
                </h3>


                <div
                    class="chat-messages"
                    id="messages-${escapeHTML(id)}"
                >

                    <p style="color:#999;">
                        ⏳ در حال دریافت پیام‌ها...
                    </p>

                </div>


                <div class="chat-input-row">

                    <input
                        type="text"
                        id="chatInput-${escapeHTML(id)}"
                        placeholder="پیام خود را بنویسید..."
                        maxlength="2000"
                    >


                    <button
                        type="button"
                        class="btn primary"
                        onclick="sendCommandMessage('${escapeJS(id)}')"
                    >
                        📤 ارسال
                    </button>

                </div>

            </div>


        </div>

        `;


        box.innerHTML += html;


        loadChatMessages(id);

    });

}



// ===================================
// SAVE TICKET
// ===================================

async function saveTicket(id) {


    const statusElement =
        document.getElementById(
            "status-" + id
        );


    const replyElement =
        document.getElementById(
            "reply-" + id
        );


    if (
        !statusElement ||
        !replyElement
    ) {

        alert(
            "اطلاعات درخواست پیدا نشد ❌"
        );

        return;

    }


    const status =
        statusElement.value;


    const reply =
        replyElement.value.trim();


    try {


        const result =
            await updateTicket(
                id,
                status,
                reply
            );


        if (!result) {

            alert(
                "بروزرسانی انجام نشد ❌"
            );

            return;

        }


        alert(
            "درخواست با موفقیت بروزرسانی شد ✅"
        );


        await loadTickets();


    } catch (error) {


        console.error(
            "Save Error:",
            error
        );


        alert(
            "خطا در بروزرسانی درخواست ❌"
        );

    }

}



// ===================================
// DELETE
// ===================================

async function removeTicket(id) {


    const confirmed =
        confirm(
            "آیا از حذف این درخواست مطمئن هستید؟"
        );


    if (!confirmed) {

        return;

    }


    try {


        const result =
            await deleteTicket(id);


        if (!result) {

            alert(
                "حذف درخواست انجام نشد ❌"
            );

            return;

        }


        alert(
            "درخواست حذف شد ✅"
        );


        await loadTickets();


    } catch (error) {


        console.error(
            "Delete Error:",
            error
        );


        alert(
            "خطا در حذف درخواست ❌"
        );

    }

}



// ===================================
// LOAD CHAT
// ===================================

async function loadChatMessages(id) {


    const box =
        document.getElementById(
            "messages-" + id
        );


    if (!box) {

        return;

    }


    const messages =
        await getTicketMessages(id);


    if (!messages.length) {

        box.innerHTML = `

            <p style="color:#999;">
                هنوز پیامی وجود ندارد.
            </p>

        `;

        return;

    }


    box.innerHTML = "";


    messages.forEach(message => {


        const sender =
            message.sender === "command"
            ? "👮 فرماندهی"
            : "👤 متقاضی";


        const messageClass =
            message.sender === "command"
            ? "command"
            : "applicant";


        const date =
            message.createdAt
            ? new Date(
                message.createdAt
              ).toLocaleString(
                "fa-IR"
              )
            : "";


        box.innerHTML += `

            <div
                class="chat-message ${messageClass}"
            >

                <strong>
                    ${sender}
                </strong>

                <div>
                    ${escapeHTML(
                        message.message ||
                        ""
                    )}
                </div>

                <small>
                    ${escapeHTML(date)}
                </small>

            </div>

        `;

    });


    box.scrollTop =
        box.scrollHeight;

}



// ===================================
// SEND COMMAND MESSAGE
// ===================================

async function sendCommandMessage(id) {


    const input =
        document.getElementById(
            "chatInput-" + id
        );


    if (!input) {

        return;

    }


    const message =
        input.value.trim();


    if (!message) {

        alert(
            "پیام را وارد کنید."
        );

        return;

    }


    try {


        const result =
            await sendTicketMessage(
                id,
                message,
                "command"
            );


        if (!result) {

            alert(
                "ارسال پیام ناموفق بود ❌"
            );

            return;

        }


        input.value = "";


        await loadChatMessages(id);


    } catch (error) {


        console.error(
            "Send Command Message Error:",
            error
        );


        alert(
            "خطا در ارسال پیام ❌"
        );

    }

}



// ===================================
// ENTER TO SEND CHAT
// ===================================

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key !== "Enter"
        ) {

            return;

        }


        const target =
            event.target;


        if (
            !target ||
            !target.id ||
            !target.id.startsWith(
                "chatInput-"
            )
        ) {

            return;

        }


        event.preventDefault();


        const id =
            target.id.replace(
                "chatInput-",
                ""
            );


        sendCommandMessage(id);

    }
);



// ===================================
// SEARCH EVENT
// ===================================

document
    .getElementById("search")
    .addEventListener(
        "input",
        applySearch
    );



// ===================================
// ESCAPE HTML
// ===================================

function escapeHTML(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ===================================
// ESCAPE JAVASCRIPT
// ===================================

function escapeJS(value) {

    return String(value ?? "")

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}

loadTickets();
