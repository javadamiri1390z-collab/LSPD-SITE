<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="command-page">


<div class="overlay"></div>



<header class="navbar">

<img
src="badge.png"
class="badge"
alt="LSPD Badge"
>


<div class="nav-title">

<h2>
Vanguard LSPD
</h2>

<span>
Command Center
</span>

</div>



<button
class="login-btn"
onclick="logoutAdmin()"
>

خروج

</button>


</header>





<main class="hero">



<div class="dashboard">



<h1>
🚔 پنل فرماندهی LSPD
</h1>


<p class="dashboard-sub">
مدیریت و بررسی درخواست‌های نیروها
</p>





<div class="stats">



<div class="card stat-total">

<h2 id="total">
0
</h2>

<p>
کل درخواست‌ها
</p>

</div>




<div class="card stat-pending">

<h2 id="pending">
0
</h2>

<p>
در انتظار بررسی
</p>

</div>





<div class="card stat-accepted">

<h2 id="accepted">
0
</h2>

<p>
تایید شده
</p>

</div>



</div>







<input
class="search-box"
id="search"
type="text"
placeholder="🔍 جستجو OC Name، IC Name یا Discord..."
>







<div id="tickets">

</div>





</div>



</main>






<script src="script.js"></script>


<script>


let allTickets = [];



/* =========================
   LOAD TICKETS
========================= */


async function loadTickets(){

    try {

        allTickets = await getTickets();

        if(!Array.isArray(allTickets)){
            allTickets = [];
        }

        showTickets(allTickets);

        updateStats();

    } catch(error) {

        console.error(error);

        document.getElementById("tickets").innerHTML = `

            <div class="ticket-card empty">

                <h2>
                    ❌ خطا در دریافت درخواست‌ها
                </h2>

                <p>
                    اتصال به سرور برقرار نشد.
                </p>

            </div>

        `;

    }

}



/* =========================
   UPDATE STATS
========================= */


function updateStats(){

    document.getElementById("total").innerText =
        allTickets.length;


    document.getElementById("pending").innerText =
        allTickets.filter(
            t => t.status === "Pending"
        ).length;


    document.getElementById("accepted").innerText =
        allTickets.filter(
            t => t.status === "Accepted"
        ).length;

}



/* =========================
   SHOW TICKETS
========================= */


function showTickets(tickets){

    let box =
        document.getElementById("tickets");


    box.innerHTML = "";



    if(!tickets || tickets.length === 0){

        box.innerHTML = `

            <div class="ticket-card empty">

                <h2>
                    📭 درخواستی وجود ندارد
                </h2>

                <p>
                    هنوز درخواست عضویتی ثبت نشده است.
                </p>

            </div>

        `;

        return;

    }




    tickets.forEach(t => {


        let statusClass = "";


        if(t.status === "Pending")
            statusClass = "pending-text";


        if(t.status === "Accepted")
            statusClass = "approved-text";


        if(t.status === "Rejected")
            statusClass = "rejected-text";




        box.innerHTML += `

        <div class="ticket-card">


            <!-- HEADER -->

            <div class="ticket-header">

                <h2>
                    👮 ${escapeHTML(t.icName || t.name || "بدون نام")}
                </h2>


                <span class="${statusClass}">
                    ${escapeHTML(t.status || "Pending")}
                </span>

            </div>



            <!-- OC NAME -->

            <p>
                <b>🎭 OC Name:</b>
                ${escapeHTML(t.ocName || "-")}
            </p>



            <!-- IC NAME -->

            <p>
                <b>👤 IC Name:</b>
                ${escapeHTML(t.icName || t.name || "-")}
            </p>



            <!-- DISCORD -->

            <p>
                <b>💬 Discord:</b>
                ${escapeHTML(t.discord || "-")}
            </p>



            <!-- STEAM HEX -->

            <p>
                <b>🎮 Steam Hex:</b>
                ${escapeHTML(t.steamHex || "-")}
            </p>



            <!-- Phone number -->

            <p>
                <b>🆔 number:</b>
                ${escapeHTML(t.cmx || "-")}
            </p>



            <!-- AGE -->

            <p>
                <b>🎂 سن:</b>
                ${escapeHTML(t.age || "-")}
            </p>



            <!-- EXPERIENCE -->

            <p>
                <b>🚔 تجربه رول‌پلی:</b>
                ${escapeHTML(t.experience || "-")}
            </p>



            <!-- REASON -->

            <p>
                <b>📄 دلیل عضویت:</b>
                ${escapeHTML(t.reason || "-")}
            </p>



            <!-- CREATED DATE -->

            <p>
                <b>🕒 تاریخ ثبت:</b>
                ${
                    t.createdAt
                    ?
                    new Date(t.createdAt).toLocaleString("fa-IR")
                    :
                    "-"
                }
            </p>



            <!-- REPLY -->

            <textarea
                id="reply-${t._id}"
                placeholder="✍️ پاسخ فرماندهی..."
            >${escapeHTML(t.reply || "")}</textarea>



            <!-- STATUS -->

            <select
                id="status-${t._id}"
            >


                <option
                    value="Pending"
                    ${t.status === "Pending" ? "selected" : ""}
                >
                    🟡 در انتظار
                </option>



                <option
                    value="Accepted"
                    ${t.status === "Accepted" ? "selected" : ""}
                >
                    🟢 تایید شده
                </option>



                <option
                    value="Rejected"
                    ${t.status === "Rejected" ? "selected" : ""}
                >
                    🔴 رد شده
                </option>


            </select>



            <!-- BUTTONS -->

            <div class="ticket-buttons">


                <button
                    class="btn primary"
                    onclick="saveTicket('${t._id}')"
                >

                    💾 ذخیره

                </button>



                <button
                    class="btn delete-btn"
                    onclick="removeTicket('${t._id}')"
                >

                    🗑 حذف

                </button>


            </div>



        </div>

        `;

    });

}



/* =========================
   SAVE TICKET
========================= */


async function saveTicket(id){

    try {


        let status =
            document.getElementById(
                "status-" + id
            ).value;



        let reply =
            document.getElementById(
                "reply-" + id
            ).value;



        let result =
            await updateTicket(
                id,
                status,
                reply
            );



        if(result){

            alert(
                "تیکت با موفقیت بروزرسانی شد ✅"
            );

        }



        await loadTickets();


    } catch(error) {


        console.error(error);


        alert(
            "خطا در بروزرسانی تیکت ❌"
        );

    }

}



/* =========================
   DELETE TICKET
========================= */


async function removeTicket(id){

    if(!confirm(
        "آیا از حذف این درخواست مطمئن هستید؟"
    )){

        return;

    }



    try {


        await deleteTicket(id);


        alert(
            "تیکت حذف شد ✅"
        );


        await loadTickets();


    } catch(error) {


        console.error(error);


        alert(
            "خطا در حذف تیکت ❌"
        );

    }

}



/* =========================
   SEARCH
========================= */


document
.getElementById("search")
.addEventListener(
    "input",
    function(){

        let value =
            this.value
            .toLowerCase()
            .trim();



        let result =
            allTickets.filter(t => {


                let ocName =
                    (t.ocName || "")
                    .toLowerCase();


                let icName =
                    (t.icName || t.name || "")
                    .toLowerCase();


                let discord =
                    (t.discord || "")
                    .toLowerCase();


                let steamHex =
                    (t.steamHex || "")
                    .toLowerCase();


                let Phonenumber =
                    (t.number || "")
                    .toLowerCase();



                return (

                    ocName.includes(value)

                    ||

                    icName.includes(value)

                    ||

                    discord.includes(value)

                    ||

                    steamHex.includes(value)

                    ||

                    cmx.includes(value)

                );

            });



        showTickets(result);

    }

);



/* =========================
   SECURITY
   جلوگیری از HTML Injection
========================= */


function escapeHTML(value){

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================
   START
========================= */


loadTickets();


</script>


</body>

</html>
