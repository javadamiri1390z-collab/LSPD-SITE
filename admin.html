<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">
</head>

<body class="command-page">

<div class="overlay"></div>

<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="LSPD Badge"
    >

    <div class="nav-title">
        <h2>Vanguard LSPD</h2>
        <span>Command Center</span>
    </div>

    <button
        class="login-btn"
        onclick="logoutAdmin()"
    >
        خروج
    </button>

</header>


<main class="hero">

<div class="dashboard">

    <h1>🚔 پنل فرماندهی LSPD</h1>

    <p class="dashboard-sub">
        مدیریت درخواست‌ها و ارتباط با متقاضیان
    </p>


    <!-- =========================
         STATS
    ========================= -->

    <div class="stats">

        <div class="card stat-total">
            <h2 id="total">0</h2>
            <p>کل درخواست‌ها</p>
        </div>

        <div class="card stat-pending">
            <h2 id="pending">0</h2>
            <p>در انتظار بررسی</p>
        </div>

        <div class="card stat-accepted">
            <h2 id="accepted">0</h2>
            <p>تایید شده</p>
        </div>

        <div class="card">
            <h2 id="rejected">0</h2>
            <p>رد شده</p>
        </div>

    </div>


    <!-- =========================
         SEARCH
    ========================= -->

    <input
        class="search-box"
        id="search"
        type="text"
        placeholder="🔍 جستجو IC Name، OOC Name، Discord یا کد پیگیری..."
        autocomplete="off"
    >


    <!-- =========================
         FILTER
    ========================= -->

    <div
        class="request-tabs"
        style="
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin:25px 0;
        "
    >

        <button
            class="btn primary"
            onclick="filterRequests('all')"
        >
            📋 همه درخواست‌ها
        </button>

        <button
            class="btn"
            onclick="filterRequests('membership')"
        >
            🚔 درخواست عضویت
        </button>

        <button
            class="btn"
            onclick="filterRequests('division')"
        >
            🎖️ درخواست دیویژن
        </button>

        <button
            class="btn"
            onclick="filterRequests('resignation')"
        >
            📤 درخواست استعفا
        </button>

        <button
            class="btn"
            onclick="filterRequests('rankup')"
        >
            ⬆️ درخواست رنکاپ
        </button>

    </div>


    <div
        id="sectionTitle"
        style="margin-bottom:20px;"
    >
        <h2>📋 همه درخواست‌ها</h2>
    </div>


    <!-- =========================
         REQUESTS
    ========================= -->

    <div id="tickets"></div>

</div>

</main>


<script src="script.js"></script>

<script>

let allTickets = [];

let currentFilter = "all";

let currentSearch = "";

const API_URL =
    "https://lspd-site-11.onrender.com";


// ===================================
// LOAD TICKETS
// ===================================

async function loadTickets() {

    const box =
        document.getElementById("tickets");

    box.innerHTML = `
        <div class="ticket-card">
            <h3>
                ⏳ در حال دریافت درخواست‌ها...
            </h3>
        </div>
    `;

    try {

        allTickets =
            await getTickets();

        if (!Array.isArray(allTickets)) {

            allTickets = [];

        }

        updateStats();

        renderRequests();

    } catch (error) {

        console.error(error);

        box.innerHTML = `
            <div class="ticket-card empty">

                <h2>
                    ❌ خطا در دریافت درخواست‌ها
                </h2>

                <p>
                    اتصال به سرور برقرار نشد.
                </p>

            </div>
        `;

    }

}


// ===================================
// STATS
// ===================================

function updateStats() {

    document.getElementById("total").innerText =
        allTickets.length;

    document.getElementById("pending").innerText =
        allTickets.filter(
            t =>
            (t.status || "Pending")
            === "Pending"
        ).length;

    document.getElementById("accepted").innerText =
        allTickets.filter(
            t =>
            t.status === "Accepted"
        ).length;

    document.getElementById("rejected").innerText =
        allTickets.filter(
            t =>
            t.status === "Rejected"
        ).length;

}


// ===================================
// REQUEST TYPE
// ===================================

function getRequestType(ticket) {

    return ticket.requestType ||
           ticket.type ||
           "membership";

}


function getRequestTitle(type) {

    switch (type) {

        case "membership":
            return "🚔 درخواست عضویت";

        case "division":
            return "🎖️ درخواست دیویژن";

        case "resignation":
            return "📤 درخواست استعفا";

        case "rankup":
            return "⬆️ درخواست رنکاپ";

        default:
            return "📋 درخواست";

    }

}


// ===================================
// STATUS
// ===================================

function getStatusClass(status) {

    if (status === "Accepted") {

        return "approved-text";

    }

    if (status === "Rejected") {

        return "rejected-text";

    }

    return "pending-text";

}


function getStatusText(status) {

    if (status === "Accepted") {

        return "🟢 تایید شده";

    }

    if (status === "Rejected") {

        return "🔴 رد شده";

    }

    return "🟡 در انتظار";

}


// ===================================
// FILTER
// ===================================

function filterRequests(type) {

    currentFilter = type;

    const title =
        document.getElementById(
            "sectionTitle"
        );

    if (type === "all") {

        title.innerHTML =
            "<h2>📋 همه درخواست‌ها</h2>";

    } else {

        title.innerHTML =
            `<h2>${getRequestTitle(type)}</h2>`;

    }

    renderRequests();

}


// ===================================
// RENDER
// ===================================

function renderRequests() {

    const filtered =
        allTickets.filter(ticket => {

            const type =
                getRequestType(ticket);

            if (
                currentFilter !== "all" &&
                type !== currentFilter
            ) {

                return false;

            }

            if (!currentSearch) {

                return true;

            }

            const searchText = (

                (ticket._id || "") + " " +
                (ticket.icName || "") + " " +
                (ticket.ocName || "") + " " +
                (ticket.oocName || "") + " " +
                (ticket.discord || "") + " " +
                (ticket.discordId || "") + " " +
                (ticket.steamHex || "") + " " +
                (ticket.cmx || "")

            ).toLowerCase();

            return searchText.includes(
                currentSearch
            );

        });

    showTickets(filtered);

}


// ===================================
// SHOW TICKETS
// ===================================

function showTickets(tickets) {

    const box =
        document.getElementById("tickets");

    box.innerHTML = "";

    if (!tickets.length) {

        box.innerHTML = `
            <div class="ticket-card empty">

                <h2>
                    📭 درخواستی وجود ندارد
                </h2>

                <p>
                    در این بخش درخواستی پیدا نشد.
                </p>

            </div>
        `;

        return;

    }


    tickets.forEach(ticket => {

        const type =
            getRequestType(ticket);

        const status =
            ticket.status || "Pending";

        const statusClass =
            getStatusClass(status);

        const statusText =
            getStatusText(status);


        let html = `

        <div class="ticket-card">

            <div class="ticket-header">

                <div>

                    <h2>
                        ${getRequestTitle(type)}
                    </h2>

                    <small>
                        کد پیگیری:
                        ${escapeHTML(
                            ticket._id || "-"
                        )}
                    </small>

                </div>

                <span class="${statusClass}">
                    ${statusText}
                </span>

            </div>

        `;


        // ===================================
        // COMMON
        // ===================================

        html += `

            <p>
                <b>👤 IC Name:</b>
                ${escapeHTML(
                    ticket.icName ||
                    ticket.name ||
                    "-"
                )}
            </p>

            <p>
                <b>🎭 OOC Name:</b>
                ${escapeHTML(
                    ticket.oocName ||
                    ticket.ocName ||
                    "-"
                )}
            </p>

            <p>
                <b>💬 Discord:</b>
                ${escapeHTML(
                    ticket.discordId ||
                    ticket.discord ||
                    "-"
                )}
            </p>

        `;


        // ===================================
        // MEMBERSHIP
        // ===================================

        if (type === "membership") {

            html += `

                <p>
                    <b>🎮 Steam Hex:</b>
                    ${escapeHTML(
                        ticket.steamHex || "-"
                    )}
                </p>

                <p>
                    <b>🆔 CMX:</b>
                    ${escapeHTML(
                        ticket.cmx || "-"
                    )}
                </p>

                <p>
                    <b>🎂 سن:</b>
                    ${escapeHTML(
                        ticket.age || "-"
                    )}
                </p>

                <p>
                    <b>🚔 تجربه رول‌پلی:</b>
                    ${escapeHTML(
                        ticket.experience || "-"
                    )}
                </p>

                <p>
                    <b>📄 دلیل عضویت:</b>
                    ${escapeHTML(
                        ticket.reason || "-"
                    )}
                </p>

            `;

        }


        // ===================================
        // EXAM SCORE
        // ===================================

        if (
            type === "membership" &&
            ticket.score !== null &&
            ticket.score !== undefined
        ) {

            const score =
                Number(ticket.score);

            const passed =
                score >= 12;

            html += `

                <div
                    style="
                        margin:15px 0;
                        padding:15px;
                        border-radius:10px;
                        background:rgba(255,255,255,.06);
                    "
                >

                    <h3>
                        📝 نتیجه آزمون
                    </h3>

                    <p>

                        <b>
                            نمره:
                        </b>

                        ${escapeHTML(score)}
                        / 20

                    </p>

                    <p>

                        <b>
                            حداقل نمره قبولی:
                        </b>

                        12 / 20

                    </p>

                    <p
                        style="
                            color:${passed
                                ? "#00ff88"
                                : "#ff3333"};
                            font-weight:bold;
                        "
                    >

                        ${
                            passed
                            ? "🟢 قبول شده"
                            : "🔴 مردود شده"
                        }

                    </p>

                </div>

            `;

        }


        // ===================================
        // DIVISION
        // ===================================

        if (type === "division") {

            html += `

                <p>
                    <b>⭐ Rank:</b>
                    ${escapeHTML(
                        ticket.rank || "-"
                    )}
                </p>

                <p>
                    <b>📻 Call Sign:</b>
                    ${escapeHTML(
                        ticket.callSign || "-"
                    )}
                </p>

                <p>
                    <b>🎖️ Current Division:</b>
                    ${escapeHTML(
                        ticket.currentDivision || "-"
                    )}
                </p>

                <p>
                    <b>🎯 Requested Division:</b>
                    ${escapeHTML(
                        ticket.requestedDivision || "-"
                    )}
                </p>

                <p>
                    <b>📄 Reason:</b>
                    ${escapeHTML(
                        ticket.reasonForRequest ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📚 Previous Experience:</b>
                    ${escapeHTML(
                        ticket.previousDivisionExperience ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📝 Additional Information:</b>
                    ${escapeHTML(
                        ticket.additionalInformation ||
                        "-"
                    )}
                </p>

            `;

        }


        // ===================================
        // RESIGNATION
        // ===================================

        if (type === "resignation") {

            html += `

                <p>
                    <b>⭐ Rank:</b>
                    ${escapeHTML(
                        ticket.rank || "-"
                    )}
                </p>

                <p>
                    <b>📻 Call Sign:</b>
                    ${escapeHTML(
                        ticket.callSign || "-"
                    )}
                </p>

                <p>
                    <b>📄 Reason:</b>
                    ${escapeHTML(
                        ticket.resignationReason ||
                        ticket.reason ||
                        "-"
                    )}
                </p>

            `;

        }


        // ===================================
        // RANKUP
        // ===================================

        if (type === "rankup") {

            html += `

                <p>
                    <b>⭐ Current Rank:</b>
                    ${escapeHTML(
                        ticket.rank || "-"
                    )}
                </p>

                <p>
                    <b>⬆️ Requested Rank:</b>
                    ${escapeHTML(
                        ticket.requestRank || "-"
                    )}
                </p>

                <p>
                    <b>⏱️ Current Rank Timeplay:</b>
                    ${escapeHTML(
                        ticket.currentRankTimeplay ||
                        "-"
                    )}
                </p>

                <p>
                    <b>📝 Note:</b>
                    ${escapeHTML(
                        ticket.note || "-"
                    )}
                </p>

            `;

        }


        // ===================================
        // DATE + RESPONSE
        // ===================================

        html += `

            <p>

                <b>
                    🕒 تاریخ ثبت:
                </b>

                ${
                    ticket.createdAt
                    ? new Date(
                        ticket.createdAt
                      ).toLocaleString(
                        "fa-IR"
                      )
                    : "-"
                }

            </p>


            <hr>


            <label>
                ✍️ پاسخ فرماندهی
            </label>

            <textarea
                id="reply-${ticket._id}"
                placeholder="پاسخ فرماندهی..."
            >${escapeHTML(
                ticket.reply || ""
            )}</textarea>


            <label>
                وضعیت درخواست
            </label>

            <select
                id="status-${ticket._id}"
            >

                <option
                    value="Pending"
                    ${
                        status === "Pending"
                        ? "selected"
                        : ""
                    }
                >
                    🟡 در انتظار
                </option>

                <option
                    value="Accepted"
                    ${
                        status === "Accepted"
                        ? "selected"
                        : ""
                    }
                >
                    🟢 تایید شده
                </option>

                <option
                    value="Rejected"
                    ${
                        status === "Rejected"
                        ? "selected"
                        : ""
                    }
                >
                    🔴 رد شده
                </option>

            </select>


            <div class="ticket-buttons">

                <button
                    class="btn primary"
                    onclick="saveTicket('${ticket._id}')"
                >
                    💾 ذخیره
                </button>

                <button
                    class="btn delete-btn"
                    onclick="removeTicket('${ticket._id}')"
                >
                    🗑 حذف
                </button>

            </div>


            <!-- =========================
                 COMMAND CHAT
            ========================= -->

            <div
                class="command-chat-box"
                style="
                    margin-top:25px;
                    padding:18px;
                    border-top:1px solid rgba(255,255,255,.15);
                "
            >

                <h3>
                    💬 چت با متقاضی
                </h3>

                <div
                    id="chat-${ticket._id}"
                    style="
                        max-height:350px;
                        overflow-y:auto;
                        margin:15px 0;
                        padding:10px;
                        background:rgba(0,0,0,.18);
                        border-radius:10px;
                    "
                >

                    <p style="color:#aaa;">
                        ⏳ در حال دریافت پیام‌ها...
                    </p>

                </div>


                <textarea
                    id="message-${ticket._id}"
                    maxlength="2000"
                    placeholder="پیام خود را برای متقاضی بنویسید..."
                    style="
                        width:100%;
                        min-height:90px;
                        resize:vertical;
                    "
                ></textarea>


                <button
                    class="btn primary"
                    style="margin-top:10px;"
                    onclick="sendCommandMessage('${ticket._id}')"
                >
                    📤 ارسال پیام
                </button>

            </div>


        </div>

        `;


        box.innerHTML += html;

    });


    // بعد از ساخت HTML
    // چت هر درخواست را دریافت می‌کنیم

    tickets.forEach(ticket => {

        loadChat(ticket._id);

    });

}


// ===================================
// LOAD CHAT
// ===================================

async function loadChat(id) {

    const box =
        document.getElementById(
            "chat-" + id
        );

    if (!box) {

        return;

    }

    try {

        const response =
            await fetch(
                API_URL +
                "/tickets/" +
                encodeURIComponent(id) +
                "/messages"
            );


        if (!response.ok) {

            throw new Error(
                "Chat request failed"
            );

        }


        const messages =
            await response.json();


        if (
            !Array.isArray(messages) ||
            messages.length === 0
        ) {

            box.innerHTML = `

                <p
                    style="
                        color:#888;
                        text-align:center;
                    "
                >
                    هنوز پیامی ارسال نشده است.
                </p>

            `;

            return;

        }


        box.innerHTML = "";


        messages.forEach(message => {

            const isCommand =
                message.sender === "command";


            const messageDiv =
                document.createElement(
                    "div"
                );


            messageDiv.style.cssText = `

                margin:8px 0;
                padding:10px 12px;
                border-radius:10px;
                background:${
                    isCommand
                    ? "rgba(0,140,255,.15)"
                    : "rgba(255,255,255,.07)"
                };

            `;


            const sender =
                document.createElement(
                    "strong"
                );


            sender.textContent =
                isCommand
                ? "🚔 فرماندهی"
                : "👤 متقاضی";


            const text =
                document.createElement(
                    "div"
                );


            text.textContent =
                message.message || "";


            text.style.cssText = `
                margin-top:5px;
                white-space:pre-wrap;
                word-break:break-word;
            `;


            const date =
                document.createElement(
                    "small"
                );


            date.textContent =
                message.createdAt
                ? new Date(
                    message.createdAt
                  ).toLocaleString(
                    "fa-IR"
                  )
                : "";


            date.style.cssText = `
                display:block;
                margin-top:6px;
                color:#888;
                font-size:11px;
            `;


            messageDiv.appendChild(
                sender
            );

            messageDiv.appendChild(
                text
            );

            messageDiv.appendChild(
                date
            );


            box.appendChild(
                messageDiv
            );

        });


        box.scrollTop =
            box.scrollHeight;


    } catch (error) {

        console.error(
            "Load Chat Error:",
            error
        );


        box.innerHTML = `

            <p style="color:#ff5555;">
                ❌ دریافت پیام‌ها ناموفق بود.
            </p>

        `;

    }

}


// ===================================
// SEND COMMAND MESSAGE
// ===================================

async function sendCommandMessage(id) {

    const input =
        document.getElementById(
            "message-" + id
        );


    if (!input) {

        return;

    }


    const message =
        input.value.trim();


    if (!message) {

        alert(
            "لطفاً پیام را وارد کنید."
        );

        return;

    }


    if (message.length > 2000) {

        alert(
            "پیام نمی‌تواند بیشتر از ۲۰۰۰ کاراکتر باشد."
        );

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id) +
                "/messages",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        sender:
                            "command",

                        message:
                            message

                    })

                }

            );


        const result =
            await response.json();


        if (!response.ok || !result.success) {

            throw new Error(
                result.message ||
                "Send message failed"
            );

        }


        input.value = "";


        await loadChat(id);


    } catch (error) {

        console.error(
            "Send Message Error:",
            error
        );


        alert(
            "❌ ارسال پیام انجام نشد."
        );

    }

}


// ===================================
// SAVE TICKET
// ===================================

async function saveTicket(id) {

    try {

        const status =
            document.getElementById(
                "status-" + id
            ).value;


        const reply =
            document.getElementById(
                "reply-" + id
            ).value;


        const result =
            await updateTicket(
                id,
                status,
                reply
            );


        if (result) {

            alert(
                "درخواست با موفقیت بروزرسانی شد ✅"
            );

        } else {

            alert(
                "بروزرسانی انجام نشد ❌"
            );

        }


        await loadTickets();


    } catch (error) {

        console.error(error);

        alert(
            "خطا در بروزرسانی درخواست ❌"
        );

    }

}


// ===================================
// DELETE
// ===================================

async function removeTicket(id) {

    if (
        !confirm(
            "آیا از حذف این درخواست مطمئن هستید؟"
        )
    ) {

        return;

    }


    try {

        const result =
            await deleteTicket(id);


        if (result) {

            alert(
                "درخواست حذف شد ✅"
            );

        } else {

            alert(
                "حذف درخواست انجام نشد ❌"
            );

        }


        await loadTickets();


    } catch (error) {

        console.error(error);

        alert(
            "خطا در حذف درخواست ❌"
        );

    }

}


// ===================================
// SEARCH
// ===================================

document
.getElementById("search")
.addEventListener(
    "input",
    function() {

        currentSearch =
            this.value
            .toLowerCase()
            .trim();

        renderRequests();

    }
);


// ===================================
// ESCAPE HTML
// ===================================

function escapeHTML(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ===================================
// START
// ===================================

loadTickets();

</script>

</body>

</html>
