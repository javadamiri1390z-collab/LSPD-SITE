<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="command-page">

<div class="overlay"></div>


<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="LSPD Badge"
    >

    <div class="nav-title">

        <h2>
            Vanguard LSPD
        </h2>

        <span>
            Command Center
        </span>

    </div>


    <button
        class="login-btn"
        onclick="logoutAdmin()"
    >
        خروج
    </button>

</header>



<main class="hero">


<div class="dashboard">


<h1>
    🚔 پنل فرماندهی LSPD
</h1>


<p class="dashboard-sub">
    مدیریت و بررسی درخواست‌های نیروها
</p>



<!-- =========================
     STATS
========================= -->

<div class="stats">


    <div class="card stat-total">

        <h2 id="total">
            0
        </h2>

        <p>
            کل درخواست‌ها
        </p>

    </div>


    <div class="card stat-pending">

        <h2 id="pending">
            0
        </h2>

        <p>
            در انتظار بررسی
        </p>

    </div>


    <div class="card stat-accepted">

        <h2 id="accepted">
            0
        </h2>

        <p>
            تایید شده
        </p>

    </div>


</div>



<!-- =========================
     SEARCH
========================= -->

<input
    class="search-box"
    id="search"
    type="text"
    placeholder="🔍 جستجو IC Name، OOC Name یا Discord..."
>



<!-- =========================
     REQUEST FILTER BUTTONS
========================= -->

<div
    class="request-tabs"
    style="
        display:flex;
        flex-wrap:wrap;
        gap:10px;
        margin:25px 0;
    "
>


    <button
        class="btn primary"
        onclick="filterRequests('all')"
    >
        📋 همه درخواست‌ها
    </button>


    <button
        class="btn"
        onclick="filterRequests('membership')"
    >
        🚔 درخواست عضویت
    </button>


    <button
        class="btn"
        onclick="filterRequests('division')"
    >
        🎖️ درخواست دیویژن
    </button>


    <button
        class="btn"
        onclick="filterRequests('resignation')"
    >
        📤 درخواست استعفا
    </button>


    <button
        class="btn"
        onclick="filterRequests('rankup')"
    >
        ⬆️ درخواست رنکاپ
    </button>


</div>



<!-- =========================
     SECTION TITLES
========================= -->

<div
    id="sectionTitle"
    style="margin-bottom:20px;"
>

    <h2>
        📋 همه درخواست‌ها
    </h2>

</div>



<!-- =========================
     TICKETS
========================= -->

<div id="tickets"></div>



</div>

</main>



<script src="script.js"></script>


<script>


let allTickets = [];

let currentFilter = "all";

let currentSearch = "";



// ===================================
// LOAD TICKETS
// ===================================

async function loadTickets() {

    try {

        allTickets = await getTickets();


        if (!Array.isArray(allTickets)) {

            allTickets = [];

        }


        updateStats();

        renderRequests();


    } catch (error) {

        console.error(error);


        document.getElementById(
            "tickets"
        ).innerHTML = `

            <div class="ticket-card empty">

                <h2>
                    ❌ خطا در دریافت درخواست‌ها
                </h2>

                <p>
                    اتصال به سرور برقرار نشد.
                </p>

            </div>

        `;

    }

}



// ===================================
// STATS
// ===================================

function updateStats() {

    document.getElementById(
        "total"
    ).innerText =
        allTickets.length;


    document.getElementById(
        "pending"
    ).innerText =

        allTickets.filter(
            t =>
            (t.status || "Pending")
            === "Pending"
        ).length;


    document.getElementById(
        "accepted"
    ).innerText =

        allTickets.filter(
            t =>
            t.status === "Accepted"
        ).length;

}



// ===================================
// REQUEST TYPE
// ===================================

function getRequestType(ticket) {

    return ticket.requestType ||
           ticket.type ||
           "membership";

}



// ===================================
// REQUEST TITLE
// ===================================

function getRequestTitle(type) {

    switch (type) {

        case "membership":
            return "🚔 درخواست عضویت";

        case "division":
            return "🎖️ درخواست دیویژن";

        case "resignation":
            return "📤 درخواست استعفا";

        case "rankup":
            return "⬆️ درخواست رنکاپ";

        default:
            return "📋 درخواست";

    }

}



// ===================================
// STATUS CLASS
// ===================================

function getStatusClass(status) {

    if (status === "Accepted") {

        return "approved-text";

    }


    if (status === "Rejected") {

        return "rejected-text";

    }


    return "pending-text";

}



// ===================================
// STATUS TEXT
// ===================================

function getStatusText(status) {

    if (status === "Accepted") {

        return "🟢 تایید شده";

    }


    if (status === "Rejected") {

        return "🔴 رد شده";

    }


    return "🟡 در انتظار";

}



// ===================================
// RENDER REQUESTS
// ===================================

function renderRequests() {


    let filtered =
        allTickets.filter(ticket => {


            let type =
                getRequestType(ticket);


            let typeMatch =

                currentFilter === "all" ||

                type === currentFilter;


            if (!typeMatch) {

                return false;

            }


            if (!currentSearch) {

                return true;

            }


            let searchText =

                (

                    (ticket.icName || "") +

                    " " +

                    (ticket.ocName || "") +

                    " " +

                    (ticket.oocName || "") +

                    " " +

                    (ticket.discord || "") +

                    " " +

                    (ticket.discordId || "") +

                    " " +

                    (ticket.steamHex || "") +

                    " " +

                    (ticket.cmx || "")

                ).toLowerCase();


            return searchText.includes(
                currentSearch
            );

        });


    showTickets(filtered);

}



// ===================================
// FILTER BUTTON
// ===================================

function filterRequests(type) {


    currentFilter = type;


    let title =
        document.getElementById(
            "sectionTitle"
        );


    title.innerHTML = `

        <h2>
            ${getRequestTitle(type)}
        </h2>

    `;


    if (type === "all") {

        title.innerHTML = `

            <h2>
                📋 همه درخواست‌ها
            </h2>

        `;

    }


    renderRequests();

}



// ===================================
// SHOW TICKETS
// ===================================

function showTickets(tickets) {


    let box =
        document.getElementById(
            "tickets"
        );


    box.innerHTML = "";


    if (
        !tickets ||
        tickets.length === 0
    ) {


        box.innerHTML = `

            <div class="ticket-card empty">

                <h2>
                    📭 درخواستی وجود ندارد
                </h2>

                <p>
                    در این بخش هنوز درخواستی ثبت نشده است.
                </p>

            </div>

        `;


        return;

    }



    tickets.forEach(ticket => {

        let type =
            getRequestType(ticket);


        let status =
            ticket.status || "Pending";


        let statusClass =
            getStatusClass(status);


        let statusText =
            getStatusText(status);


        let html = "";



        // ===================================
        // HEADER
        // ===================================

        html += `

        <div class="ticket-card">

            <div class="ticket-header">

                <div>

                    <h2>
                        ${getRequestTitle(type)}
                    </h2>

                    <small>
                        ID:
                        ${escapeHTML(
                            ticket._id || "-"
                        )}
                    </small>

                </div>


                <span class="${statusClass}">

                    ${statusText}

                </span>

            </div>

        `;



        // ===================================
        // MEMBERSHIP
        // ===================================

        if (type === "membership") {

            html += `

                <p>
                    <b>🎭 OOC Name:</b>
                    ${escapeHTML(
                        ticket.ocName ||
                        ticket.oocName ||
                        "-"
                    )}
                </p>


                <p>
                    <b>👤 IC Name:</b>
                    ${escapeHTML(
                        ticket.icName ||
                        ticket.name ||
                        "-"
                    )}
                </p>


                <p>
                    <b>💬 Discord:</b>
                    ${escapeHTML(
                        ticket.discordId ||
                        ticket.discord ||
                        "-"
                    )}
                </p>


                <p>
                    <b>🎮 Steam Hex:</b>
                    ${escapeHTML(
                        ticket.steamHex ||
                        "-"
                    )}
                </p>


                <p>
                    <b>🆔 CMX:</b>
                    ${escapeHTML(
                        ticket.cmx ||
                        "-"
                    )}
                </p>


                <p>
                    <b>🎂 سن:</b>
                    ${escapeHTML(
                        ticket.age ||
                        "-"
                    )}
                </p>


                <p>
                    <b>🚔 تجربه رول‌پلی:</b>
                    ${escapeHTML(
                        ticket.experience ||
                        "-"
                    )}
                </p>


                <p>
                    <b>📄 دلیل عضویت:</b>
                    ${escapeHTML(
                        ticket.reason ||
                        "-"
                    )}
                </p>

            `;

        }



        // ===================================
        // DIVISION
        // ===================================

        if (type === "division") {

            html += `

                <p>
                    <b>👤 IC Name:</b>
                    ${escapeHTML(
                        ticket.icName ||
                        "-"
                    )}
                </p>


                <p>
                    <b>🎭 OOC Name:</b>
                    ${escapeHTML(
                        ticket.oocName ||
                        ticket.ocName ||
                        "-"
                    )}
                </p>


                <p>
                    <b>💬 Discord ID:</b>
                    ${escapeHTML(
                        ticket.discordId ||
                        ticket.discord ||
                        "-"
                    )}
                </p>


                <p>
                    <b>🎮 Steam Hex:</b>
                    ${escapeHTML(
                        ticket.steamHex ||
                        "-"
                    )}
                </p>


                <p>
                    <b>⭐ Rank:</b>
                    ${escapeHTML(
                        ticket.rank ||
                        "-"
                    )}
                </p>


                <p>
                    <b>📻 Call Sign:</b>
                    ${escapeHTML(
                        ticket.callSign ||
                        "-"
                    )}
                </p>


                <p>
                    <b>🎖️ Current Division:</b>
                    ${escapeHTML(
                        ticket.currentDivision ||
                        "-"
                    )}
                </p>


                <p>
                    <b>🎯 Requested Division:</b>
                    ${escapeHTML(
                        ticket.requestedDivision ||
                        "-"
                    )}
                </p>


                <p>
                    <b>📄 Reason:</b>
                    ${escapeHTML(
                        ticket.reasonForRequest ||
                        "-"
                    )}
                </p>


                <p>
                    <b>📚 Previous Division Experience:</b>
                    ${escapeHTML(
                        ticket.previousDivisionExperience ||
                        "-"
                    )}
                </p>


                <p>
                    <b>📝 Additional Information:</b>
                    ${escapeHTML(
                        ticket.additionalInformation ||
                        "-"
                    )}
                </p>

            `;

        }



        // ===================================
        // RESIGNATION
        // ===================================

        if (type === "resignation") {

            html += `

                <p>
                    <b>👤 IC Name:</b>
                    ${escapeHTML(
                        ticket.icName ||
                        "-"
                    )}
                </p>


                <p>
                    <b>🎭 OOC Name:</b>
                    ${escapeHTML(
                        ticket.oocName ||
                        ticket.ocName ||
                        "-"
                    )}
                </p>


                <p>
                    <b>⭐ Rank:</b>
                    ${escapeHTML(
                        ticket.rank ||
                        "-"
                    )}
                </p>


                <p>
                    <b>📻 Call Sign:</b>
                    ${escapeHTML(
                        ticket.callSign ||
                        "-"
                    )}
                </p>


                <p>
                    <b>📄 Reason:</b>
                    ${escapeHTML(
                        ticket.resignationReason ||
                        ticket.reason ||
                        "-"
                    )}
                </p>

            `;

        }



        // ===================================
        // RANKUP
        // ===================================

        if (type === "rankup") {

            html += `

                <p>
                    <b>👤 IC Name:</b>
                    ${escapeHTML(
                        ticket.icName ||
                        "-"
                    )}
                </p>


                <p>
                    <b>🎭 OOC Name:</b>
                    ${escapeHTML(
                        ticket.oocName ||
                        ticket.ocName ||
                        "-"
                    )}
                </p>


                <p>
                    <b>💬 Discord ID:</b>
                    ${escapeHTML(
                        ticket.discordId ||
                        ticket.discord ||
                        "-"
                    )}
                </p>


                <p>
                    <b>⭐ Current Rank:</b>
                    ${escapeHTML(
                        ticket.rank ||
                        "-"
                    )}
                </p>


                <p>
                    <b>⬆️ Request Rank:</b>
                    ${escapeHTML(
                        ticket.requestRank ||
                        "-"
                    )}
                </p>


                <p>
                    <b>⏱️ Current Rank Timeplay:</b>
                    ${escapeHTML(
                        ticket.currentRankTimeplay ||
                        "-"
                    )}
                </p>


                <p>
                    <b>📝 Note:</b>
                    ${escapeHTML(
                        ticket.note ||
                        "-"
                    )}
                </p>

            `;

        }



        // ===================================
        // DATE
        // ===================================

        html += `

            <p>

                <b>
                    🕒 تاریخ ثبت:
                </b>

                ${
                    ticket.createdAt

                    ?

                    new Date(
                        ticket.createdAt
                    ).toLocaleString(
                        "fa-IR"
                    )

                    :

                    "-"
                }

            </p>

        `;



        // ===================================
        // COMMAND RESPONSE
        // ===================================

        html += `

            <hr>


            <label>
                ✍️ پاسخ فرماندهی
            </label>


            <textarea
                id="reply-${ticket._id}"
                placeholder="پاسخ فرماندهی را بنویسید..."
            >${escapeHTML(
                ticket.reply || ""
            )}</textarea>



            <label>
                وضعیت درخواست
            </label>


            <select
                id="status-${ticket._id}"
            >

                <option
                    value="Pending"
                    ${
                        status === "Pending"
                        ? "selected"
                        : ""
                    }
                >
                    🟡 در انتظار
                </option>


                <option
                    value="Accepted"
                    ${
                        status === "Accepted"
                        ? "selected"
                        : ""
                    }
                >
                    🟢 تایید شده
                </option>


                <option
                    value="Rejected"
                    ${
                        status === "Rejected"
                        ? "selected"
                        : ""
                    }
                >
                    🔴 رد شده
                </option>

            </select>



            <div class="ticket-buttons">


                <button
                    class="btn primary"
                    onclick="saveTicket('${ticket._id}')"
                >
                    💾 ذخیره
                </button>


                <button
                    class="btn delete-btn"
                    onclick="removeTicket('${ticket._id}')"
                >
                    🗑 حذف
                </button>


            </div>


        </div>

        `;



        box.innerHTML += html;

    });

}



// ===================================
// SAVE
// ===================================

async function saveTicket(id) {

    try {


        let status =
            document.getElementById(
                "status-" + id
            ).value;


        let reply =
            document.getElementById(
                "reply-" + id
            ).value;


        let result =
            await updateTicket(
                id,
                status,
                reply
            );


        if (result) {

            alert(
                "درخواست با موفقیت بروزرسانی شد ✅"
            );

        }


        await loadTickets();


    } catch (error) {

        console.error(error);


        alert(
            "خطا در بروزرسانی درخواست ❌"
        );

    }

}



// ===================================
// DELETE
// ===================================

async function removeTicket(id) {


    if (
        !confirm(
            "آیا از حذف این درخواست مطمئن هستید؟"
        )
    ) {

        return;

    }


    try {


        await deleteTicket(id);


        alert(
            "درخواست حذف شد ✅"
        );


        await loadTickets();


    } catch (error) {

        console.error(error);


        alert(
            "خطا در حذف درخواست ❌"
        );

    }

}



// ===================================
// SEARCH
// ===================================

document
.getElementById("search")
.addEventListener(
    "input",
    function() {


        currentSearch =
            this.value
            .toLowerCase()
            .trim();


        renderRequests();

    }
);



// ===================================
// ESCAPE HTML
// ===================================

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ===================================
// START
// ===================================

loadTickets();

</script>

</body>

</html>
