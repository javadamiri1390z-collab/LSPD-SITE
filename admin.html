<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================
   ADMIN PAGE
========================================= */

.command-page {
    min-height: 100vh;
}

.admin-wrapper {
    width: 1200px;
    max-width: 95%;
    margin: 35px auto;
}

/* Header */

.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;

    padding: 25px;

    background: rgba(0,0,0,.62);
    backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 22px;

    box-shadow: 0 0 35px rgba(0,110,255,.2);
}

.admin-header-title h1 {
    margin: 0;
    color: #4da6ff;
    font-size: 28px;
}

.admin-header-title p {
    margin-top: 7px;
    color: #aaa;
}

.admin-user {
    padding: 12px 18px;
    border-radius: 12px;

    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
}

/* Stats */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin: 25px 0;
}

.admin-stat {
    padding: 22px;

    background: rgba(0,0,0,.55);
    backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;

    text-align: center;
}

.admin-stat strong {
    display: block;
    font-size: 30px;
    color: #4da6ff;
}

.admin-stat span {
    color: #aaa;
}

/* Toolbar */

.toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;

    margin-bottom: 20px;
}

.toolbar input,
.toolbar select {

    flex: 1;
    min-width: 180px;

    padding: 14px;

    background: rgba(0,0,0,.55);
    color: white;

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;

    outline: none;
}

.toolbar input:focus,
.toolbar select:focus {
    border-color: #168cff;
}

/* Ticket list */

.ticket-list {
    display: grid;
    gap: 18px;
}

.ticket-card {

    padding: 25px;

    background: rgba(0,0,0,.58);
    backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,.13);
    border-radius: 20px;

    box-shadow: 0 10px 35px rgba(0,0,0,.2);
}

.ticket-card:hover {
    border-color: rgba(77,166,255,.35);
}

/* Ticket top */

.ticket-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;

    margin-bottom: 18px;
}

.ticket-id {
    direction: ltr;
    text-align: left;

    font-family: monospace;
    color: #8dbfff;
    font-size: 13px;

    word-break: break-all;
}

.ticket-type {
    font-size: 18px;
    font-weight: bold;
}

/* Status */

.status {
    display: inline-block;

    padding: 7px 12px;

    border-radius: 999px;

    font-size: 13px;
    font-weight: bold;
}

.status-Pending {
    color: #ffc107;
    background: rgba(255,193,7,.12);
}

.status-Accepted {
    color: #00ff88;
    background: rgba(0,255,136,.10);
}

.status-Rejected {
    color: #ff5555;
    background: rgba(255,0,0,.10);
}

/* Info */

.ticket-info {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 10px;

    margin-bottom: 20px;
}

.info-item {

    padding: 12px;

    background: rgba(255,255,255,.05);

    border-radius: 10px;

    border: 1px solid rgba(255,255,255,.06);
}

.info-item span {
    display: block;

    color: #888;
    font-size: 12px;

    margin-bottom: 5px;
}

.info-item strong {
    color: #eee;
}

/* Exam */

.exam-box {

    margin-top: 15px;
    padding: 15px;

    background: rgba(255,255,255,.04);

    border-radius: 12px;
}

.exam-pass {
    color: #00ff88;
    font-weight: bold;
}

.exam-fail {
    color: #ff5555;
    font-weight: bold;
}

/* Reply */

.reply-area {

    margin-top: 20px;

    padding-top: 20px;

    border-top:
        1px solid rgba(255,255,255,.1);
}

.reply-area textarea {

    width: 100%;
    min-height: 110px;

    resize: vertical;

    padding: 14px;

    background: #050a11;

    color: white;

    border: 1px solid rgba(255,255,255,.15);

    border-radius: 12px;

    outline: none;

    font-family: inherit;
}

.reply-area textarea:focus {
    border-color: #168cff;
}

/* Commander profile */

.commander-box {

    margin-top: 15px;
    padding: 15px;

    background: rgba(77,166,255,.07);

    border:
        1px solid rgba(77,166,255,.15);

    border-radius: 14px;
}

.commander-box h3 {
    margin-bottom: 12px;
    color: #4da6ff;
}

.commander-grid {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0,1fr));

    gap: 10px;
}

.commander-grid input {

    width: 100%;

    padding: 12px;

    background: #050a11;

    color: white;

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 9px;

    outline: none;
}

/* Buttons */

.ticket-actions {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 15px;
}

.ticket-actions button {
    flex: 1;
    min-width: 130px;
}

.btn-danger {
    background: #9b1717 !important;
}

.btn-danger:hover {
    background: #c21d1d !important;
}

/* Chat */

.chat-box {

    margin-top: 20px;

    padding-top: 20px;

    border-top:
        1px solid rgba(255,255,255,.1);
}

.messages {

    max-height: 350px;

    overflow-y: auto;

    padding: 12px;

    background: #050a11;

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 13px;

    margin-bottom: 12px;
}

.message {

    padding: 12px;

    margin-bottom: 10px;

    border-radius: 10px;

    background: rgba(255,255,255,.05);
}

.message.command {
    border-right: 3px solid #3aa0ff;
}

.message.applicant {
    border-right: 3px solid #35d07f;
}

.message-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.message-text {
    white-space: pre-wrap;
    line-height: 1.7;
}

.message-time {
    display: block;
    margin-top: 6px;
    color: #8995a3;
    font-size: 11px;
}

/* Empty */

.empty {

    padding: 45px;

    text-align: center;

    color: #888;

    background: rgba(0,0,0,.4);

    border-radius: 18px;
}

/* Logs */

.logs-panel {

    display: none;

    margin-top: 25px;

    padding: 25px;

    background: rgba(0,0,0,.62);

    backdrop-filter: blur(18px);

    border:
        1px solid rgba(255,255,255,.15);

    border-radius: 20px;
}

.logs-panel h2 {
    color: #4da6ff;
    margin-bottom: 15px;
}

.log-item {

    padding: 15px;

    margin-bottom: 10px;

    background: rgba(255,255,255,.05);

    border-radius: 12px;

    border-right: 3px solid #4da6ff;
}

.log-item small {
    color: #888;
}

.log-action {
    font-weight: bold;
}

/* Loading */

.loading {
    padding: 30px;
    text-align: center;
    color: #aaa;
}

/* Mobile */

@media(max-width:800px) {

    .stats {
        grid-template-columns: repeat(2,1fr);
    }

    .ticket-info {
        grid-template-columns: 1fr;
    }

    .commander-grid {
        grid-template-columns: 1fr;
    }

    .admin-header {
        flex-direction: column;
        text-align: center;
    }

}

@media(max-width:500px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .admin-wrapper {
        max-width: 94%;
    }

}

</style>

</head>


<body class="command-page">

<div class="overlay"></div>


<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="LSPD"
    >

    <div class="nav-title">

        <h2>Vanguard LSPD</h2>

        <span>Command Center</span>

    </div>

    <a
        href="index.html"
        class="login-btn"
    >
        خروج
    </a>

</header>


<main class="admin-wrapper">


<!-- =========================================
     ADMIN HEADER
========================================= -->

<section class="admin-header">

    <div class="admin-header-title">

        <h1>
            👮 پنل فرماندهی
        </h1>

        <p>
            مدیریت درخواست‌ها و ارتباط با متقاضیان
        </p>

    </div>

    <div
        class="admin-user"
        id="currentCommander"
    >
        👮 فرمانده
    </div>

</section>


<!-- =========================================
     STATS
========================================= -->

<section class="stats">

    <div class="admin-stat">

        <strong id="totalTickets">
            0
        </strong>

        <span>
            کل درخواست‌ها
        </span>

    </div>


    <div class="admin-stat">

        <strong id="pendingTickets">
            0
        </strong>

        <span>
            در انتظار بررسی
        </span>

    </div>


    <div class="admin-stat">

        <strong id="acceptedTickets">
            0
        </strong>

        <span>
            تایید شده
        </span>

    </div>


    <div class="admin-stat">

        <strong id="rejectedTickets">
            0
        </strong>

        <span>
            رد شده
        </span>

    </div>

</section>


<!-- =========================================
     TOOLBAR
========================================= -->

<section class="toolbar">

    <input
        type="text"
        id="searchInput"
        placeholder="🔎 جستجو بر اساس کد، نام، Discord..."
    >

    <select id="statusFilter">

        <option value="all">
            همه وضعیت‌ها
        </option>

        <option value="Pending">
            در انتظار
        </option>

        <option value="Accepted">
            تایید شده
        </option>

        <option value="Rejected">
            رد شده
        </option>

    </select>


    <select id="typeFilter">

        <option value="all">
            همه درخواست‌ها
        </option>

        <option value="membership">
            عضویت
        </option>

        <option value="division">
            دیویژن
        </option>

        <option value="resignation">
            استعفا
        </option>

        <option value="rankup">
            Rankup
        </option>

    </select>


    <button
        class="btn primary"
        onclick="loadTickets()"
    >
        🔄 بروزرسانی
    </button>


    <button
        class="btn"
        id="logsButton"
        onclick="toggleLogs()"
        style="display:none;"
    >
        📋 لاگ‌ها
    </button>

</section>


<!-- =========================================
     TICKETS
========================================= -->

<section
    id="ticketList"
    class="ticket-list"
>

    <div class="loading">
        ⏳ در حال دریافت درخواست‌ها...
    </div>

</section>


<!-- =========================================
     LOGS
========================================= -->

<section
    id="logsPanel"
    class="logs-panel"
>

    <h2>
        📋 گزارش فعالیت‌ها
    </h2>

    <div id="logsList">

        <div class="loading">
            ⏳ در حال دریافت لاگ‌ها...
        </div>

    </div>

</section>


</main>


<script>

/* =========================================
   API
========================================= */

const API_URL =
    "https://lspd-site-11.onrender.com";


/* =========================================
   STATE
========================================= */

let allTickets = [];

let currentRole =
    localStorage.getItem("lspdRole") || "command";

let commanderName =
    localStorage.getItem("lspdCommanderName") ||
    localStorage.getItem("lspdAdminName") ||
    "فرماندهی";

let commanderRank =
    localStorage.getItem("lspdCommanderRank") ||
    "Command";


/* =========================================
   AUTH
========================================= */

if (
    localStorage.getItem("lspdAdmin") !== "true"
) {

    window.location.href =
        "login.html";

}


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function valueOrDash(value) {

    if (
        value === undefined ||
        value === null ||
        String(value).trim() === ""
    ) {

        return "—";

    }

    return escapeHTML(value);

}


function getRequestType(type) {

    switch(type) {

        case "membership":
            return "🚔 درخواست عضویت";

        case "division":
            return "🎖️ درخواست دیویژن";

        case "resignation":
            return "📤 درخواست استعفا";

        case "rankup":
            return "⬆️ درخواست Rankup";

        default:
            return "📄 درخواست";

    }

}


function statusText(status) {

    switch(status) {

        case "Accepted":
            return "🟢 تایید شده";

        case "Rejected":
            return "🔴 رد شده";

        default:
            return "🟡 در انتظار";

    }

}


/* =========================================
   COMMANDER PROFILE
========================================= */

document.getElementById(
    "currentCommander"
).innerHTML = `

    👮 ${escapeHTML(commanderName)}

    <br>

    <small style="color:#aaa;">
        ${escapeHTML(commanderRank)}
    </small>

`;


/* =========================================
   LOAD TICKETS
========================================= */

async function loadTickets() {

    const list =
        document.getElementById(
            "ticketList"
        );

    list.innerHTML = `

        <div class="loading">
            ⏳ در حال دریافت تیکت‌ها...
        </div>

    `;

    try {

        const response =
            await fetch(
                API_URL + "/tickets",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "خطا در دریافت تیکت‌ها"
            );

        }

        allTickets =
            await response.json();

        updateStats();

        renderTickets();

    } catch(error) {

        console.error(error);

        list.innerHTML = `

            <div class="empty">

                ❌ دریافت تیکت‌ها انجام نشد.

                <br><br>

                <button
                    class="btn primary"
                    onclick="loadTickets()"
                >
                    🔄 تلاش مجدد
                </button>

            </div>

        `;

    }

}


/* =========================================
   STATS
========================================= */

function updateStats() {

    document.getElementById(
        "totalTickets"
    ).innerText =
        allTickets.length;


    document.getElementById(
        "pendingTickets"
    ).innerText =
        allTickets.filter(
            x => x.status === "Pending"
        ).length;


    document.getElementById(
        "acceptedTickets"
    ).innerText =
        allTickets.filter(
            x => x.status === "Accepted"
        ).length;


    document.getElementById(
        "rejectedTickets"
    ).innerText =
        allTickets.filter(
            x => x.status === "Rejected"
        ).length;

}


/* =========================================
   FILTER
========================================= */

function renderTickets() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const type =
        document.getElementById(
            "typeFilter"
        ).value;


    const filtered =
        allTickets.filter(ticket => {

            const text =
                JSON.stringify(ticket)
                    .toLowerCase();


            const searchOK =
                !search ||
                text.includes(search);


            const statusOK =
                status === "all" ||
                ticket.status === status;


            const typeOK =
                type === "all" ||
                ticket.requestType === type;


            return (
                searchOK &&
                statusOK &&
                typeOK
            );

        });


    const list =
        document.getElementById(
            "ticketList"
        );


    if (!filtered.length) {

        list.innerHTML = `

            <div class="empty">

                📭 هیچ تیکتی پیدا نشد.

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered
            .map(ticket =>
                createTicketHTML(ticket)
            )
            .join("");

}


/* =========================================
   CREATE TICKET HTML
========================================= */

function createTicketHTML(ticket) {

    const score =
        ticket.score !== null &&
        ticket.score !== undefined
        ? Number(ticket.score)
        : null;


    const passed =
        score !== null &&
        score >= 12;


    const messages =
        Array.isArray(ticket.messages)
        ? ticket.messages
        : [];


    return `

    <article
        class="ticket-card"
        data-id="${escapeHTML(ticket._id)}"
    >

        <div class="ticket-top">

            <div>

                <div class="ticket-type">

                    ${getRequestType(
                        ticket.requestType
                    )}

                </div>

                <div class="ticket-id">

                    ${escapeHTML(ticket._id)}

                </div>

            </div>


            <span
                class="
                    status
                    status-${escapeHTML(
                        ticket.status || "Pending"
                    )}
                "
            >

                ${statusText(
                    ticket.status
                )}

            </span>

        </div>


        <div class="ticket-info">

            <div class="info-item">

                <span>
                    IC Name
                </span>

                <strong>
                    ${valueOrDash(
                        ticket.icName ||
                        ticket.name
                    )}
                </strong>

            </div>


            <div class="info-item">

                <span>
                    OC Name
                </span>

                <strong>
                    ${valueOrDash(
                        ticket.ocName ||
                        ticket.oocName
                    )}
                </strong>

            </div>


            <div class="info-item">

                <span>
                    Discord
                </span>

                <strong>
                    ${valueOrDash(
                        ticket.discord ||
                        ticket.discordId
                    )}
                </strong>

            </div>


            <div class="info-item">

                <span>
                    Steam Hex
                </span>

                <strong>
                    ${valueOrDash(
                        ticket.steamHex
                    )}
                </strong>

            </div>


            <div class="info-item">

                <span>
                    CMX
                </span>

                <strong>
                    ${valueOrDash(
                        ticket.cmx
                    )}
                </strong>

            </div>


            <div class="info-item">

                <span>
                    سن
                </span>

                <strong>
                    ${valueOrDash(
                        ticket.age
                    )}
                </strong>

            </div>

        </div>


        ${
            score !== null
            ?

            `

            <div class="exam-box">

                📚 نمره آزمون:

                <strong>
                    ${score} از 20
                </strong>

                <br><br>

                <span
                    class="${
                        passed
                        ? "exam-pass"
                        : "exam-fail"
                    }"
                >

                    ${
                        passed
                        ? "✅ قبول شده"
                        : "❌ رد شده"
                    }

                </span>

            </div>

            `

            : ""

        }


        <div
            style="
                margin-top:15px;
                color:#bbb;
                line-height:1.9;
            "
        >

            ${
                ticket.experience
                ?

                `
                <b>سابقه:</b>
                ${valueOrDash(
                    ticket.experience
                )}
                <br>
                `

                : ""
            }


            ${
                ticket.reason
                ?

                `
                <b>دلیل درخواست:</b>
                ${valueOrDash(
                    ticket.reason
                )}
                `

                : ""
            }

        </div>


        <!-- COMMANDER PROFILE -->

        <div class="commander-box">

            <h3>
                👮 اطلاعات فرمانده پاسخ‌دهنده
            </h3>


            <div class="commander-grid">

                <input
                    type="text"
                    id="commanderName-${escapeHTML(
                        ticket._id
                    )}"
                    value="${escapeHTML(
                        commanderName
                    )}"
                    placeholder="نام فرمانده"
                >


                <input
                    type="text"
                    id="commanderRank-${escapeHTML(
                        ticket._id
                    )}"
                    value="${escapeHTML(
                        commanderRank
                    )}"
                    placeholder="Rank"
                >


                <input
                    type="text"
                    id="commanderCallsign-${escapeHTML(
                        ticket._id
                    )}"
                    placeholder="Callsign"
                >

            </div>

        </div>


        <!-- REPLY -->

        <div class="reply-area">

            <label>
                📝 پاسخ فرماندهی
            </label>


            <textarea
                id="reply-${escapeHTML(
                    ticket._id
                )}"
                placeholder="پاسخ خود را بنویسید..."
            >${escapeHTML(
                ticket.reply || ""
            )}</textarea>


            <div class="ticket-actions">

                <button
                    class="btn primary"
                    onclick="updateTicket(
                        '${escapeHTML(ticket._id)}',
                        'Accepted'
                    )"
                >
                    ✅ تایید و ارسال
                </button>


                <button
                    class="btn"
                    onclick="updateTicket(
                        '${escapeHTML(ticket._id)}',
                        'Rejected'
                    )"
                >
                    ❌ رد و ارسال
                </button>


                <button
                    class="btn"
                    onclick="updateTicket(
                        '${escapeHTML(ticket._id)}',
                        'Pending'
                    )"
                >
                    🟡 ذخیره
                </button>


                ${
                    currentRole === "owner"
                    ?

                    `
                    <button
                        class="btn btn-danger"
                        onclick="deleteTicket(
                            '${escapeHTML(ticket._id)}'
                        )"
                    >
                        🗑️ حذف تیکت
                    </button>
                    `

                    : ""

                }

            </div>

        </div>


        <!-- CHAT -->

        <div class="chat-box">

            <h3>
                💬 پیام‌های تیکت
            </h3>


            <div
                class="messages"
                id="messages-${escapeHTML(
                    ticket._id
                )}"
            >

                ${
                    messages.length
                    ?

                    messages.map(
                        message => {

                            const command =
                                message.sender ===
                                "command";


                            return `

                                <div
                                    class="
                                        message
                                        ${
                                            command
                                            ? "command"
                                            : "applicant"
                                        }
                                    "
                                >

                                    <div
                                        class="message-name"
                                    >

                                        ${
                                            command
                                            ? "👮 فرماندهی"
                                            : "👤 متقاضی"
                                        }

                                    </div>


                                    <div
                                        class="message-text"
                                    >

                                        ${escapeHTML(
                                            message.message
                                        )}

                                    </div>


                                    <small
                                        class="message-time"
                                    >

                                        ${
                                            message.createdAt
                                            ?

                                            new Date(
                                                message.createdAt
                                            ).toLocaleString(
                                                "fa-IR"
                                            )

                                            : ""
                                        }

                                    </small>

                                </div>

                            `;

                        }
                    ).join("")

                    :

                    `
                    <div
                        style="
                            color:#777;
                            text-align:center;
                            padding:20px;
                        "
                    >
                        هنوز پیامی وجود ندارد.
                    </div>
                    `

                }

            </div>


            <div
                style="
                    display:flex;
                    gap:10px;
                "
            >

                <input
                    type="text"
                    id="message-${escapeHTML(
                        ticket._id
                    )}"
                    placeholder="پیام برای متقاضی..."
                    style="
                        flex:1;
                        padding:13px;
                        background:#050a11;
                        color:white;
                        border:1px solid #ffffff18;
                        border-radius:10px;
                        outline:none;
                    "
                >


                <button
                    class="btn primary"
                    onclick="sendCommandMessage(
                        '${escapeHTML(ticket._id)}'
                    )"
                >
                    📨 ارسال
                </button>

            </div>

        </div>


        <div
            style="
                margin-top:15px;
                color:#777;
                font-size:12px;
            "
        >

            ثبت:

            ${
                ticket.createdAt
                ?

                new Date(
                    ticket.createdAt
                ).toLocaleString(
                    "fa-IR"
                )

                : "—"
            }

        </div>

    </article>

    `;

}


/* =========================================
   UPDATE TICKET
========================================= */

async function updateTicket(
    id,
    status
) {

    const replyElement =
        document.getElementById(
            "reply-" + id
        );


    const nameElement =
        document.getElementById(
            "commanderName-" + id
        );


    const rankElement =
        document.getElementById(
            "commanderRank-" + id
        );


    const callsignElement =
        document.getElementById(
            "commanderCallsign-" + id
        );


    const reply =
        replyElement
        ? replyElement.value.trim()
        : "";


    const commander =
        nameElement
        ? nameElement.value.trim()
        : commanderName;


    const rank =
        rankElement
        ? rankElement.value.trim()
        : commanderRank;


    const callsign =
        callsignElement
        ? callsignElement.value.trim()
        : "";


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id),

                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        status,

                        reply,

                        commanderName:
                            commander,

                        commanderRank:
                            rank,

                        commanderCallsign:
                            callsign

                    })

                }

            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Update failed"
            );

        }


        alert(
            "✅ اطلاعات تیکت با موفقیت ثبت شد."
        );


        await loadTickets();


    } catch(error) {

        console.error(error);

        alert(
            "❌ ثبت پاسخ انجام نشد."
        );

    }

}


/* =========================================
   SEND COMMAND MESSAGE
========================================= */

async function sendCommandMessage(id) {

    const input =
        document.getElementById(
            "message-" + id
        );


    if (!input) {
        return;
    }


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id) +
                "/messages",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        message,

                        sender:
                            "command",

                        commanderName,

                        commanderRank

                    })

                }

            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Message error"
            );

        }


        input.value = "";


        await loadTickets();


    } catch(error) {

        console.error(error);

        alert(
            "❌ ارسال پیام انجام نشد."
        );

    }

}


/* =========================================
   DELETE
========================================= */

async function deleteTicket(id) {

    if (currentRole !== "owner") {

        alert(
            "⛔ شما اجازه حذف تیکت را ندارید."
        );

        return;

    }


    const confirmDelete =
        confirm(
            "⚠️ آیا مطمئن هستید که می‌خواهید این تیکت را حذف کنید؟"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id),

                {

                    method: "DELETE"

                }

            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Delete error"
            );

        }


        alert(
            "🗑️ تیکت حذف شد."
        );


        await loadTickets();


    } catch(error) {

        console.error(error);

        alert(
            "❌ حذف تیکت انجام نشد."
        );

    }

}


/* =========================================
   LOGS
========================================= */

function toggleLogs() {

    const panel =
        document.getElementById(
            "logsPanel"
        );


    if (
        panel.style.display ===
        "block"
    ) {

        panel.style.display =
            "none";

        return;

    }


    panel.style.display =
        "block";


    loadLogs();

}


async function loadLogs() {

    const box =
        document.getElementById(
            "logsList"
        );


    box.innerHTML = `

        <div class="loading">
            ⏳ در حال دریافت لاگ‌ها...
        </div>

    `;


    try {

        const response =
            await fetch(
                API_URL + "/logs",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Logs unavailable"
            );

        }


        const logs =
            await response.json();


        if (
            !Array.isArray(logs) ||
            !logs.length
        ) {

            box.innerHTML = `

                <div class="empty">

                    📋 هنوز لاگی ثبت نشده است.

                </div>

            `;

            return;

        }


        box.innerHTML =
            logs.map(log => `

                <div class="log-item">

                    <div
                        class="log-action"
                    >

                        ${escapeHTML(
                            log.action ||
                            "فعالیت"
                        )}

                    </div>


                    <div>

                        👮 فرمانده:

                        <strong>
                            ${escapeHTML(
                                log.commanderName ||
                                "—"
                            )}
                        </strong>

                        |

                        Rank:

                        <strong>
                            ${escapeHTML(
                                log.commanderRank ||
                                "—"
                            )}
                        </strong>

                    </div>


                    <div>

                        🎫 Ticket:

                        <span
                            style="
                                direction:ltr;
                                display:inline-block;
                            "
                        >
                            ${escapeHTML(
                                log.ticketId ||
                                "—"
                            )}
                        </span>

                    </div>


                    <small>

                        ${
                            log.createdAt
                            ?

                            new Date(
                                log.createdAt
                            ).toLocaleString(
                                "fa-IR"
                            )

                            : ""
                        }

                    </small>

                </div>

            `).join("");


    } catch(error) {

        console.error(error);

        box.innerHTML = `

            <div class="empty">

                ❌ Endpoint لاگ‌ها در server.js
                موجود نیست یا خطا دارد.

            </div>

        `;

    }

}

/* =========================================
   AUTO REFRESH
========================================= */

/*
    هر 2 ثانیه تیکت‌ها را بررسی می‌کنیم.
    اگر متقاضی پیام جدید بفرستد،
    فرمانده بدون Refresh آن را می‌بیند.
*/

let lastTicketState = "";


async function silentRefresh() {

    try {

        const response =
            await fetch(
                API_URL + "/tickets",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const tickets =
            await response.json();


        const state =
            JSON.stringify(
                tickets.map(ticket => ({
                    id: ticket._id,
                    updatedAt:
                        ticket.updatedAt,
                    messages:
                        ticket.messages?.length || 0,
                    status:
                        ticket.status,
                    reply:
                        ticket.reply
                }))
            );


        if (
            state !==
            lastTicketState
        ) {

            lastTicketState =
                state;

            allTickets =
                tickets;

            updateStats();

            renderTickets();

        }

    } catch(error) {

        console.error(
            "Silent Refresh:",
            error
        );

    }

}


/* =========================================
   INITIAL
========================================= */

loadTickets();


/*
    شروع Auto Refresh
*/

setTimeout(
    silentRefresh,
    2000
);


setInterval(
    silentRefresh,
    2000
);

) {

}
