<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Vanguard LSPD | Member Profile
</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>


<body>

<div class="overlay"></div>


<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="LSPD Badge"
    >


    <div class="nav-title">

        <h2>
            Vanguard LSPD
        </h2>

        <span>
            Member Profile
        </span>

    </div>


    <a
        href="index.html"
        class="login-btn"
    >
        بازگشت
    </a>

</header>



<main class="hero">


<div class="profile-card">


    <img
        src="badge.png"
        class="profile-badge"
        alt="LSPD Badge"
    >


    <h1 id="memberName">
        نام عضو
    </h1>


    <div class="rank-box">

        <h3>
            Rank
        </h3>

        <p id="memberRank">
            Officer
        </p>

    </div>



    <div class="info-box">


        <p>
            🎖 واحد:
            <span id="department">
                LSPD Patrol
            </span>
        </p>


        <p>
            📅 تاریخ عضویت:
            <span id="joinDate">
                —
            </span>
        </p>


        <p>
            ⭐ سطح دسترسی:
            <span id="access">
                Officer
            </span>
        </p>


        <p>
            📊 وضعیت:
            <span id="memberStatus">
                فعال
            </span>
        </p>


    </div>


</div>


</main>



<script>


// ===================================
// MEMBER DATA
// ===================================

const member = {

    name: "Javad Amiri",

    rank: "Captain",

    department: "LSPD Command",

    joinDate: "01/08/2026",

    access: "Captain",

    status: "فعال"

};


// ===================================
// DISPLAY
// ===================================

document
.getElementById("memberName")
.innerText =
    member.name;


document
.getElementById("memberRank")
.innerText =
    member.rank;


document
.getElementById("department")
.innerText =
    member.department;


document
.getElementById("joinDate")
.innerText =
    member.joinDate;


document
.getElementById("access")
.innerText =
    member.access;


document
.getElementById("memberStatus")
.innerText =
    member.status;

</script>


</body>
</html>
