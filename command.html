<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">

<style>
* {
    box-sizing: border-box;
}

body.command-page {
    min-height: 100vh;
}

.command-wrapper {
    width: 1200px;
    max-width: 95%;
    margin: 35px auto;
}

.command-header {
    background: rgba(5, 10, 18, .78);
    border: 1px solid rgba(77,166,255,.25);
    border-radius: 22px;
    padding: 25px;
    backdrop-filter: blur(18px);
    box-shadow: 0 15px 50px rgba(0,0,0,.35);
    margin-bottom: 25px;
}

.command-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.command-user {
    display: flex;
    align-items: center;
    gap: 15px;
}

.command-user img {
    width: 65px;
    height: 65px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px #168cff);
}

.command-user h1 {
    color: #4da6ff;
    margin-bottom: 5px;
}

.command-user p {
    color: #aaa;
    margin: 0;
}

.rank-badge {
    display: inline-block;
    margin-top: 7px;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(0,110,255,.18);
    border: 1px solid rgba(77,166,255,.3);
    color: #6db6ff;
    font-size: 13px;
}

.logout-btn {
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.07);
    color: white;
    padding: 11px 18px;
    border-radius: 10px;
    cursor: pointer;
}

.logout-btn:hover {
    background: rgba(255,255,255,.14);
}

.command-grid {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
}

.panel {
    background: rgba(5, 10, 18, .78);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    padding: 22px;
    backdrop-filter: blur(18px);
}

.panel h2 {
    color: #4da6ff;
    margin-bottom: 18px;
}

.ticket-list {
    max-height: 650px;
    overflow-y: auto;
}

.ticket-item {
    padding: 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);
    margin-bottom: 12px;
    cursor: pointer;
    transition: .2s;
}

.ticket-item:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.09);
}

.ticket-item.active {
    border-color: #168cff;
    box-shadow: 0 0 15px rgba(22,140,255,.18);
}

.ticket-item h3 {
    margin-bottom: 8px;
}

.ticket-item small {
    color: #8995a3;
}

.status {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 15px;
    font-size: 12px;
    margin-top: 8px;
}

.status.pending {
    color: #ffbd45;
    background: rgba(255,180,0,.12);
}

.status.accepted {
    color: #00ff88;
    background: rgba(0,255,136,.1);
}

.status.rejected {
    color: #ff5555;
    background: rgba(255,0,0,.1);
}

.ticket-detail {
    min-height: 500px;
}

.empty {
    color: #777;
    text-align: center;
    padding: 70px 20px;
}

.detail-row {
    padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
}

.detail-row b {
    color: #aaa;
}

.reply-box {
    margin-top: 20px;
}

.reply-box textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    padding: 14px;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    outline: none;
    font-family: inherit;
}

.reply-box textarea:focus {
    border-color: #168cff;
    box-shadow: 0 0 10px rgba(22,140,255,.2);
}

.status-select {
    width: 100%;
    margin-bottom: 10px;
    padding: 13px;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
}

.chat-box {
    margin-top: 25px;
    border-top: 1px solid rgba(255,255,255,.1);
    padding-top: 20px;
}

.messages {
    max-height: 320px;
    overflow-y: auto;
    padding: 10px;
    background: #050a11;
    border-radius: 12px;
    margin-bottom: 10px;
}

.message {
    padding: 11px;
    margin-bottom: 9px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
}

.message.command {
    border-right: 3px solid #3aa0ff;
}

.message.applicant {
    border-right: 3px solid #35d07f;
}

.message-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.message-time {
    display: block;
    margin-top: 5px;
    color: #777;
    font-size: 11px;
}

.chat-input {
    width: 100%;
    min-height: 90px;
    padding: 12px;
    resize: vertical;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    outline: none;
}

.refresh-info {
    color: #777;
    font-size: 12px;
    text-align: center;
    margin-top: 10px;
}

.error-box {
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    background: rgba(255,0,0,.08);
    border: 1px solid rgba(255,0,0,.2);
    color: #ff7777;
    text-align: center;
}

@media(max-width:850px) {

    .command-grid {
        grid-template-columns: 1fr;
    }

    .command-header-inner {
        flex-direction: column;
        align-items: flex-start;
    }

}
</style>

</head>

<body class="command-page">

<div class="overlay"></div>

<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="LSPD"
    >

    <div class="nav-title">

        <h2>Vanguard LSPD</h2>

        <span>Command Center</span>

    </div>

    <a
        href="index.html"
        class="login-btn"
    >
        بازگشت
    </a>

</header>


<main>

<div class="command-wrapper">

<div class="command-header">

    <div class="command-header-inner">

        <div class="command-user">

            <img
                src="badge.png"
                alt="LSPD"
            >

            <div>

                <h1>
                    👮 پنل فرماندهی
                </h1>

                <p id="commanderName">
                    در حال دریافت اطلاعات فرمانده...
                </p>

                <span
                    id="commanderRank"
                    class="rank-badge"
                >
                    —
                </span>

            </div>

        </div>

        <button
            class="logout-btn"
            onclick="logoutCommand()"
        >
            خروج
        </button>

    </div>

</div>


<div
    id="globalError"
    style="display:none;"
></div>


<div class="command-grid">


<section class="panel">

    <h2>
        📂 درخواست‌ها
    </h2>

    <div
        id="ticketList"
        class="ticket-list"
    >

        <div class="empty">
            ⏳ در حال دریافت تیکت‌ها...
        </div>

    </div>

    <div class="refresh-info">
        بروزرسانی خودکار فعال است
    </div>

</section>


<section class="panel ticket-detail">

    <div id="ticketDetail">

        <div class="empty">

            <h2>
                📄 یک تیکت را انتخاب کنید
            </h2>

            <p>
                برای مشاهده جزئیات، یکی از درخواست‌ها را انتخاب کنید.
            </p>

        </div>

    </div>

</section>


</div>

</div>

</main>


<script>

/* ============================================================
   API
============================================================ */

const API_URL =
    "https://lspd-site-11.onrender.com";


/* ============================================================
   STATE
============================================================ */

let tickets = [];

let selectedTicketId = null;


/* ============================================================
   TOKEN
============================================================ */

function getToken() {

    return (
        localStorage.getItem(
            "lspdCommandToken"
        ) || ""
    ).trim();

}


function authHeaders(extra = {}) {

    const token =
        getToken();


    return {

        ...extra,

        "Authorization":
            "Bearer " + token

    };

}


/* ============================================================
   CHECK LOGIN
============================================================ */

async function checkAuthentication() {

    const token =
        getToken();


    if (!token) {

        window.location.href =
            "command-login.html";

        return false;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/auth/me",

                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    },

                    cache: "no-store"

                }

            );


        if (
            response.status === 401
        ) {

            logoutCommand();

            return false;

        }


        if (!response.ok) {

            throw new Error(
                "Authentication failed"
            );

        }


        const data =
            await response.json();


        if (
            !data.success ||
            !data.user
        ) {

            logoutCommand();

            return false;

        }


        saveCommander(
            data.user
        );


        displayCommander(
            data.user
        );


        return true;


    } catch (error) {

        console.error(
            "AUTH CHECK ERROR:",
            error
        );


        showGlobalError(
            "ارتباط با سرور برای احراز هویت ناموفق بود."
        );


        return false;

    }

}


/* ============================================================
   SAVE COMMANDER
============================================================ */

function saveCommander(user) {

    if (!user) {

        return;

    }


    localStorage.setItem(

        "lspdCommander",

        JSON.stringify({

            username:
                user.username || "",

            name:
                user.name || "",

            rank:
                user.rank || "",

            role:
                user.role || "command",

            isOwner:
                user.isOwner === true

        })

    );


    localStorage.setItem(

        "lspdAdminUser",

        user.username || ""

    );


    localStorage.setItem(

        "lspdAdminName",

        user.name || ""

    );


    localStorage.setItem(

        "lspdAdminRank",

        user.rank || ""

    );


    localStorage.setItem(
        "lspdAdmin",
        "true"
    );


    if (
        user.role === "owner" ||
        user.isOwner === true
    ) {

        localStorage.setItem(
            "lspdIsOwner",
            "true"
        );

    }

}


/* ============================================================
   DISPLAY COMMANDER
============================================================ */

function displayCommander(user) {

    const nameElement =
        document.getElementById(
            "commanderName"
        );


    const rankElement =
        document.getElementById(
            "commanderRank"
        );


    if (nameElement) {

        nameElement.innerText =
            user.name ||
            user.username ||
            "فرمانده LSPD";

    }


    if (rankElement) {

        rankElement.innerText =
            user.rank ||
            "Command";

    }

}


/* ============================================================
   GLOBAL ERROR
============================================================ */

function showGlobalError(message) {

    const box =
        document.getElementById(
            "globalError"
        );


    if (!box) {

        return;

    }


    box.className =
        "error-box";


    box.innerText =
        message;


    box.style.display =
        "block";

}


function hideGlobalError() {

    const box =
        document.getElementById(
            "globalError"
        );


    if (!box) {

        return;

    }


    box.style.display =
        "none";

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ============================================================
   REQUEST TYPE
============================================================ */

function requestType(type) {

    const types = {

        membership:
            "🚔 عضویت LSPD",

        division:
            "🎖️ دیویژن",

        resignation:
            "📤 استعفا",

        rankup:
            "⬆️ Rankup",

        exam:
            "📚 آزمون"

    };


    return (
        types[type] ||
        "📄 درخواست"
    );

}


/* ============================================================
   STATUS
============================================================ */

function statusHTML(status) {

    if (
        status === "Accepted"
    ) {

        return `

            <span class="status accepted">
                🟢 تایید شده
            </span>

        `;

    }


    if (
        status === "Rejected"
    ) {

        return `

            <span class="status rejected">
                🔴 رد شده
            </span>

        `;

    }


    return `

        <span class="status pending">
            🟡 در انتظار بررسی
        </span>

    `;

}


/* ============================================================
   LOAD TICKETS
   مهم:
   Authorization header اضافه شده
============================================================ */

async function loadTickets() {

    const token =
        getToken();


    if (!token) {

        window.location.href =
            "command-login.html";

        return;

    }


    try {

        hideGlobalError();


        const response =
            await fetch(

                API_URL +
                "/tickets",

                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token

                    },

                    cache: "no-store"

                }

            );


        /*
        Token invalid
        */

        if (
            response.status === 401
        ) {

            localStorage.removeItem(
                "lspdCommandToken"
            );

            localStorage.removeItem(
                "lspdCommander"
            );

            window.location.href =
                "command-login.html";

            return;

        }


        let data = null;


        try {

            data =
                await response.json();

        } catch {

            data = null;

        }


        if (!response.ok) {

            throw new Error(

                data?.message ||
                `HTTP ${response.status}`

            );

        }


        tickets =
            Array.isArray(data)
            ? data
            : [];


        renderTickets();


        if (selectedTicketId) {

            const selected =
                tickets.find(

                    ticket =>
                        String(
                            ticket._id
                        ) ===
                        String(
                            selectedTicketId
                        )

                );


            if (selected) {

                renderTicketDetail(
                    selected
                );

            }

        }


    } catch (error) {

        console.error(
            "LOAD TICKETS ERROR:",
            error
        );


        document
            .getElementById(
                "ticketList"
            )
            .innerHTML = `

                <div class="empty">

                    ❌ دریافت درخواست‌ها ناموفق بود.

                    <br><br>

                    <small>
                        ${escapeHTML(
                            error.message
                        )}
                    </small>

                </div>

            `;

    }

}


/* ============================================================
   RENDER TICKETS
============================================================ */

function renderTickets() {

    const box =
        document.getElementById(
            "ticketList"
        );


    if (!tickets.length) {

        box.innerHTML = `

            <div class="empty">

                📭 هیچ تیکتی وجود ندارد.

            </div>

        `;

        return;

    }


    box.innerHTML =

        tickets

            .map(ticket => {

                const id =
                    String(
                        ticket._id
                    );


                const name =
                    ticket.icName ||
                    ticket.name ||
                    ticket.ocName ||
                    "بدون نام";


                const active =

                    String(
                        selectedTicketId
                    ) === id

                    ? "active"

                    : "";


                return `

                    <div
                        class="ticket-item ${active}"
                        onclick="selectTicket('${escapeHTML(id)}')"
                    >

                        <h3>
                            ${escapeHTML(name)}
                        </h3>

                        <small>
                            ${requestType(
                                ticket.requestType
                            )}
                        </small>

                        <br>

                        ${statusHTML(
                            ticket.status
                        )}

                        <br>

                        <small>

                            ${
                                ticket.createdAt

                                ?

                                new Date(
                                    ticket.createdAt
                                ).toLocaleString(
                                    "fa-IR"
                                )

                                :

                                ""

                            }

                        </small>

                    </div>

                `;

            })

            .join("");

}


/* ============================================================
   SELECT TICKET
============================================================ */

async function selectTicket(id) {

    selectedTicketId =
        String(id);


    const ticket =
        tickets.find(

            t =>
                String(t._id) ===
                String(id)

        );


    if (!ticket) {

        return;

    }


    renderTickets();

    renderTicketDetail(
        ticket
    );


    await loadMessages(
        id
    );

}


/* ============================================================
   DETAIL
============================================================ */

function renderTicketDetail(ticket) {

    const box =
        document.getElementById(
            "ticketDetail"
        );


    box.innerHTML = `

        <h2>
            📄 جزئیات درخواست
        </h2>


        <div class="detail-row">

            <b>کد پیگیری:</b>

            <br>

            ${escapeHTML(
                ticket._id
            )}

        </div>


        <div class="detail-row">

            <b>نوع درخواست:</b>

            <br>

            ${requestType(
                ticket.requestType
            )}

        </div>


        <div class="detail-row">

            <b>IC Name:</b>

            <br>

            ${escapeHTML(
                ticket.icName ||
                ticket.name ||
                "—"
            )}

        </div>


        <div class="detail-row">

            <b>OC Name:</b>

            <br>

            ${escapeHTML(
                ticket.ocName ||
                "—"
            )}

        </div>


        <div class="detail-row">

            <b>Discord:</b>

            <br>

            ${escapeHTML(
                ticket.discord ||
                ticket.discordId ||
                "—"
            )}

        </div>


        <div class="detail-row">

            <b>Steam Hex:</b>

            <br>

            ${escapeHTML(
                ticket.steamHex ||
                "—"
            )}

        </div>


        <div class="detail-row">

            <b>سن:</b>

            <br>

            ${escapeHTML(
                ticket.age ||
                "—"
            )}

        </div>


        <div class="detail-row">

            <b>وضعیت فعلی:</b>

            <br>

            ${statusHTML(
                ticket.status
            )}

        </div>


        ${
            ticket.score !== null &&
            ticket.score !== undefined

            ?

            `

            <div class="detail-row">

                <b>
                    📚 نمره آزمون:
                </b>

                <br>

                ${escapeHTML(
                    ticket.score
                )}

                از 20

            </div>

            `

            :

            ""

        }


        ${
            ticket.experience

            ?

            `

            <div class="detail-row">

                <b>
                    تجربه:
                </b>

                <br>

                ${escapeHTML(
                    ticket.experience
                )}

            </div>

            `

            :

            ""

        }


        ${
            ticket.reason

            ?

            `

            <div class="detail-row">

                <b>
                    دلیل درخواست:
                </b>

                <br>

                ${escapeHTML(
                    ticket.reason
                )}

            </div>

            `

            :

            ""

        }


        <div class="reply-box">

            <h2>
                ✍️ پاسخ فرماندهی
            </h2>


            <select
                id="statusSelect"
                class="status-select"
            >

                <option
                    value="Pending"
                    ${
                        ticket.status ===
                        "Pending"
                        ? "selected"
                        : ""
                    }
                >
                    🟡 در انتظار بررسی
                </option>


                <option
                    value="Accepted"
                    ${
                        ticket.status ===
                        "Accepted"
                        ? "selected"
                        : ""
                    }
                >
                    🟢 تایید شده
                </option>


                <option
                    value="Rejected"
                    ${
                        ticket.status ===
                        "Rejected"
                        ? "selected"
                        : ""
                    }
                >
                    🔴 رد شده
                </option>

            </select>


            <textarea
                id="replyInput"
                placeholder="پاسخ خود را برای متقاضی بنویسید..."
            >${
                ticket.reply ===
                "در انتظار پاسخ فرماندهی"

                ?

                ""

                :

                escapeHTML(
                    ticket.reply ||
                    ""
                )

            }</textarea>


            <button
                class="btn primary"
                style="width:100%;margin-top:10px;"
                onclick="updateTicket()"
            >
                💾 ثبت پاسخ
            </button>

        </div>


        <div class="chat-box">

            <h2>
                💬 گفتگوی مستقیم
            </h2>


            <div
                id="messages"
                class="messages"
            >

                <div class="empty">
                    ⏳ در حال دریافت پیام‌ها...
                </div>

            </div>


            <textarea
                id="chatInput"
                class="chat-input"
                placeholder="پیام خود را برای متقاضی بنویسید..."
            ></textarea>


            <button
                class="btn primary"
                style="width:100%;margin-top:8px;"
                onclick="sendCommandMessage()"
            >
                📨 ارسال پیام
            </button>

        </div>

    `;

}


/* ============================================================
   UPDATE TICKET
   Authorization اضافه شده
============================================================ */

async function updateTicket() {

    if (!selectedTicketId) {

        return;

    }


    const token =
        getToken();


    if (!token) {

        window.location.href =
            "command-login.html";

        return;

    }


    const statusElement =
        document.getElementById(
            "statusSelect"
        );


    const replyElement =
        document.getElementById(
            "replyInput"
        );


    const status =
        statusElement
        ? statusElement.value
        : "Pending";


    const reply =
        replyElement
        ? replyElement.value.trim()
        : "";


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ),

                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token

                    },

                    body:

                        JSON.stringify({

                            status,

                            reply

                        })

                }

            );


        if (
            response.status === 401
        ) {

            logoutCommand();

            return;

        }


        let data = null;


        try {

            data =
                await response.json();

        } catch {

            data = null;

        }


        if (
            !response.ok ||
            !data?.success
        ) {

            throw new Error(

                data?.message ||
                `HTTP ${response.status}`

            );

        }


        alert(
            "✅ پاسخ با موفقیت ثبت شد."
        );


        await loadTickets();


    } catch (error) {

        console.error(
            "UPDATE TICKET ERROR:",
            error
        );


        alert(

            "❌ ثبت پاسخ انجام نشد.\n\n" +
            error.message

        );

    }

}


/* ============================================================
   LOAD MESSAGES
============================================================ */

async function loadMessages(id) {

    const box =
        document.getElementById(
            "messages"
        );


    if (!box) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id) +
                "/messages",

                {

                    method: "GET",

                    cache: "no-store"

                }

            );


        if (
            response.status === 404
        ) {

            box.innerHTML = `

                <div class="empty">
                    ❌ تیکت پیدا نشد.
                </div>

            `;

            return;

        }


        let messages = [];


        try {

            messages =
                await response.json();

        } catch {

            messages = [];

        }


        if (
            !Array.isArray(messages) ||
            messages.length === 0
        ) {

            box.innerHTML = `

                <div class="empty">
                    هنوز پیامی ثبت نشده است.
                </div>

            `;

            return;

        }


        box.innerHTML =

            messages

                .map(message => {

                    const isCommand =
                        message.sender ===
                        "command";


                    const senderName =

                        isCommand

                        ?

                        (
                            message.senderName ||
                            message.commanderName ||
                            "فرماندهی"
                        )

                        :

                        (
                            message.senderName ||
                            "👤 متقاضی"
                        );


                    const rank =

                        isCommand &&
                        (
                            message.senderRank ||
                            message.commanderRank
                        )

                        ?

                        ` - ${escapeHTML(
                            message.senderRank ||
                            message.commanderRank
                        )}`

                        :

                        "";


                    return `

                        <div
                            class="
                                message
                                ${
                                    isCommand
                                    ? "command"
                                    : "applicant"
                                }
                            "
                        >

                            <div
                                class="message-name"
                            >

                                ${
                                    isCommand
                                    ? "👮 "
                                    : ""
                                }

                                ${escapeHTML(
                                    senderName
                                )}

                                ${rank}

                            </div>


                            <div>

                                ${escapeHTML(
                                    message.message
                                )}

                            </div>


                            <small
                                class="message-time"
                            >

                                ${
                                    message.createdAt

                                    ?

                                    new Date(
                                        message.createdAt
                                    ).toLocaleString(
                                        "fa-IR"
                                    )

                                    :

                                    ""

                                }

                            </small>

                        </div>

                    `;

                })

                .join("");


        box.scrollTop =
            box.scrollHeight;


    } catch (error) {

        console.error(
            "LOAD MESSAGES ERROR:",
            error
        );


        box.innerHTML = `

            <div class="empty">

                ❌ دریافت پیام‌ها ناموفق بود.

            </div>

        `;

    }

}


/* ============================================================
   SEND COMMAND MESSAGE
   Authorization اضافه شده
============================================================ */

async function sendCommandMessage() {

    if (!selectedTicketId) {

        return;

    }


    const token =
        getToken();


    if (!token) {

        window.location.href =
            "command-login.html";

        return;

    }


    const input =
        document.getElementById(
            "chatInput"
        );


    if (!input) {

        return;

    }


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ) +
                "/messages",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token

                    },

                    body:

                        JSON.stringify({

                            message

                        })

                }

            );


        if (
            response.status === 401
        ) {

            logoutCommand();

            return;

        }


        let data = null;


        try {

            data =
                await response.json();

        } catch {

            data = null;

        }


        if (
            !response.ok ||
            !data?.success
        ) {

            throw new Error(

                data?.message ||
                `HTTP ${response.status}`

            );

        }


        input.value = "";


        await loadMessages(
            selectedTicketId
        );


        await loadTickets();


    } catch (error) {

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        alert(

            "❌ ارسال پیام انجام نشد.\n\n" +
            error.message

        );

    }

}


/* ============================================================
   LOGOUT
============================================================ */

function logoutCommand() {

    localStorage.removeItem(
        "lspdCommandToken"
    );

    localStorage.removeItem(
        "lspdCommander"
    );

    localStorage.removeItem(
        "lspdAdmin"
    );

    localStorage.removeItem(
        "lspdAdminUser"
    );

    localStorage.removeItem(
        "lspdAdminName"
    );

    localStorage.removeItem(
        "lspdAdminRank"
    );

    localStorage.removeItem(
        "lspdIsOwner"
    );


    window.location.href =
        "command-login.html";

}


/* ============================================================
   INITIALIZE
============================================================ */

async function initializeCommandPanel() {

    const authenticated =
        await checkAuthentication();


    if (!authenticated) {

        return;

    }


    await loadTickets();


    /*
    Refresh tickets
    */

    setInterval(

        async function() {

            if (
                getToken()
            ) {

                await loadTickets();

            }

        },

        5000

    );


    /*
    Refresh chat
    */

    setInterval(

        async function() {

            if (
                selectedTicketId &&
                getToken()
            ) {

                await loadMessages(
                    selectedTicketId
                );

            }

        },

        3000

    );

}


/* ============================================================
   START
============================================================ */

initializeCommandPanel();

</script>
