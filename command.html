<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vanguard LSPD | Command Center</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

* {
    box-sizing: border-box;
}

body.command-page {
    min-height: 100vh;
}

.command-wrapper {
    width: 1200px;
    max-width: 95%;
    margin: 35px auto;
}

.command-header {
    background: rgba(5,10,18,.78);
    border: 1px solid rgba(77,166,255,.25);
    border-radius: 22px;
    padding: 25px;
    backdrop-filter: blur(18px);
    box-shadow: 0 15px 50px rgba(0,0,0,.35);
    margin-bottom: 25px;
}

.command-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.command-user {
    display: flex;
    align-items: center;
    gap: 15px;
}

.command-user img {
    width: 65px;
    height: 65px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px #168cff);
}

.command-user h1 {
    color: #4da6ff;
    margin-bottom: 5px;
}

.command-user p {
    color: #aaa;
    margin: 0;
}

.rank-badge {
    display: inline-block;
    margin-top: 7px;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(0,110,255,.18);
    border: 1px solid rgba(77,166,255,.3);
    color: #6db6ff;
    font-size: 13px;
}

.owner-badge {
    display: inline-block;
    margin-top: 7px;
    margin-right: 5px;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(255,180,0,.15);
    border: 1px solid rgba(255,180,0,.35);
    color: #ffc34d;
    font-size: 13px;
}

.logout-btn {
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.07);
    color: white;
    padding: 11px 18px;
    border-radius: 10px;
    cursor: pointer;
}

.logout-btn:hover {
    background: rgba(255,255,255,.14);
}

.command-grid {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
}

.panel {
    background: rgba(5,10,18,.78);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    padding: 22px;
    backdrop-filter: blur(18px);
}

.panel h2 {
    color: #4da6ff;
    margin-bottom: 18px;
}

.ticket-list {
    max-height: 650px;
    overflow-y: auto;
}

.ticket-item {
    padding: 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);
    margin-bottom: 12px;
    cursor: pointer;
    transition: .2s;
}

.ticket-item:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.09);
}

.ticket-item.active {
    border-color: #168cff;
    box-shadow: 0 0 15px rgba(22,140,255,.18);
}

.ticket-item h3 {
    margin-bottom: 8px;
}

.ticket-item small {
    color: #8995a3;
}

.status {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 15px;
    font-size: 12px;
    margin-top: 8px;
}

.status.pending {
    color: #ffbd45;
    background: rgba(255,180,0,.12);
}

.status.accepted {
    color: #00ff88;
    background: rgba(0,255,136,.1);
}

.status.rejected {
    color: #ff5555;
    background: rgba(255,0,0,.1);
}

.ticket-detail {
    min-height: 500px;
}

.empty {
    color: #777;
    text-align: center;
    padding: 70px 20px;
}

.detail-row {
    padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
}

.detail-row b {
    color: #aaa;
}

.reply-box {
    margin-top: 20px;
}

.reply-box textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    padding: 14px;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    outline: none;
    font-family: inherit;
}

.reply-box textarea:focus {
    border-color: #168cff;
    box-shadow: 0 0 10px rgba(22,140,255,.2);
}

.status-select {
    width: 100%;
    margin-bottom: 10px;
    padding: 13px;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
}

.chat-box {
    margin-top: 25px;
    border-top: 1px solid rgba(255,255,255,.1);
    padding-top: 20px;
}

.messages {
    max-height: 320px;
    overflow-y: auto;
    padding: 10px;
    background: #050a11;
    border-radius: 12px;
    margin-bottom: 10px;
}

.message {
    padding: 11px;
    margin-bottom: 9px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
}

.message.command {
    border-right: 3px solid #3aa0ff;
}

.message.applicant {
    border-right: 3px solid #35d07f;
}

.message-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.message-time {
    display: block;
    margin-top: 5px;
    color: #777;
    font-size: 11px;
}

.chat-input {
    width: 100%;
    min-height: 90px;
    padding: 12px;
    resize: vertical;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    outline: none;
    font-family: inherit;
}

.error-box {
    background: rgba(255,0,0,.08);
    border: 1px solid rgba(255,0,0,.2);
    color: #ff7777;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: none;
    line-height: 1.8;
}

.success-box {
    background: rgba(0,255,136,.08);
    border: 1px solid rgba(0,255,136,.2);
    color: #62ffae;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: none;
    line-height: 1.8;
}

.refresh-info {
    color: #777;
    font-size: 12px;
    text-align: center;
    margin-top: 10px;
}

.debug-box {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: rgba(255,255,255,.04);
    color: #777;
    font-size: 11px;
    direction: ltr;
    text-align: left;
    word-break: break-all;
}

@media(max-width:850px) {

    .command-grid {
        grid-template-columns: 1fr;
    }

    .command-header-inner {
        flex-direction: column;
        align-items: flex-start;
    }

}

</style>

</head>

</header>

<main>

<div class="command-wrapper">

<div class="command-header">

    <div class="command-header-inner">

        <div class="command-user">

            <img
                src="badge.png"
                alt="LSPD"

            <div>

                <h1>
                    👮 پنل فرماندهی

                <p id="commanderName">
                    در حال بررسی نشست...
                </p>

                <span

                </span>

                <span

<div

<div class="command-grid">

<section class="panel">

    <h2>

    </h2>

    <div
        id="ticketList"

    </div>

    <div id="ticketDetail">

        <div class="empty">

            <h2>
                📄 یک تیکت را انتخاب کنید
            </h2>

            <p>
                برای مشاهده جزئیات، یکی از درخواست‌ها را انتخاب کنید.
            </p>

        </div>

    </div>

</section>

</div>

</div>

</main>

<script>

/* ============================================================
   CONFIG
============================================================ */

const API_URL =
    "https://lspd-site-11.onrender.com";


/* ============================================================
   GLOBAL
============================================================ */

let tickets = [];

let selectedTicketId = null;

let commander = null;

let isLoadingTickets = false;

let isLoadingMessages = false;


/* ============================================================
   STORAGE KEYS
============================================================ */

const TOKEN_KEYS = [

    "lspdCommandToken",

    "lspdAdminToken",

    "lspdToken",

    "lspdAuthToken",

    "lspdAuth",

    "authToken",

    "token"

];


/* ============================================================
   GET TOKEN
============================================================ */

function getToken() {

    for (
        const key of TOKEN_KEYS
    ) {

        const value =
            localStorage.getItem(key);

        if (
            value &&
            String(value).trim()
        ) {

            return String(value).trim();

        }

    }

    return "";

}


/* ============================================================
   SAVE TOKEN
============================================================ */

function saveToken(token) {

    if (
        !token ||
        !String(token).trim()
    ) {

        return;

    }

    const cleanToken =
        String(token).trim();

    /*
     * کلید اصلی
     */

    localStorage.setItem(
        "lspdCommandToken",
        cleanToken
    );

    /*
     * کلیدهای سازگاری
     */

    localStorage.setItem(
        "lspdAdminToken",
        cleanToken
    );

    localStorage.setItem(
        "lspdToken",
        cleanToken
    );

}


/* ============================================================
   AUTH HEADERS
============================================================ */

function authHeaders(extra = {}) {

    const token =
        getToken();

    const headers = {

        ...extra

    };

    if (token) {

        /*
         * روش اصلی
         */

        headers["Authorization"] =
            "Bearer " + token;

        /*
         * سازگاری با server.js
         */

        headers["X-Admin-Token"] =
            token;

    }

    return headers;

}


/* ============================================================
   AUTH FETCH
============================================================ */

async function apiFetch(
    url,
    options = {}
) {

    const finalOptions = {

        ...options,

        headers:
            authHeaders(
                options.headers || {}
            ),

        cache:
            "no-store"

    };

    const response =
        await fetch(
            url,
            finalOptions
        );

    return response;

}


/* ============================================================
   JSON RESPONSE
============================================================ */

async function readJSON(response) {

    try {

        return await response.json();

    } catch {

        return null;

    }

}


/* ============================================================
   SHOW ERROR
============================================================ */

function showError(message) {

    const box =
        document.getElementById(
            "errorBox"
        );

    if (!box) {
        return;
    }

    box.innerHTML =
        escapeHTML(
            message ||
            "خطایی رخ داد."
        );

    box.style.display =
        "block";

}


/* ============================================================
   HIDE ERROR
============================================================ */

function hideError() {

    const box =
        document.getElementById(
            "errorBox"
        );

    if (!box) {
        return;
    }

    box.innerHTML =
        "";

    box.style.display =
        "none";

}


/* ============================================================
   SUCCESS
============================================================ */

function showSuccess(message) {

    const box =
        document.getElementById(
            "successBox"
        );

    if (!box) {
        return;
    }

    box.innerText =
        message || "انجام شد.";

    box.style.display =
        "block";

    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        3000
    );

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ============================================================
   GET COMMANDER FROM STORAGE
============================================================ */

function getStoredCommander() {

    try {

        const saved =
            localStorage.getItem(
                "lspdCommander"
            );

        if (saved) {

            const parsed =
                JSON.parse(saved);

            if (
                parsed &&
                parsed.username
            ) {

                return parsed;

            }

        }

    } catch (error) {

        console.error(
            "Commander Parse Error:",
            error
        );

    }

    return {

        username:
            localStorage.getItem(
                "lspdAdminUser"
            ) || "LSPD",

        name:
            localStorage.getItem(
                "lspdAdminName"
            ) || "فرمانده LSPD",

        rank:
            localStorage.getItem(
                "lspdAdminRank"
            ) || "Command",

        role:
            "command",

        isOwner:
            localStorage.getItem(
                "lspdIsOwner"
            ) === "true"

    };

}


/* ============================================================
   DISPLAY COMMANDER
============================================================ */

function displayCommander() {

    const nameElement =
        document.getElementById(
            "commanderName"
        );

    const rankElement =
        document.getElementById(
            "commanderRank"
        );

    const ownerBadge =
        document.getElementById(
            "ownerBadge"
        );

    if (!commander) {

        commander =
            getStoredCommander();

    }

    nameElement.innerText =
        commander.name ||
        commander.username ||
        "فرمانده LSPD";

    rankElement.innerText =
        commander.rank ||
        "Command";

    const owner =
        commander.role === "owner" ||
        commander.isOwner === true;

    ownerBadge.style.display =
        owner
        ? "inline-block"
        : "none";

}


/* ============================================================
   VERIFY SESSION
============================================================ */

async function verifySession() {

    const token =
        getToken();

    if (!token) {

        showError(
            "توکن ورود پیدا نشد. ابتدا از صفحه ورود فرماندهی وارد شوید."
        );

        setTimeout(
            () => {

                window.location.href =
                    "command-login.html";

            },
            1500
        );

        return false;

    }

    try {

        const response =
            await apiFetch(

                API_URL +
                "/auth/me",

                {

                    method:
                        "GET"

                }

            );

        const data =
            await readJSON(
                response
            );

        if (
            response.status === 401
        ) {

            throw new Error(
                "توکن ورود معتبر نیست یا سرور توکن را قبول نکرده است."
            );

        }

        if (
            !response.ok ||
            !data ||
            !data.success ||
            !data.user
        ) {

            throw new Error(

                data?.message ||
                "جلسه ورود معتبر نیست."

            );

        }

        /*
         * فقط Command و Owner
         */

        if (
            data.user.role !== "command" &&
            data.user.role !== "owner"
        ) {

            throw new Error(
                "این حساب دسترسی فرماندهی ندارد."
            );

        }

        commander =
            data.user;

        localStorage.setItem(
            "lspdCommander",
            JSON.stringify(
                data.user
            )
        );

        localStorage.setItem(
            "lspdAdminUser",
            data.user.username || ""
        );

        localStorage.setItem(
            "lspdAdminName",
            data.user.name || ""
        );

        localStorage.setItem(
            "lspdAdminRank",
            data.user.rank || ""
        );

        localStorage.setItem(
            "lspdIsOwner",
            data.user.isOwner
                ? "true"
                : "false"
        );

        displayCommander();

        return true;

    } catch (error) {

        console.error(
            "SESSION ERROR:",
            error
        );

        showError(
            error.message ||
            "جلسه ورود معتبر نیست."
        );

        return false;

    }

}


/* ============================================================
   REQUEST TYPE
============================================================ */

function requestType(type) {

    const types = {

        membership:
            "🚔 عضویت LSPD",

        division:
            "🎖️ دیویژن",

        resignation:
            "📤 استعفا",

        rankup:
            "⬆️ Rankup",

        exam:
            "📚 آزمون"

    };

    return (
        types[type] ||
        "📄 درخواست"
    );

}


/* ============================================================
   STATUS
============================================================ */

function statusHTML(status) {

    if (
        status === "Accepted"
    ) {

        return `

            <span class="status accepted">
                🟢 تایید شده
            </span>

        `;

    }

    if (
        status === "Rejected"
    ) {

        return `

            <span class="status rejected">
                🔴 رد شده
            </span>

        `;

    }

    return `

        <span class="status pending">
            🟡 در انتظار بررسی
        </span>

    `;

}


/* ============================================================
   LOAD TICKETS
============================================================ */

async function loadTickets() {

    if (isLoadingTickets) {
        return;
    }

    isLoadingTickets =
        true;

    const box =
        document.getElementById(
            "ticketList"
        );

    try {

        hideError();

        const token =
            getToken();

        if (!token) {

            throw new Error(
                "توکن ورود موجود نیست."
            );

        }

        const response =
            await apiFetch(

                API_URL +
                "/tickets",

                {

                    method:
                        "GET"

                }

            );

        const data =
            await readJSON(
                response
            );

        if (
            response.status === 401
        ) {

            throw new Error(
                "HTTP 401 — توکن فرماندهی معتبر نیست."
            );

        }

        if (
            response.status === 403
        ) {

            throw new Error(
                "HTTP 403 — حساب شما دسترسی فرماندهی ندارد."
            );

        }

        if (
            !response.ok
        ) {

            throw new Error(

                data?.message ||
                "خطا در دریافت درخواست‌ها"

            );

        }

        /*
         * server.js فعلی آرایه مستقیم برمی‌گرداند.
         */

        if (
            Array.isArray(data)
        ) {

            tickets =
                data;

        }

        /*
         * برای سازگاری بیشتر
         */

        else if (
            Array.isArray(
                data?.tickets
            )
        ) {

            tickets =
                data.tickets;

        }

        else {

            tickets = [];

        }

        renderTickets();

        if (
            selectedTicketId
        ) {

            const selected =
                tickets.find(

                    ticket =>

                    String(
                        ticket._id
                    ) ===
                    String(
                        selectedTicketId
                    )

                );

            if (selected) {

                renderTicketDetail(
                    selected,
                    false
                );

            }

        }

    } catch (error) {

        console.error(
            "LOAD TICKETS ERROR:",
            error
        );

        tickets = [];

        box.innerHTML = `

            <div class="empty">

                ❌ دریافت درخواست‌ها ناموفق بود.

                <br><br>

                <small>

                    ${escapeHTML(
                        error.message ||
                        "Unknown error"
                    )}

                </small>

                <br><br>

                <button
                    class="btn primary"
                    onclick="loadTickets()"
                >
                    🔄 تلاش دوباره
                </button>

                <div class="debug-box">
                    API: ${escapeHTML(
                        API_URL + "/tickets"
                    )}
                </div>

            </div>

        `;

    } finally {

        isLoadingTickets =
            false;

    }

}


/* ============================================================
   RENDER TICKETS
============================================================ */

function renderTickets() {

    const box =
        document.getElementById(
            "ticketList"
        );

    if (!tickets.length) {

        box.innerHTML = `

            <div class="empty">

                📭 هیچ تیکتی وجود ندارد.

            </div>

        `;

        return;

    }

    box.innerHTML =

        tickets
        .map(ticket => {

            const id =
                String(
                    ticket._id
                );

            const name =
                ticket.icName ||
                ticket.name ||
                ticket.ocName ||
                "بدون نام";

            const active =
                String(
                    selectedTicketId
                ) === id
                ? "active"
                : "";

            return `

                <div
                    class="ticket-item ${active}"
                    onclick="selectTicket('${escapeHTML(id)}')"
                >

                    <h3>
                        ${escapeHTML(name)}
                    </h3>

                    <small>
                        ${requestType(
                            ticket.requestType
                        )}
                    </small>

                    <br>

                    ${statusHTML(
                        ticket.status
                    )}

                    <br>

                    <small>

                        ${
                            ticket.createdAt

                            ?

                            new Date(
                                ticket.createdAt
                            ).toLocaleString(
                                "fa-IR"
                            )

                            :

                            ""

                        }

                    </small>

                </div>

            `;

        })
        .join("");

}


/* ============================================================
   SELECT TICKET
============================================================ */

async function selectTicket(id) {

    selectedTicketId =
        String(id);

    const ticket =
        tickets.find(

            t =>

            String(
                t._id
            ) ===
            String(id)

        );

    if (!ticket) {
        return;
    }

    renderTickets();

    renderTicketDetail(
        ticket,
        true
    );

}


/* ============================================================
   DETAIL
============================================================ */

function renderTicketDetail(
    ticket,
    loadChat = true
) {

    const box =
        document.getElementById(
            "ticketDetail"
        );

    box.innerHTML = `

        <h2>
            📄 جزئیات درخواست
        </h2>

        <div class="detail-row">

/* ============================================================
   UPDATE TICKET
============================================================ */

async function updateTicket() {

    if (!selectedTicketId) {
        return;
    }

    const statusElement =
        document.getElementById(
            "statusSelect"
        );

    const replyElement =
        document.getElementById(
            "replyInput"
        );

    if (
        !statusElement ||
        !replyElement
    ) {
        return;
    }

    const status =
        statusElement.value;

    const reply =
        replyElement.value.trim();

    try {

        const response =
            await apiFetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ),

                {

                    method:
                        "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            status,

                            reply

                        })

                }

            );

        const data =
            await readJSON(
                response
            );

        if (
            response.status === 401
        ) {

            throw new Error(
                "HTTP 401 — نشست فرماندهی معتبر نیست."
            );

        }

        if (
            response.status === 403
        ) {

            throw new Error(
                "HTTP 403 — شما دسترسی فرماندهی ندارید."
            );

        }

        if (
            !response.ok ||
            !data?.success
        ) {

            throw new Error(

                data?.message ||
                "خطا در ثبت پاسخ"

            );

        }

        showSuccess(
            "✅ پاسخ با موفقیت ثبت شد."
        );

        await loadTickets();

        const selected =
            tickets.find(

                t =>

                String(
                    t._id
                ) ===
                String(
                    selectedTicketId
                )

            );

        if (selected) {

            renderTicketDetail(
                selected,
                true
            );

        }

    } catch (error) {

        console.error(
            "UPDATE TICKET ERROR:",
            error
        );

        showError(
            error.message ||
            "ثبت پاسخ انجام نشد."
        );

    }

}


/* ============================================================
   LOAD MESSAGES
============================================================ */

async function loadMessages(id) {

    if (isLoadingMessages) {
        return;
    }

    isLoadingMessages =
        true;

    const box =
        document.getElementById(
            "messages"
        );

    if (!box) {

        isLoadingMessages =
            false;

        return;

    }

    try {

        /*
         * در server.js فعلی GET پیام‌ها Public است.
         * بنابراین نیاز به Authorization ندارد.
         */

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    id
                ) +
                "/messages",

                {

                    method:
                        "GET",

                    cache:
                        "no-store"

                }

            );

        const data =
            await readJSON(
                response
            );

        if (
            !response.ok
        ) {

            throw new Error(

                data?.message ||
                "خطا در دریافت پیام‌ها"

            );

        }

        const messages =
            Array.isArray(data)
            ? data
            : [];

        if (
            messages.length === 0
        ) {

            box.innerHTML = `

                <div class="empty">

                    هنوز پیامی ثبت نشده است.

                </div>

            `;

            return;

        }

        box.innerHTML =

            messages
            .map(message => {

                const isCommand =
                    message.sender ===
                    "command";

                /*
                 * server.js فعلی:
                 *
                 * commanderName
                 * commanderRank
                 * commanderUsername
                 *
                 * همچنین برای سازگاری
                 * senderName و senderRank
                 * نیز پشتیبانی می‌شود.
                 */

                const senderName =
                    isCommand

                    ?

                    (
                        message.commanderName ||
                        message.senderName ||
                        "فرماندهی"
                    )

                    :

                    (
                        message.senderName ||
                        "متقاضی"
                    );

                const rank =
                    isCommand

                    &&

                    (
                        message.commanderRank ||
                        message.senderRank
                    )

                    ?

                    ` - ${escapeHTML(
                        message.commanderRank ||
                        message.senderRank
                    )}`

                    :

                    "";

                return `

                    <div
                        class="
                            message
                            ${
                                isCommand
                                ? "command"
                                : "applicant"
                            }
                        "
                    >

                        <div
                            class="message-name"
                        >

                            ${
                                isCommand
                                ? "👮 "
                                : "👤 "
                            }

                            ${escapeHTML(
                                senderName
                            )}

                            ${rank}

                        </div>

                        <div>

                            ${escapeHTML(
                                message.message
                            )}

                        </div>

                        <small
                            class="message-time"
                        >

                            ${
                                message.createdAt

                                ?

                                new Date(
                                    message.createdAt
                                ).toLocaleString(
                                    "fa-IR"
                                )

                                :

                                ""

                            }

                        </small>

                    </div>

                `;

            })

            .join("");

        box.scrollTop =
            box.scrollHeight;

    } catch (error) {

        console.error(
            "LOAD MESSAGES ERROR:",
            error
        );

        box.innerHTML = `

            <div class="empty">

                ❌ دریافت پیام‌ها ناموفق بود.

                <br><br>

                <small>

                    ${escapeHTML(
                        error.message ||
                        ""
                    )}

                </small>

            </div>

        `;

    } finally {

        isLoadingMessages =
            false;

    }

}


/* ============================================================
   SEND COMMAND MESSAGE
============================================================ */

async function sendCommandMessage() {

    if (!selectedTicketId) {
        return;
    }

    const input =
        document.getElementById(
            "chatInput"
        );

    if (!input) {
        return;
    }

    const message =
        input.value.trim();

    if (!message) {

        showError(
            "پیام نمی‌تواند خالی باشد."
        );

        return;

    }

    try {

        /*
         * خیلی مهم:
         *
         * server.js فقط وقتی sender === command باشد
         * توکن را به عنوان فرمانده بررسی می‌کند.
         */

        const response =
            await apiFetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ) +
                "/messages",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message,

                            sender:
                                "command"

                        })

                }

            );

        const data =
            await readJSON(
                response
            );

        if (
            response.status === 401
        ) {

            throw new Error(
                "HTTP 401 — برای ارسال پیام فرماندهی، نشست ورود معتبر لازم است."
            );

        }

        if (
            response.status === 403
        ) {

            throw new Error(
                "HTTP 403 — شما دسترسی فرماندهی ندارید."
            );

        }

        if (
            !response.ok ||
            !data?.success
        ) {

            throw new Error(

                data?.message ||
                "خطا در ارسال پیام"

            );

        }

        input.value =
            "";

        showSuccess(
            "✅ پیام با موفقیت ارسال شد."
        );

        await loadMessages(
            selectedTicketId
        );

        await loadTickets();

    } catch (error) {

        console.error(
            "SEND COMMAND MESSAGE ERROR:",
            error
        );

        showError(
            error.message ||
            "ارسال پیام انجام نشد."
        );

    }

}

function logoutCommand() {

    TOKEN_KEYS.forEach(
        key => {

            localStorage.removeItem(
                key
            );

        }
    );

    localStorage.removeItem(
        "lspdCommander"
    );

    localStorage.removeItem(
        "lspdAdmin"
    );

    localStorage.removeItem(
        "lspdAdminUser"
    );

    localStorage.removeItem(
        "lspdAdminName"
    );

    localStorage.removeItem(
        "lspdAdminRank"
    );

    localStorage.removeItem(
        "lspdIsOwner"
    );

    window.location.href =
        "command-login.html";

}

async function startCommandPanel() {

    commander =

    displayCommander();

    const token =
        getToken();

    if (!token) {

        document.getElementById(
            "ticketList"
        ).innerHTML = `

            <div class="empty">

                ❌ نشست ورود پیدا نشد.

                <br><br>

                لطفاً ابتدا وارد پنل فرماندهی شوید.

                <br><br>

                <button
                    class="btn primary"
                    onclick="
                        window.location.href='command-login.html'
                    "
                >
                    🔐 ورود فرماندهی
                </button>

            </div>

        `;

        return;

    }

    const valid =
        await verifySession();

    if (!valid) {

        document.getElementById(
            "ticketList"
        ).innerHTML = `

            <div class="empty">

                ❌ احراز هویت انجام نشد.

                <br><br>

                <button
                    class="btn primary"
                    onclick="location.reload()"
                >
                    🔄 تلاش دوباره
                </button>

            </div>

        `;

        return;

    }

    await loadTickets();

}

                );

        } catch (error) {

            console.error(
                "AUTO REFRESH ERROR:",
                error
            );

        }

    },

    5000

);

startCommandPanel();
