<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vanguard LSPD | Command Center</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

* {
    box-sizing: border-box;
}

body.command-page {
    min-height: 100vh;
}

.command-wrapper {
    width: 1200px;
    max-width: 95%;
    margin: 35px auto;
}

.command-header {
    background: rgba(5,10,18,.78);
    border: 1px solid rgba(77,166,255,.25);
    border-radius: 22px;
    padding: 25px;
    backdrop-filter: blur(18px);
    box-shadow: 0 15px 50px rgba(0,0,0,.35);
    margin-bottom: 25px;
}

.command-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.command-user {
    display: flex;
    align-items: center;
    gap: 15px;
}

.command-user img {
    width: 65px;
    height: 65px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px #168cff);
}

.command-user h1 {
    color: #4da6ff;
    margin: 0 0 5px;
}

.command-user p {
    color: #aaa;
    margin: 0;
}

.rank-badge,
.owner-badge {
    display: inline-block;
    margin-top: 7px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px;
}

.rank-badge {
    background: rgba(0,110,255,.18);
    border: 1px solid rgba(77,166,255,.3);
    color: #6db6ff;
}

.owner-badge {
    margin-right: 5px;
    background: rgba(255,180,0,.15);
    border: 1px solid rgba(255,180,0,.35);
    color: #ffc34d;
}

.logout-btn {
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.07);
    color: white;
    padding: 11px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
}

.logout-btn:hover {
    background: rgba(255,255,255,.14);
}

.command-grid {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
}

.panel {
    background: rgba(5,10,18,.78);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    padding: 22px;
    backdrop-filter: blur(18px);
}

.panel h2 {
    color: #4da6ff;
    margin: 0 0 18px;
}

.ticket-list {
    max-height: 650px;
    overflow-y: auto;
}

.ticket-item {
    padding: 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);
    margin-bottom: 12px;
    cursor: pointer;
    transition: .2s;
}

.ticket-item:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.09);
}

.ticket-item.active {
    border-color: #168cff;
    box-shadow: 0 0 15px rgba(22,140,255,.18);
}

.ticket-item h3 {
    margin: 0 0 8px;
}

.ticket-item small {
    color: #8995a3;
}

.status {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 15px;
    font-size: 12px;
    margin-top: 8px;
}

.status.pending {
    color: #ffbd45;
    background: rgba(255,180,0,.12);
}

.status.accepted {
    color: #00ff88;
    background: rgba(0,255,136,.1);
}

.status.rejected {
    color: #ff5555;
    background: rgba(255,0,0,.1);
}

.ticket-detail {
    min-height: 500px;
}

.empty {
    color: #777;
    text-align: center;
    padding: 70px 20px;
}

.detail-row {
    padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
    line-height: 1.8;
}

.detail-row b {
    color: #aaa;
}

.reply-box {
    margin-top: 20px;
}

.reply-box textarea,
.chat-input {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    padding: 14px;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    outline: none;
    font-family: inherit;
}

.reply-box textarea:focus,
.chat-input:focus {
    border-color: #168cff;
    box-shadow: 0 0 10px rgba(22,140,255,.2);
}

.status-select {
    width: 100%;
    margin-bottom: 10px;
    padding: 13px;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    font-family: inherit;
}

.chat-box {
    margin-top: 25px;
    border-top: 1px solid rgba(255,255,255,.1);
    padding-top: 20px;
}

.messages {
    max-height: 320px;
    overflow-y: auto;
    padding: 10px;
    background: #050a11;
    border-radius: 12px;
    margin-bottom: 10px;
}

.message {
    padding: 11px;
    margin-bottom: 9px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
}

.message.command {
    border-right: 3px solid #3aa0ff;
}

.message.applicant {
    border-right: 3px solid #35d07f;
}

.message-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.message-time {
    display: block;
    margin-top: 5px;
    color: #777;
    font-size: 11px;
}

.error-box {
    background: rgba(255,0,0,.08);
    border: 1px solid rgba(255,0,0,.2);
    color: #ff7777;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: none;
    line-height: 1.8;
}

.success-box {
    background: rgba(0,255,136,.08);
    border: 1px solid rgba(0,255,136,.2);
    color: #62ffae;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: none;
    line-height: 1.8;
}

.refresh-info {
    color: #777;
    font-size: 12px;
    text-align: center;
    margin-top: 10px;
}

.debug-box {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: rgba(255,255,255,.04);
    color: #777;
    font-size: 11px;
    direction: ltr;
    text-align: left;
    word-break: break-all;
}

.command-loading {
    color: #888;
    text-align: center;
    padding: 30px;
}

.btn {
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    font-family: inherit;
}

.btn.primary {
    background: linear-gradient(135deg,#168cff,#0066cc);
    color: white;
}

.btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

@media(max-width:850px) {

    .command-grid {
        grid-template-columns: 1fr;
    }

    .command-header-inner {
        flex-direction: column;
        align-items: flex-start;
    }

}

</style>

</head>


<body class="command-page">

<div class="overlay"></div>


<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="LSPD"
    >

    <div class="nav-title">

        <h2>Vanguard LSPD</h2>

        <span>Command Center</span>

    </div>

    <a
        href="index.html"
        class="login-btn"
    >
        بازگشت
    </a>

</header>


<main>

<div class="command-wrapper">


<div class="command-header">

    <div class="command-header-inner">

        <div class="command-user">

            <img
                src="badge.png"
                alt="LSPD"
            >

            <div>

                <h1>
                    👮 پنل فرماندهی
                </h1>

                <p id="commanderName">
                    در حال بررسی نشست...
                </p>

                <span
                    id="commanderRank"
                    class="rank-badge"
                >
                    —
                </span>

                <span
                    id="ownerBadge"
                    class="owner-badge"
                    style="display:none;"
                >
                    👑 OWNER
                </span>

            </div>

        </div>


        <button
            class="logout-btn"
            type="button"
            onclick="logoutCommand()"
        >
            خروج
        </button>

    </div>

</div>


<div
    id="errorBox"
    class="error-box"
></div>


<div
    id="successBox"
    class="success-box"
></div>


<div class="command-grid">


<section class="panel">

    <h2>
        📂 درخواست‌ها
    </h2>

    <div
        id="ticketList"
        class="ticket-list"
    >

        <div class="command-loading">
            ⏳ در حال بررسی دسترسی...
        </div>

    </div>

    <div class="refresh-info">
        بروزرسانی خودکار هر ۵ ثانیه
    </div>

</section>


<section class="panel ticket-detail">

    <div id="ticketDetail">

        <div class="empty">

            <h2>
                📄 یک تیکت را انتخاب کنید
            </h2>

            <p>
                برای مشاهده جزئیات، یکی از درخواست‌ها را انتخاب کنید.
            </p>

        </div>

    </div>

</section>


</div>

</div>

</main>


<script>

/* ============================================================
   CONFIG
============================================================ */

const API_URL =
    "https://lspd-site-11.onrender.com";


const TOKEN_KEY =
    "lspdCommandToken";


const USER_KEY =
    "lspdCommander";


/* ============================================================
   GLOBAL
============================================================ */

let tickets = [];

let selectedTicketId = null;

let commander = null;

let isLoadingTickets = false;

let isLoadingMessages = false;

let sessionInvalid = false;


/* ============================================================
   ELEMENTS
============================================================ */

const ticketList =
    document.getElementById(
        "ticketList"
    );

const ticketDetail =
    document.getElementById(
        "ticketDetail"
    );


/* ============================================================
   TOKEN STORAGE
============================================================ */

function getToken() {

    const token =
        localStorage.getItem(
            TOKEN_KEY
        );

    if (
        !token ||
        !String(token).trim()
    ) {

        return "";

    }

    return String(token).trim();

}


function saveToken(token) {

    if (
        !token ||
        !String(token).trim()
    ) {

        return false;

    }

    localStorage.setItem(
        TOKEN_KEY,
        String(token).trim()
    );

    return true;

}


/* ============================================================
   CLEAR ALL COMMAND SESSION
============================================================ */

function clearCommandSession() {

    const keys = [

        "lspdCommandToken",

        "lspdAdminToken",

        "lspdToken",

        "lspdAuthToken",

        "lspdAuth",

        "authToken",

        "token",

        "lspdCommander",

        "lspdAdmin",

        "lspdAdminUser",

        "lspdAdminName",

        "lspdAdminRank",

        "lspdIsOwner"

    ];

    keys.forEach(
        key => {

            localStorage.removeItem(
                key
            );

        }
    );

}


/* ============================================================
   REDIRECT LOGIN
============================================================ */

function redirectToLogin(message) {

    if (sessionInvalid) {

        return;

    }

    sessionInvalid = true;

    clearCommandSession();

    showError(
        message ||
        "نشست فرماندهی منقضی یا نامعتبر است. لطفاً دوباره وارد شوید."
    );

    setTimeout(
        () => {

            window.location.replace(
                "command-login.html"
            );

        },
        700
    );

}


/* ============================================================
   AUTH HEADERS
============================================================ */

function authHeaders(
    extra = {}
) {

    const headers = {

        ...extra

    };

    const token =
        getToken();

    if (token) {

        headers["Authorization"] =
            "Bearer " + token;

        /*
         * هماهنگ با server.js
         */

        headers["X-Admin-Token"] =
            token;

    }

    return headers;

}


/* ============================================================
   AUTH FETCH
============================================================ */

async function apiFetch(
    url,
    options = {}
) {

    const finalOptions = {

        ...options,

        headers:
            authHeaders(
                options.headers || {}
            ),

        cache:
            "no-store"

    };

    return fetch(
        url,
        finalOptions
    );

}


/* ============================================================
   READ JSON
============================================================ */

async function readJSON(
    response
) {

    try {

        return await response.json();

    } catch {

        return null;

    }

}


/* ============================================================
   ERROR
============================================================ */

function showError(
    message
) {

    const box =
        document.getElementById(
            "errorBox"
        );

    if (!box) {
        return;
    }

    box.innerText =
        message ||
        "خطایی رخ داد.";

    box.style.display =
        "block";

}


function hideError() {

    const box =
        document.getElementById(
            "errorBox"
        );

    if (!box) {
        return;
    }

    box.innerText =
        "";

    box.style.display =
        "none";

}


/* ============================================================
   SUCCESS
============================================================ */

function showSuccess(
    message
) {

    const box =
        document.getElementById(
            "successBox"
        );

    if (!box) {
        return;
    }

    box.innerText =
        message ||
        "انجام شد.";

    box.style.display =
        "block";

    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        3000
    );

}


/* ============================================================
   ESCAPE
============================================================ */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ============================================================
   STORED USER
============================================================ */

function getStoredCommander() {

    try {

        const saved =
            localStorage.getItem(
                USER_KEY
            );

        if (saved) {

            const parsed =
                JSON.parse(
                    saved
                );

            if (
                parsed &&
                parsed.username
            ) {

                return parsed;

            }

        }

    } catch (error) {

        console.error(
            "Commander Parse Error:",
            error
        );

    }


    return {

        username:
            localStorage.getItem(
                "lspdAdminUser"
            ) || "",

        name:
            localStorage.getItem(
                "lspdAdminName"
            ) || "فرمانده LSPD",

        rank:
            localStorage.getItem(
                "lspdAdminRank"
            ) || "Command",

        role:
            "command",

        isOwner:
            localStorage.getItem(
                "lspdIsOwner"
            ) === "true"

    };

}


/* ============================================================
   DISPLAY COMMANDER
============================================================ */

function displayCommander() {

    if (!commander) {

        commander =
            getStoredCommander();

    }


    const nameElement =
        document.getElementById(
            "commanderName"
        );

    const rankElement =
        document.getElementById(
            "commanderRank"
        );

    const ownerBadge =
        document.getElementById(
            "ownerBadge"
        );


    if (nameElement) {

        nameElement.innerText =
            commander.name ||
            commander.username ||
            "فرمانده LSPD";

    }


    if (rankElement) {

        rankElement.innerText =
            commander.rank ||
            "Command";

    }


    if (ownerBadge) {

        const isOwner =
            commander.role === "owner" ||
            commander.isOwner === true;

        ownerBadge.style.display =
            isOwner
            ? "inline-block"
            : "none";

    }

}


/* ============================================================
   VERIFY SESSION
============================================================ */

async function verifySession() {

    const token =
        getToken();


    if (!token) {

        redirectToLogin(
            "توکن ورود پیدا نشد. ابتدا وارد پنل فرماندهی شوید."
        );

        return false;

    }


    try {

        const response =
            await apiFetch(

                API_URL +
                "/auth/me",

                {

                    method:
                        "GET"

                }

            );


        const data =
            await readJSON(
                response
            );


        if (
            response.status === 401
        ) {

            redirectToLogin(
                "HTTP 401 — نشست ورود معتبر نیست. لطفاً دوباره وارد شوید."
            );

            return false;

        }


        if (
            response.status === 403
        ) {

            redirectToLogin(
                "این حساب اجازه ورود به پنل فرماندهی را ندارد."
            );

            return false;

        }


        if (
            !response.ok ||
            !data?.success ||
            !data?.user
        ) {

            throw new Error(

                data?.message ||
                "احراز هویت ناموفق بود."

            );

        }


        if (
            data.user.role !== "command" &&
            data.user.role !== "owner"
        ) {

            redirectToLogin(
                "این حساب دسترسی فرماندهی ندارد."
            );

            return false;

        }


        commander =
            data.user;


        localStorage.setItem(

            USER_KEY,

            JSON.stringify(
                data.user
            )

        );


        localStorage.setItem(
            "lspdAdminUser",
            data.user.username || ""
        );

        localStorage.setItem(
            "lspdAdminName",
            data.user.name || ""
        );

        localStorage.setItem(
            "lspdAdminRank",
            data.user.rank || ""
        );

        localStorage.setItem(
            "lspdIsOwner",
            data.user.isOwner
                ? "true"
                : "false"
        );


        displayCommander();


        return true;

    } catch (error) {

        console.error(
            "SESSION ERROR:",
            error
        );

        showError(
            error.message ||
            "بررسی نشست ناموفق بود."
        );

        return false;

    }

}


/* ============================================================
   REQUEST TYPE
============================================================ */

function requestType(
    type
) {

    const types = {

        membership:
            "🚔 عضویت LSPD",

        division:
            "🎖️ دیویژن",

        resignation:
            "📤 استعفا",

        rankup:
            "⬆️ Rankup",

        exam:
            "📚 آزمون"

    };

    return (
        types[type] ||
        "📄 درخواست"
    );

}


/* ============================================================
   STATUS
============================================================ */

function statusHTML(
    status
) {

    if (
        status === "Accepted"
    ) {

        return `

            <span class="status accepted">
                🟢 تایید شده
            </span>

        `;

    }


    if (
        status === "Rejected"
    ) {

        return `

            <span class="status rejected">
                🔴 رد شده
            </span>

        `;

    }


    return `

        <span class="status pending">
            🟡 در انتظار بررسی
        </span>

    `;

}


/* ============================================================
   LOAD TICKETS
============================================================ */

async function loadTickets() {

    if (
        isLoadingTickets ||
        sessionInvalid
    ) {

        return;

    }


    isLoadingTickets =
        true;


    try {

        const token =
            getToken();


        if (!token) {

            redirectToLogin(
                "نشست فرماندهی پیدا نشد."
            );

            return;

        }


        const response =
            await apiFetch(

                API_URL +
                "/tickets",

                {

                    method:
                        "GET",

                    headers: {

                        "Accept":
                            "application/json"

                    }

                }

            );


        const data =
            await readJSON(
                response
            );


        /*
         * 401 بسیار مهم:
         * دیگر retry نمی‌کنیم.
         */

        if (
            response.status === 401
        ) {

            redirectToLogin(
                "HTTP 401 — توکن فرماندهی معتبر نیست. دوباره وارد شوید."
            );

            return;

        }


        if (
            response.status === 403
        ) {

            showError(
                "HTTP 403 — این حساب دسترسی فرماندهی ندارد."
            );

            return;

        }


        if (
            !response.ok
        ) {

            throw new Error(

                data?.message ||
                "خطا در دریافت درخواست‌ها"

            );

        }


        if (
            Array.isArray(data)
        ) {

            tickets =
                data;

        }

        else if (
            Array.isArray(
                data?.tickets
            )
        ) {

            tickets =
                data.tickets;

        }

        else {

            tickets = [];

        }


        renderTickets();


        if (
            selectedTicketId
        ) {

            const selected =
                tickets.find(

                    ticket =>

                    String(
                        ticket._id
                    ) ===
                    String(
                        selectedTicketId
                    )

                );


            if (selected) {

                renderTicketDetail(
                    selected,
                    false
                );

            }

        }

    } catch (error) {

        console.error(
            "LOAD TICKETS ERROR:",
            error
        );


        ticketList.innerHTML = `

            <div class="empty">

                ❌ دریافت درخواست‌ها ناموفق بود.

                <br><br>

                <small>

                    ${escapeHTML(
                        error.message ||
                        "Unknown error"
                    )}

                </small>

                <br><br>

                <button
                    class="btn primary"
                    type="button"
                    onclick="loadTickets()"
                >
                    🔄 تلاش دوباره
                </button>

                <div class="debug-box">

                    ${escapeHTML(
                        API_URL +
                        "/tickets"
                    )}

                </div>

            </div>

        `;

    } finally {

        isLoadingTickets =
            false;

    }

}


/* ============================================================
   RENDER TICKETS
============================================================ */

function renderTickets() {

    if (!tickets.length) {

        ticketList.innerHTML = `

            <div class="empty">

                📭 هیچ تیکتی وجود ندارد.

            </div>

        `;

        return;

    }


    ticketList.innerHTML =

        tickets
        .map(ticket => {

            const id =
                String(
                    ticket._id || ""
                );

            const name =
                ticket.icName ||
                ticket.name ||
                ticket.ocName ||
                "بدون نام";

            const active =
                String(
                    selectedTicketId
                ) === id
                ? "active"
                : "";


            return `

                <div
                    class="ticket-item ${active}"
                    data-ticket-id="${escapeHTML(id)}"
                >

                    <h3>
                        ${escapeHTML(name)}
                    </h3>

                    <small>
                        ${escapeHTML(
                            requestType(
                                ticket.requestType
                            )
                        )}
                    </small>

                    <br>

                    ${statusHTML(
                        ticket.status
                    )}

                    <br>

                    <small>

                        ${
                            ticket.createdAt

                            ?

                            new Date(
                                ticket.createdAt
                            ).toLocaleString(
                                "fa-IR"
                            )

                            :

                            ""

                        }

                    </small>

                </div>

            `;

        })
        .join("");


    /*
     * به جای inline onclick
     * event listener استفاده می‌کنیم.
     */

    ticketList
        .querySelectorAll(
            ".ticket-item"
        )
        .forEach(
            element => {

                element.addEventListener(
                    "click",
                    () => {

                        selectTicket(
                            element.dataset.ticketId
                        );

                    }
                );

            }
        );

}


/* ============================================================
   SELECT TICKET
============================================================ */

async function selectTicket(
    id
) {

    selectedTicketId =
        String(id);


    const ticket =
        tickets.find(

            t =>

            String(
                t._id
            ) ===
            String(id)

        );


    if (!ticket) {
        return;
    }


    renderTickets();


    renderTicketDetail(
        ticket,
        true
    );

}

/* ============================================================
   UPDATE TICKET
============================================================ */

async function updateTicket() {

    if (
        !selectedTicketId ||
        sessionInvalid
    ) {

        return;

    }


    const statusElement =
        document.getElementById(
            "statusSelect"
        );

    const replyElement =
        document.getElementById(
            "replyInput"
        );


    if (
        !statusElement ||
        !replyElement
    ) {

        return;

    }


    const status =
        statusElement.value;

    const reply =
        replyElement.value.trim();


    try {

        const response =
            await apiFetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ),

                {

                    method:
                        "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            status,

                            reply

                        })

                }

            );


        const data =
            await readJSON(
                response
            );


        if (
            response.status === 401
        ) {

            redirectToLogin(
                "HTTP 401 — نشست فرماندهی منقضی شده است."
            );

            return;

        }


        if (
            response.status === 403
        ) {

            throw new Error(
                "HTTP 403 — شما دسترسی فرماندهی ندارید."
            );

        }


        if (
            !response.ok ||
            !data?.success
        ) {

            throw new Error(

                data?.message ||
                "خطا در ثبت پاسخ"

            );

        }


        showSuccess(
            "✅ پاسخ با موفقیت ثبت شد."
        );


        await loadTickets();


        const selected =
            tickets.find(

                t =>

                String(
                    t._id
                ) ===
                String(
                    selectedTicketId
                )

            );


        if (selected) {

            renderTicketDetail(
                selected,
                true
            );

        }

    } catch (error) {

        console.error(
            "UPDATE TICKET ERROR:",
            error
        );

        showError(
            error.message ||
            "ثبت پاسخ انجام نشد."
        );

    }

}


/* ============================================================
   LOAD MESSAGES
============================================================ */

async function loadMessages(
    id
) {

    if (
        isLoadingMessages ||
        !id ||
        sessionInvalid
    ) {

        return;

    }


    isLoadingMessages =
        true;


    const box =
        document.getElementById(
            "messages"
        );


    if (!box) {

        isLoadingMessages =
            false;

        return;

    }


    try {

        /*
         * GET /tickets/:id/messages
         * در server.js فعلی Public است.
         */

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    id
                ) +
                "/messages",

                {

                    method:
                        "GET",

                    headers: {

                        "Accept":
                            "application/json"

                    },

                    cache:
                        "no-store"

                }

            );


        const data =
            await readJSON(
                response
            );


        if (
            !response.ok
        ) {

            throw new Error(

                data?.message ||
                "خطا در دریافت پیام‌ها"

            );

        }


        const messages =
            Array.isArray(data)
            ? data
            : Array.isArray(
                data?.messages
            )
            ? data.messages
            : [];


        if (
            messages.length === 0
        ) {

            box.innerHTML = `

                <div class="empty">

                    هنوز پیامی ثبت نشده است.

                </div>

            `;

            return;

        }


        box.innerHTML =

            messages
            .map(
                message => {

                    const isCommand =
                        message.sender ===
                        "command";


                    const senderName =
                        isCommand

                        ?

                        (
                            message.commanderName ||
                            message.senderName ||
                            "فرماندهی"
                        )

                        :

                        (
                            message.senderName ||
                            "متقاضی"
                        );


                    const rank =
                        isCommand &&
                        (
                            message.commanderRank ||
                            message.senderRank
                        )

                        ?

                        ` - ${escapeHTML(
                            message.commanderRank ||
                            message.senderRank
                        )}`

                        :

                        "";


                    return `

                        <div
                            class="
                                message
                                ${
                                    isCommand
                                    ? "command"
                                    : "applicant"
                                }
                            "
                        >

                            <div
                                class="message-name"
                            >

                                ${
                                    isCommand
                                    ? "👮 "
                                    : "👤 "
                                }

                                ${escapeHTML(
                                    senderName
                                )}

                                ${rank}

                            </div>


                            <div>

                                ${escapeHTML(
                                    message.message ||
                                    ""
                                )}

                            </div>


                            <small
                                class="message-time"
                            >

                                ${
                                    message.createdAt

                                    ?

                                    new Date(
                                        message.createdAt
                                    ).toLocaleString(
                                        "fa-IR"
                                    )

                                    :

                                    ""

                                }

                            </small>

                        </div>

                    `;

                }
            )
            .join("");


        box.scrollTop =
            box.scrollHeight;


    } catch (error) {

        console.error(
            "LOAD MESSAGES ERROR:",
            error
        );


        box.innerHTML = `

            <div class="empty">

                ❌ دریافت پیام‌ها ناموفق بود.

                <br><br>

                <small>

                    ${escapeHTML(
                        error.message ||
                        ""
                    )}

                </small>

            </div>

        `;

    } finally {

        isLoadingMessages =
            false;

    }

}


/* ============================================================
   SEND COMMAND MESSAGE
============================================================ */

async function sendCommandMessage() {

    if (
        !selectedTicketId ||
        sessionInvalid
    ) {

        return;

    }


    const input =
        document.getElementById(
            "chatInput"
        );


    if (!input) {
        return;
    }


    const message =
        input.value.trim();


    if (!message) {

        showError(
            "پیام نمی‌تواند خالی باشد."
        );

        return;

    }


    try {

        const response =
            await apiFetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ) +
                "/messages",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message,

                            sender:
                                "command"

                        })

                }

            );


        const data =
            await readJSON(
                response
            );


        if (
            response.status === 401
        ) {

            redirectToLogin(
                "HTTP 401 — برای ارسال پیام، نشست فرماندهی معتبر لازم است."
            );

            return;

        }


        if (
            response.status === 403
        ) {

            throw new Error(
                "HTTP 403 — شما دسترسی فرماندهی ندارید."
            );

        }


        if (
            !response.ok ||
            !data?.success
        ) {

            throw new Error(

                data?.message ||
                "خطا در ارسال پیام"

            );

        }


        input.value =
            "";


        showSuccess(
            "✅ پیام با موفقیت ارسال شد."
        );


        await loadMessages(
            selectedTicketId
        );


        await loadTickets();


    } catch (error) {

        console.error(
            "SEND COMMAND MESSAGE ERROR:",
            error
        );

        showError(
            error.message ||
            "ارسال پیام انجام نشد."
        );

    }

}

============================================================ */

async function startCommandPanel() {

    commander =
        getStoredCommander();

    displayCommander();


    const token =
        getToken();


    if (!token) {

        ticketList.innerHTML = `

            <div class="empty">

                ❌ نشست ورود پیدا نشد.

                <br><br>

                لطفاً ابتدا وارد پنل فرماندهی شوید.

                <br><br>

                <button
                    class="btn primary"
                    type="button"
                    onclick="
                        window.location.replace(
                            'command-login.html'
                        )
                    "
                >
                    🔐 ورود فرماندهی
                </button>

            </div>

        `;

        return;

    }


    const valid =
        await verifySession();


    if (!valid) {

        return;

    }


    await loadTickets();

}


/* ============================================================
   AUTO REFRESH
============================================================ */

setInterval(

    async function() {

        /*
         * اگر Token خراب شده باشد،
         * دیگر درخواست‌های 401 پشت سر هم نمی‌فرستیم.
         */

        if (
            !getToken() ||
            sessionInvalid
        ) {

            return;

        }


        await loadTickets();


        if (
            selectedTicketId &&
            !sessionInvalid
        ) {

            await loadMessages(
                selectedTicketId
            );

        }

    },

    5000

);


/* ============================================================
   RUN
============================================================ */

startCommandPanel();
