<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vanguard LSPD | Command Center</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body.command-page {
            min-height: 100vh;
        }

        .command-wrapper {
            width: 1200px;
            max-width: 95%;
            margin: 35px auto;
        }

        .command-header {
            background: rgba(5, 10, 18, .78);
            border: 1px solid rgba(77,166,255,.25);
            border-radius: 22px;
            padding: 25px;
            backdrop-filter: blur(18px);
            box-shadow: 0 15px 50px rgba(0,0,0,.35);
            margin-bottom: 25px;
        }

        .command-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .command-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .command-user img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px #168cff);
        }

        .command-user h1 {
            color: #4da6ff;
            margin-bottom: 5px;
        }

        .command-user p {
            color: #aaa;
            margin: 0;
        }

        .rank-badge {
            display: inline-block;
            margin-top: 7px;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(0,110,255,.18);
            border: 1px solid rgba(77,166,255,.3);
            color: #6db6ff;
            font-size: 13px;
        }

        .logout-btn {
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.07);
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,.14);
        }

        .command-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
        }

        .panel {
            background: rgba(5, 10, 18, .78);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 22px;
            padding: 22px;
            backdrop-filter: blur(18px);
        }

        .panel h2 {
            color: #4da6ff;
            margin-bottom: 18px;
        }

        .ticket-list {
            max-height: 650px;
            overflow-y: auto;
        }

        .ticket-item {
            padding: 16px;
            border-radius: 14px;
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.08);
            margin-bottom: 12px;
            cursor: pointer;
            transition: .2s;
        }

        .ticket-item:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,.09);
        }

        .ticket-item.active {
            border-color: #168cff;
            box-shadow: 0 0 15px rgba(22,140,255,.18);
        }

        .ticket-item h3 {
            margin-bottom: 8px;
        }

        .ticket-item small {
            color: #8995a3;
        }

        .status {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 15px;
            font-size: 12px;
            margin-top: 8px;
        }

        .status.pending {
            color: #ffbd45;
            background: rgba(255,180,0,.12);
        }

        .status.accepted {
            color: #00ff88;
            background: rgba(0,255,136,.1);
        }

        .status.rejected {
            color: #ff5555;
            background: rgba(255,0,0,.1);
        }

        .ticket-detail {
            min-height: 500px;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 70px 20px;
        }

        .detail-row {
            padding: 11px 0;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .detail-row b {
            color: #aaa;
        }

        .reply-box {
            margin-top: 20px;
        }

        .reply-box textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            padding: 14px;
            background: #050a11;
            color: white;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 12px;
            outline: none;
            font-family: inherit;
        }

        .reply-box textarea:focus {
            border-color: #168cff;
            box-shadow: 0 0 10px rgba(22,140,255,.2);
        }

        .status-select {
            width: 100%;
            margin-bottom: 10px;
            padding: 13px;
            background: #050a11;
            color: white;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 10px;
        }

        .chat-box {
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,.1);
            padding-top: 20px;
        }

        .messages {
            max-height: 320px;
            overflow-y: auto;
            padding: 10px;
            background: #050a11;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .message {
            padding: 11px;
            margin-bottom: 9px;
            border-radius: 10px;
            background: rgba(255,255,255,.06);
        }

        .message.command {
            border-right: 3px solid #3aa0ff;
        }

        .message.applicant {
            border-right: 3px solid #35d07f;
        }

        .message-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .message-time {
            display: block;
            margin-top: 5px;
            color: #777;
            font-size: 11px;
        }

        .chat-input {
            width: 100%;
            min-height: 90px;
            padding: 12px;
            resize: vertical;
            background: #050a11;
            color: white;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 10px;
            outline: none;
            font-family: inherit;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-buttons .btn {
            flex: 1;
        }

        .refresh-info {
            color: #777;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }

        .auth-error {
            color: #ff6666;
            text-align: center;
            padding: 20px;
        }

        @media(max-width:850px) {
            .command-grid {
                grid-template-columns: 1fr;
            }

            .command-header-inner {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body class="command-page">

<div class="overlay"></div>

<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="LSPD"
    >

    <div class="nav-title">
        <h2>Vanguard LSPD</h2>
        <span>Command Center</span>
    </div>

    <!-- IMPORTANT: index.html, NOT index.htm -->
    <a
        href="index.html"
        class="login-btn"
    >
        بازگشت
    </a>

</header>

<main>

<div class="command-wrapper">

<div class="command-header">

    <div class="command-header-inner">

        <div class="command-user">

            <img
                src="badge.png"
                alt="LSPD"
            >

            <div>

                <h1>
                    👮 پنل فرماندهی
                </h1>

                <p id="commanderName">
                    در حال دریافت اطلاعات فرمانده...
                </p>

                <span
                    id="commanderRank"
                    class="rank-badge"
                >
                    —
                </span>

            </div>

        </div>

        <button
            class="logout-btn"
            onclick="logoutCommand()"
        >
            خروج
        </button>

    </div>

</div>

<div class="command-grid">

<section class="panel">

    <h2>
        📂 درخواست‌ها
    </h2>

    <div
        id="ticketList"
        class="ticket-list"
    >
        <div class="empty">
            ⏳ در حال دریافت تیکت‌ها...
        </div>
    </div>

    <div class="refresh-info">
        بروزرسانی خودکار فعال است
    </div>

</section>

<section class="panel ticket-detail">

    <div id="ticketDetail">

        <div class="empty">

            <h2>
                📄 یک تیکت را انتخاب کنید
            </h2>

            <p>
                برای مشاهده جزئیات، یکی از درخواست‌ها را انتخاب کنید.
            </p>

        </div>

    </div>

</section>

</div>

</div>

</main>

<script>

/*
============================================================
CONFIG
============================================================
*/

const API_URL =
    "https://lspd-site-11.onrender.com";


let tickets = [];

let selectedTicketId = null;

let commander = null;


/*
============================================================
AUTH TOKEN
============================================================

server.js expects:

Authorization: Bearer TOKEN

این نسخه چند نام مختلف را بررسی می‌کند تا اگر
command-login.html شما نام قدیمی داشته باشد هم کار کند.
============================================================
*/

function getAuthToken() {

    const possibleKeys = [

        "lspdAdminToken",

        "lspdCommanderToken",

        "lspdToken",

        "adminToken",

        "token"

    ];

    for (const key of possibleKeys) {

        const token =
            localStorage.getItem(key);

        if (token && token.trim()) {

            return token.trim();

        }

    }

    return null;

}


/*
============================================================
AUTH HEADERS
============================================================
*/

function getAuthHeaders(json = false) {

    const token =
        getAuthToken();


    if (!token) {

        redirectToLogin();

        return null;

    }


    const headers = {

        "Authorization":
            "Bearer " + token

    };


    if (json) {

        headers["Content-Type"] =
            "application/json";

    }


    return headers;

}


/*
============================================================
LOGIN REDIRECT
============================================================
*/

function redirectToLogin() {

    localStorage.removeItem(
        "lspdCommander"
    );

    window.location.href =
        "command-login.html";

}


/*
============================================================
HANDLE AUTH ERROR
============================================================
*/

async function handleAuthResponse(response) {

    if (response.status === 401) {

        alert(
            "🔐 نشست شما منقضی شده است. لطفاً دوباره وارد شوید."
        );

        redirectToLogin();

        return true;

    }


    if (response.status === 403) {

        alert(
            "⛔ شما دسترسی فرماندهی ندارید."
        );

        return true;

    }


    return false;

}


/*
============================================================
COMMANDER
============================================================
*/

function getCommanderFromStorage() {

    try {

        const saved =
            localStorage.getItem(
                "lspdCommander"
            );


        if (saved) {

            const parsed =
                JSON.parse(saved);


            if (parsed && typeof parsed === "object") {

                return parsed;

            }

        }

    } catch (error) {

        console.error(
            "Commander storage error:",
            error
        );

    }


    return {

        username:
            localStorage.getItem(
                "lspdAdminUser"
            ) || "LSPD",

        name:
            localStorage.getItem(
                "lspdAdminName"
            ) || "فرمانده LSPD",

        rank:
            localStorage.getItem(
                "lspdAdminRank"
            ) || "Command",

        role:
            "command"

    };

}


/*
============================================================
LOAD AUTH USER FROM SERVER
============================================================

این قسمت مهم است.

به جای اعتماد کامل به localStorage،
اطلاعات واقعی فرمانده از /auth/me گرفته می‌شود.
============================================================
*/

async function loadCommander() {

    const headers =
        getAuthHeaders();


    if (!headers) {

        return false;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/auth/me",

                {

                    method: "GET",

                    headers,

                    cache: "no-store"

                }

            );


        if (
            await handleAuthResponse(
                response
            )
        ) {

            return false;

        }


        if (!response.ok) {

            throw new Error(
                "خطا در دریافت اطلاعات فرمانده"
            );

        }


        const data =
            await response.json();


        if (
            !data.success ||
            !data.user
        ) {

            throw new Error(
                "اطلاعات فرمانده نامعتبر است"
            );

        }


        commander =
            data.user;


        localStorage.setItem(

            "lspdCommander",

            JSON.stringify(
                commander
            )

        );


        document
            .getElementById(
                "commanderName"
            )
            .innerText =
                commander.name ||
                commander.username ||
                "فرمانده LSPD";


        document
            .getElementById(
                "commanderRank"
            )
            .innerText =
                commander.rank ||
                "Command";


        return true;


    } catch (error) {

        console.error(
            "LOAD COMMANDER ERROR:",
            error
        );


        /*
        اگر سرور در دسترس نبود،
        از اطلاعات قبلی استفاده می‌کنیم.
        */

        commander =
            getCommanderFromStorage();


        document
            .getElementById(
                "commanderName"
            )
            .innerText =
                commander.name ||
                commander.username ||
                "فرمانده LSPD";


        document
            .getElementById(
                "commanderRank"
            )
            .innerText =
                commander.rank ||
                "Command";


        return true;

    }

}


/*
============================================================
ESCAPE HTML
============================================================
*/

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
============================================================
REQUEST TYPE
============================================================
*/

function requestType(type) {

    const types = {

        membership:
            "🚔 عضویت LSPD",

        division:
            "🎖️ دیویژن",

        resignation:
            "📤 استعفا",

        rankup:
            "⬆️ Rankup",

        exam:
            "📚 آزمون"

    };


    return (
        types[type] ||
        "📄 درخواست"
    );

}


/*
============================================================
STATUS
============================================================
*/

function statusHTML(status) {

    if (status === "Accepted") {

        return `
            <span class="status accepted">
                🟢 تایید شده
            </span>
        `;

    }


    if (status === "Rejected") {

        return `
            <span class="status rejected">
                🔴 رد شده
            </span>
        `;

    }


    return `
        <span class="status pending">
            🟡 در انتظار بررسی
        </span>
    `;

}


/*
============================================================
LOAD TICKETS
============================================================

server.js:

GET /tickets
requireCommand
============================================================
*/

async function loadTickets() {

    const headers =
        getAuthHeaders();


    if (!headers) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets",

                {

                    method: "GET",

                    headers,

                    cache: "no-store"

                }

            );


        if (
            await handleAuthResponse(
                response
            )
        ) {

            return;

        }


        if (!response.ok) {

            throw new Error(
                "خطا در دریافت تیکت‌ها"
            );

        }


        const data =
            await response.json();


        tickets =
            Array.isArray(data)
            ? data
            : [];


        renderTickets();


        if (selectedTicketId) {

            const selected =
                tickets.find(

                    t =>
                        String(t._id) ===
                        String(selectedTicketId)

                );


            if (selected) {

                renderTicketDetail(
                    selected
                );

            }

        }


    } catch (error) {

        console.error(
            "LOAD TICKETS ERROR:",
            error
        );


        document
            .getElementById(
                "ticketList"
            )
            .innerHTML = `

                <div class="empty">

                    ❌ دریافت تیکت‌ها ناموفق بود.

                    <br><br>

                    <small>
                        ${escapeHTML(
                            error.message
                        )}
                    </small>

                </div>

            `;

    }

}


/*
============================================================
RENDER TICKETS
============================================================
*/

function renderTickets() {

    const box =
        document.getElementById(
            "ticketList"
        );


    if (!tickets.length) {

        box.innerHTML = `

            <div class="empty">

                📭 هیچ تیکتی وجود ندارد.

            </div>

        `;

        return;

    }


    box.innerHTML =
        tickets
            .map(ticket => {

                const id =
                    String(ticket._id);


                const name =
                    ticket.icName ||
                    ticket.name ||
                    ticket.ocName ||
                    "بدون نام";


                const active =
                    String(
                        selectedTicketId
                    ) === id
                    ? "active"
                    : "";


                return `

                    <div
                        class="ticket-item ${active}"
                        onclick="selectTicket('${escapeHTML(id)}')"
                    >

                        <h3>
                            ${escapeHTML(name)}
                        </h3>

                        <small>
                            ${requestType(
                                ticket.requestType
                            )}
                        </small>

                        <br>

                        ${statusHTML(
                            ticket.status
                        )}

                        <br>

                        <small>

                            ${
                                ticket.createdAt

                                ?

                                new Date(
                                    ticket.createdAt
                                ).toLocaleString(
                                    "fa-IR"
                                )

                                :

                                ""

                            }

                        </small>

                    </div>

                `;

            })
            .join("");

}


/*
============================================================
SELECT TICKET
============================================================
*/

async function selectTicket(id) {

    selectedTicketId =
        String(id);


    const ticket =
        tickets.find(

            t =>
                String(t._id) ===
                String(id)

        );


    if (!ticket) {

        return;

    }


    renderTickets();

    renderTicketDetail(
        ticket
    );


    await loadMessages(
        id
    );

}


/*
============================================================
DETAIL HELPERS
============================================================
*/

function detailRow(label, value) {

    return `

        <div class="detail-row">

            <b>
                ${escapeHTML(label)}
            </b>

            <br>

            ${escapeHTML(
                value || "—"
            )}

        </div>

    `;

}


/*
============================================================
TICKET DETAIL
============================================================
*/

function renderTicketDetail(ticket) {

    const box =
        document.getElementById(
            "ticketDetail"
        );


    box.innerHTML = `

        <h2>
            📄 جزئیات درخواست
        </h2>

        ${detailRow(
            "کد پیگیری:",
            ticket._id
        )}

        ${detailRow(
            "نوع درخواست:",
            requestType(
                ticket.requestType
            )
        )}

        ${detailRow(
            "IC Name:",
            ticket.icName ||
            ticket.name
        )}

        ${detailRow(
            "OC Name:",
            ticket.ocName
        )}

        ${detailRow(
            "Discord:",
            ticket.discord ||
            ticket.discordId
        )}

        ${detailRow(
            "Steam Hex:",
            ticket.steamHex
        )}

        ${detailRow(
            "CMX:",
            ticket.cmx
        )}

        ${detailRow(
            "سن:",
            ticket.age
        )}

        ${detailRow(
            "تجربه:",
            ticket.experience
        )}

        ${detailRow(
            "دلیل درخواست:",
            ticket.reason
        )}

        ${detailRow(
            "Division فعلی:",
            ticket.currentDivision
        )}

        ${detailRow(
            "Division درخواستی:",
            ticket.requestedDivision
        )}

        ${detailRow(
            "دلیل تغییر Division:",
            ticket.reasonForRequest
        )}

        ${detailRow(
            "تجربه Division قبلی:",
            ticket.previousDivisionExperience
        )}

        ${detailRow(
            "اطلاعات اضافی:",
            ticket.additionalInformation
        )}

        ${detailRow(
            "Rank:",
            ticket.rank
        )}

        ${detailRow(
            "Call Sign:",
            ticket.callSign
        )}

        ${detailRow(
            "دلیل استعفا:",
            ticket.resignationReason
        )}

        ${detailRow(
            "Rank درخواستی:",
            ticket.requestRank
        )}

        ${detailRow(
            "مدت Rank فعلی:",
            ticket.currentRankTimeplay
        )}

        ${detailRow(
            "یادداشت:",
            ticket.note
        )}

        ${
            ticket.score !== null &&
            ticket.score !== undefined

            ?

            `

            <div class="detail-row">

                <b>
                    📚 نمره آزمون:
                </b>

                <br>

                ${escapeHTML(
                    ticket.score
                )}

                از 20

                <br>

                ${
                    ticket.passed

                    ?

                    `<span class="status accepted">
                        🟢 قبول شده
                    </span>`

                    :

                    `<span class="status rejected">
                        🔴 رد شده
                    </span>`

                }

            </div>

            `

            :

            ""

        }


        <div class="detail-row">

            <b>
                وضعیت فعلی:
            </b>

            <br>

            ${statusHTML(
                ticket.status
            )}

        </div>


        <div class="reply-box">

            <h2>
                ✍️ پاسخ فرماندهی
            </h2>


            <select
                id="statusSelect"
                class="status-select"
            >

                <option
                    value="Pending"
                    ${
                        ticket.status ===
                        "Pending"
                        ? "selected"
                        : ""
                    }
                >
                    🟡 در انتظار بررسی
                </option>


                <option
                    value="Accepted"
                    ${
                        ticket.status ===
                        "Accepted"
                        ? "selected"
                        : ""
                    }
                >
                    🟢 تایید شده
                </option>


                <option
                    value="Rejected"
                    ${
                        ticket.status ===
                        "Rejected"
                        ? "selected"
                        : ""
                    }
                >
                    🔴 رد شده
                </option>

            </select>


            <textarea
                id="replyInput"
                placeholder="پاسخ خود را برای متقاضی بنویسید..."
            >${
                escapeHTML(

                    ticket.reply ===
                    "در انتظار پاسخ فرماندهی"

                    ?

                    ""

                    :

                    ticket.reply || ""

                )
            }</textarea>


            <button
                class="btn primary"
                style="width:100%;margin-top:10px;"
                onclick="updateTicket()"
            >
                💾 ثبت پاسخ
            </button>

        </div>


        <div class="chat-box">

            <h2>
                💬 گفتگوی مستقیم
            </h2>


            <div
                id="messages"
                class="messages"
            >

                <div class="empty">
                    ⏳ در حال دریافت پیام‌ها...
                </div>

            </div>


            <textarea
                id="chatInput"
                class="chat-input"
                placeholder="پیام خود را برای متقاضی بنویسید..."
            ></textarea>


            <button
                class="btn primary"
                style="width:100%;margin-top:8px;"
                onclick="sendCommandMessage()"
            >
                📨 ارسال پیام
            </button>

        </div>

    `;

}


/*
============================================================
UPDATE TICKET
============================================================

server.js:

PUT /tickets/:id
requireCommand
============================================================
*/

async function updateTicket() {

    if (!selectedTicketId) {

        return;

    }


    const statusElement =
        document.getElementById(
            "statusSelect"
        );


    const replyElement =
        document.getElementById(
            "replyInput"
        );


    if (!statusElement || !replyElement) {

        return;

    }


    const status =
        statusElement.value;


    const reply =
        replyElement.value.trim();


    const headers =
        getAuthHeaders(true);


    if (!headers) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ),

                {

                    method: "PUT",

                    headers,

                    body:
                        JSON.stringify({

                            status,

                            reply

                        })

                }

            );


        if (
            await handleAuthResponse(
                response
            )
        ) {

            return;

        }


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(

                data.message ||
                "خطا در ثبت پاسخ"

            );

        }


        alert(
            "✅ پاسخ با موفقیت ثبت شد."
        );


        await loadTickets();


    } catch (error) {

        console.error(
            "UPDATE TICKET ERROR:",
            error
        );


        alert(
            "❌ ثبت پاسخ انجام نشد.\n\n" +
            error.message
        );

    }

}


/*
============================================================
LOAD MESSAGES
============================================================

در server.js فعلی این route عمومی است،
پس Authorization اجباری نیست.
ولی ارسال آن مشکلی ندارد.
============================================================
*/

async function loadMessages(id) {

    const box =
        document.getElementById(
            "messages"
        );


    if (!box) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id) +
                "/messages",

                {

                    method: "GET",

                    cache: "no-store"

                }

            );


        if (response.status === 404) {

            box.innerHTML = `

                <div class="empty">

                    ❌ تیکت پیدا نشد.

                </div>

            `;

            return;

        }


        if (!response.ok) {

            throw new Error(
                "خطا در دریافت پیام‌ها"
            );

        }


        const messages =
            await response.json();


        if (
            !Array.isArray(messages) ||
            messages.length === 0
        ) {

            box.innerHTML = `

                <div class="empty">

                    هنوز پیامی ثبت نشده است.

                </div>

            `;

            return;

        }


        box.innerHTML =
            messages
                .map(message => {

                    const isCommand =
                        message.sender ===
                        "command";


                    const senderName =
                        isCommand

                        ?

                        (
                            message.senderName ||
                            "فرماندهی"
                        )

                        :

                        "👤 متقاضی";


                    const rank =
                        isCommand &&
                        message.senderRank

                        ?

                        ` - ${escapeHTML(
                            message.senderRank
                        )}`

                        :

                        "";


                    return `

                        <div class="
                            message
                            ${
                                isCommand
                                ? "command"
                                : "applicant"
                            }
                        ">

                            <div class="message-name">

                                ${
                                    isCommand
                                    ? "👮 "
                                    : ""
                                }

                                ${escapeHTML(
                                    senderName
                                )}

                                ${rank}

                            </div>


                            <div>

                                ${escapeHTML(
                                    message.message
                                )}

                            </div>


                            <small
                                class="message-time"
                            >

                                ${
                                    message.createdAt

                                    ?

                                    new Date(
                                        message.createdAt
                                    ).toLocaleString(
                                        "fa-IR"
                                    )

                                    :

                                    ""

                                }

                            </small>

                        </div>

                    `;

                })
                .join("");


        box.scrollTop =
            box.scrollHeight;


    } catch (error) {

        console.error(
            "LOAD MESSAGES ERROR:",
            error
        );


        box.innerHTML = `

            <div class="empty">

                ❌ دریافت پیام‌ها ناموفق بود.

            </div>

        `;

    }

}


/*
============================================================
SEND COMMAND MESSAGE
============================================================

server.js determines sender from Token.

بنابراین sender / commanderName /
commanderRank را از Frontend ارسال نمی‌کنیم.
============================================================
*/

async function sendCommandMessage() {

    if (!selectedTicketId) {

        return;

    }


    const input =
        document.getElementById(
            "chatInput"
        );


    if (!input) {

        return;

    }


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    if (message.length > 2000) {

        alert(
            "❌ پیام نمی‌تواند بیشتر از 2000 کاراکتر باشد."
        );

        return;

    }


    const headers =
        getAuthHeaders(true);


    if (!headers) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ) +
                "/messages",

                {

                    method: "POST",

                    headers,

                    body:
                        JSON.stringify({

                            message

                        })

                }

            );


        if (
            await handleAuthResponse(
                response
            )
        ) {

            return;

        }


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(

                data.message ||
                "خطا در ارسال پیام"

            );

        }


        input.value = "";


        await loadMessages(
            selectedTicketId
        );


        await loadTickets();


    } catch (error) {

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        alert(
            "❌ ارسال پیام انجام نشد.\n\n" +
            error.message
        );

    }

}


/*
============================================================
LOGOUT
============================================================
*/

function logoutCommand() {

    const tokenKeys = [

        "lspdAdminToken",

        "lspdCommanderToken",

        "lspdToken",

        "adminToken",

        "token"

    ];


    tokenKeys.forEach(
        key =>
            localStorage.removeItem(key)
    );


    localStorage.removeItem(
        "lspdCommander"
    );

    localStorage.removeItem(
        "lspdAdmin"
    );

    localStorage.removeItem(
        "lspdAdminUser"
    );

    localStorage.removeItem(
        "lspdAdminName"
    );

    localStorage.removeItem(
        "lspdAdminRank"
    );


    window.location.href =
        "command-login.html";

}

async function initializeCommandPage() {

    const token =
        getAuthToken();


    if (!token) {

        redirectToLogin();

        return;

    }


    const authenticated =
        await loadCommander();


    if (!authenticated) {

        return;

    }


    await loadTickets();

}
