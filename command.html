<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Command Center</title>

<link rel="stylesheet" href="style.css">

<style>
* {
    box-sizing: border-box;
}

body.command-page {
    min-height: 100vh;
}

.command-wrapper {
    width: 1200px;
    max-width: 95%;
    margin: 35px auto;
}

.command-header {
    background: rgba(5, 10, 18, .78);
    border: 1px solid rgba(77,166,255,.25);
    border-radius: 22px;
    padding: 25px;
    backdrop-filter: blur(18px);
    box-shadow: 0 15px 50px rgba(0,0,0,.35);
    margin-bottom: 25px;
}

.command-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.command-user {
    display: flex;
    align-items: center;
    gap: 15px;
}

.command-user img {
    width: 65px;
    height: 65px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px #168cff);
}

.command-user h1 {
    color: #4da6ff;
    margin: 0 0 5px;
}

.command-user p {
    color: #aaa;
    margin: 0;
}

.rank-badge {
    display: inline-block;
    margin-top: 7px;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(0,110,255,.18);
    border: 1px solid rgba(77,166,255,.3);
    color: #6db6ff;
    font-size: 13px;
}

.role-badge {
    display: inline-block;
    margin-right: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(255,190,0,.12);
    border: 1px solid rgba(255,190,0,.25);
    color: #ffd166;
    font-size: 12px;
}

.logout-btn {
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.07);
    color: white;
    padding: 11px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
}

.logout-btn:hover {
    background: rgba(255,255,255,.14);
}

.command-grid {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
}

.panel {
    background: rgba(5, 10, 18, .78);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    padding: 22px;
    backdrop-filter: blur(18px);
}

.panel h2 {
    color: #4da6ff;
    margin-top: 0;
    margin-bottom: 18px;
}

.ticket-list {
    max-height: 650px;
    overflow-y: auto;
}

.ticket-item {
    padding: 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);
    margin-bottom: 12px;
    cursor: pointer;
    transition: .2s;
}

.ticket-item:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.09);
}

.ticket-item.active {
    border-color: #168cff;
    box-shadow: 0 0 15px rgba(22,140,255,.18);
}

.ticket-item h3 {
    margin: 0 0 8px;
}

.ticket-item small {
    color: #8995a3;
}

.status {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 15px;
    font-size: 12px;
    margin-top: 8px;
}

.status.pending {
    color: #ffbd45;
    background: rgba(255,180,0,.12);
}

.status.accepted {
    color: #00ff88;
    background: rgba(0,255,136,.1);
}

.status.rejected {
    color: #ff5555;
    background: rgba(255,0,0,.1);
}

.ticket-detail {
    min-height: 500px;
}

.empty {
    color: #777;
    text-align: center;
    padding: 70px 20px;
}

.error-message {
    color: #ff6666;
    background: rgba(255,0,0,.08);
    border: 1px solid rgba(255,0,0,.18);
    padding: 14px;
    border-radius: 12px;
    margin: 15px 0;
    text-align: center;
}

.detail-row {
    padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,.07);
    line-height: 1.8;
}

.detail-row b {
    color: #aaa;
}

.reply-box {
    margin-top: 20px;
}

.reply-box textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    padding: 14px;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    outline: none;
    font-family: inherit;
}

.reply-box textarea:focus {
    border-color: #168cff;
}

.status-select {
    width: 100%;
    margin-bottom: 10px;
    padding: 13px;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    font-family: inherit;
}

.chat-box {
    margin-top: 25px;
    border-top: 1px solid rgba(255,255,255,.1);
    padding-top: 20px;
}

.messages {
    max-height: 320px;
    overflow-y: auto;
    padding: 10px;
    background: #050a11;
    border-radius: 12px;
    margin-bottom: 10px;
}

.message {
    padding: 11px;
    margin-bottom: 9px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
}

.message.command {
    border-right: 3px solid #3aa0ff;
}

.message.applicant {
    border-right: 3px solid #35d07f;
}

.message-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.message-time {
    display: block;
    margin-top: 5px;
    color: #777;
    font-size: 11px;
}

.chat-input {
    width: 100%;
    min-height: 90px;
    padding: 12px;
    resize: vertical;
    background: #050a11;
    color: white;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    outline: none;
    font-family: inherit;
}

.action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.action-buttons .btn {
    flex: 1;
}

.owner-panel {
    margin-top: 20px;
    border: 1px solid rgba(255,190,0,.25);
}

.owner-panel h2 {
    color: #ffd166;
}

.owner-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,190,0,.25);
    background: rgba(255,190,0,.08);
    color: #ffd166;
    cursor: pointer;
    font-family: inherit;
}

.owner-btn:hover {
    background: rgba(255,190,0,.15);
}

.logs-box {
    display: none;
    margin-top: 15px;
    max-height: 450px;
    overflow-y: auto;
}

.log-item {
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 10px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.07);
    font-size: 13px;
    line-height: 1.8;
}

.log-action {
    color: #4da6ff;
    font-weight: bold;
}

.log-actor {
    color: #ffd166;
}

.log-time {
    color: #777;
    font-size: 11px;
}

.delete-btn {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,70,70,.3);
    background: rgba(255,0,0,.08);
    color: #ff6666;
    cursor: pointer;
    font-family: inherit;
}

.delete-btn:hover {
    background: rgba(255,0,0,.15);
}

.refresh-info {
    color: #777;
    font-size: 12px;
    text-align: center;
    margin-top: 10px;
}

@media(max-width:850px) {
    .command-grid {
        grid-template-columns: 1fr;
    }

    .command-header-inner {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>

</head>

<body class="command-page">

<div class="overlay"></div>

<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="LSPD"
    >

    <div class="nav-title">
        <h2>Vanguard LSPD</h2>
        <span>Command Center</span>
    </div>

    <a
        href="index.html"
        class="login-btn"
    >
        بازگشت
    </a>

</header>


<main>

<div class="command-wrapper">

<div class="command-header">

    <div class="command-header-inner">

        <div class="command-user">

            <img
                src="badge.png"
                alt="LSPD"
            >

            <div>

                <h1>👮 پنل فرماندهی</h1>

                <p id="commanderName">
                    در حال دریافت اطلاعات فرمانده...
                </p>

                <span
                    id="commanderRank"
                    class="rank-badge"
                >
                    —
                </span>

                <span
                    id="commanderRole"
                    class="role-badge"
                >
                    —
                </span>

            </div>

        </div>

        <button
            class="logout-btn"
            onclick="logoutCommand()"
        >
            خروج
        </button>

    </div>

</div>


<div class="command-grid">


<section class="panel">

    <h2>📂 درخواست‌ها</h2>

    <div
        id="ticketList"
        class="ticket-list"
    >
        <div class="empty">
            ⏳ در حال دریافت تیکت‌ها...
        </div>
    </div>

    <div class="refresh-info">
        بروزرسانی خودکار فعال است
    </div>

</section>


<section class="panel ticket-detail">

    <div id="ticketDetail">

        <div class="empty">

            <h2>
                📄 یک تیکت را انتخاب کنید
            </h2>

            <p>
                برای مشاهده جزئیات، یکی از درخواست‌ها را انتخاب کنید.
            </p>

        </div>

    </div>

</section>


</div>


<!-- OWNER ONLY -->

<section
    id="ownerPanel"
    class="panel owner-panel"
    style="display:none;"
>

    <h2>👑 مدیریت مالک سیستم</h2>

    <button
        class="owner-btn"
        onclick="toggleLogs()"
    >
        📜 نمایش / مخفی کردن لاگ‌ها
    </button>

    <div
        id="logsBox"
        class="logs-box"
    >
        <div class="empty">
            ⏳ در حال دریافت لاگ‌ها...
        </div>
    </div>

</section>


</div>

</main>


<script>

/* =========================================================
   API
========================================================= */

const API_URL =
    "https://lspd-site-11.onrender.com";


/* =========================================================
   GLOBAL
========================================================= */

let tickets = [];

let selectedTicketId = null;

let commander = null;


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

    return (
        localStorage.getItem(
            "lspdCommandToken"
        ) ||
        localStorage.getItem(
            "lspdAdminToken"
        ) ||
        ""
    );

}


/* =========================================================
   AUTH HEADERS
========================================================= */

function authHeaders(extra = {}) {

    const token =
        getToken();

    return {

        ...extra,

        "Authorization":
            "Bearer " + token,

        "X-Admin-Token":
            token

    };

}


/* =========================================================
   CHECK AUTH
========================================================= */

async function checkAuth() {

    const token =
        getToken();

    if (!token) {

        window.location.href =
            "command-login.html";

        return false;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/auth/me",

                {

                    method: "GET",

                    headers:
                        authHeaders(),

                    cache:
                        "no-store"

                }

            );


        if (!response.ok) {

            localStorage.removeItem(
                "lspdCommandToken"
            );

            localStorage.removeItem(
                "lspdAdminToken"
            );

            localStorage.removeItem(
                "lspdCommander"
            );

            window.location.href =
                "command-login.html";

            return false;

        }


        const data =
            await response.json();


        if (
            !data.success ||
            !data.user
        ) {

            throw new Error(
                "Invalid user"
            );

        }


        commander =
            data.user;


        renderCommander();


        return true;


    } catch (error) {

        console.error(
            "AUTH ERROR:",
            error
        );

        window.location.href =
            "command-login.html";

        return false;

    }

}


/* =========================================================
   COMMANDER UI
========================================================= */

function renderCommander() {

    const name =
        commander.name ||
        commander.username ||
        "فرمانده LSPD";


    const rank =
        commander.rank ||
        "Command";


    document
        .getElementById(
            "commanderName"
        )
        .innerText =
            name;


    document
        .getElementById(
            "commanderRank"
        )
        .innerText =
            rank;


    const role =
        commander.role ||
        "command";


    document
        .getElementById(
            "commanderRole"
        )
        .innerText =
            role === "owner"
            ? "👑 OWNER"
            : "👮 COMMAND";


    if (
        role === "owner" ||
        commander.isOwner === true
    ) {

        document
            .getElementById(
                "ownerPanel"
            )
            .style.display =
                "block";

    }

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   REQUEST TYPE
========================================================= */

function requestType(type) {

    const types = {

        membership:
            "🚔 عضویت LSPD",

        division:
            "🎖️ دیویژن",

        resignation:
            "📤 استعفا",

        rankup:
            "⬆️ Rankup",

        exam:
            "📚 آزمون"

    };

    return (
        types[type] ||
        "📄 درخواست"
    );

}


/* =========================================================
   STATUS
========================================================= */

function statusHTML(status) {

    if (
        status === "Accepted"
    ) {

        return `
            <span class="status accepted">
                🟢 تایید شده
            </span>
        `;

    }


    if (
        status === "Rejected"
    ) {

        return `
            <span class="status rejected">
                🔴 رد شده
            </span>
        `;

    }


    return `
        <span class="status pending">
            🟡 در انتظار بررسی
        </span>
    `;

}


/* =========================================================
   LOAD TICKETS
========================================================= */

async function loadTickets() {

    try {

        const response =
            await fetch(

                API_URL +
                "/tickets",

                {

                    method: "GET",

                    headers:
                        authHeaders(),

                    cache:
                        "no-store"

                }

            );


        if (
            response.status === 401
        ) {

            console.error(
                "GET /tickets => 401"
            );

            showTicketError(
                "HTTP 401 — نشست فرماندهی معتبر نیست. دوباره وارد شوید."
            );

            return;

        }


        if (
            response.status === 403
        ) {

            showTicketError(
                "HTTP 403 — این حساب دسترسی فرماندهی ندارد."
            );

            return;

        }


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        tickets =
            Array.isArray(data)
            ? data
            : [];


        renderTickets();


        if (selectedTicketId) {

            const selected =
                tickets.find(

                    ticket =>
                        String(
                            ticket._id
                        ) ===
                        String(
                            selectedTicketId
                        )

                );


            if (selected) {

                renderTicketDetail(
                    selected
                );

            }

        }


    } catch (error) {

        console.error(
            "LOAD TICKETS ERROR:",
            error
        );

        showTicketError(
            "دریافت درخواست‌ها ناموفق بود."
        );

    }

}


/* =========================================================
   TICKET ERROR
========================================================= */

function showTicketError(message) {

    document
        .getElementById(
            "ticketList"
        )
        .innerHTML = `

            <div class="error-message">

                ❌ ${escapeHTML(message)}

                <br><br>

                <button
                    class="owner-btn"
                    onclick="loadTickets()"
                >
                    🔄 تلاش مجدد
                </button>

            </div>

        `;

}


/* =========================================================
   RENDER TICKETS
========================================================= */

function renderTickets() {

    const box =
        document.getElementById(
            "ticketList"
        );


    if (!tickets.length) {

        box.innerHTML = `

            <div class="empty">
                📭 هیچ تیکتی وجود ندارد.
            </div>

        `;

        return;

    }


    box.innerHTML =
        tickets
            .map(ticket => {

                const id =
                    String(
                        ticket._id
                    );


                const name =
                    ticket.icName ||
                    ticket.name ||
                    ticket.ocName ||
                    "بدون نام";


                const active =
                    String(
                        selectedTicketId
                    ) === id
                    ? "active"
                    : "";


                return `

                    <div
                        class="ticket-item ${active}"
                        onclick="selectTicket('${id}')"
                    >

                        <h3>
                            ${escapeHTML(name)}
                        </h3>

                        <small>
                            ${requestType(
                                ticket.requestType
                            )}
                        </small>

                        <br>

                        ${statusHTML(
                            ticket.status
                        )}

                        <br>

                        <small>

                            ${
                                ticket.createdAt
                                ?
                                new Date(
                                    ticket.createdAt
                                ).toLocaleString(
                                    "fa-IR"
                                )
                                :
                                ""
                            }

                        </small>

                    </div>

                `;

            })
            .join("");

}


/* =========================================================
   SELECT
========================================================= */

async function selectTicket(id) {

    selectedTicketId =
        String(id);


    const ticket =
        tickets.find(

            t =>
                String(t._id) ===
                String(id)

        );


    if (!ticket) {

        return;

    }


    renderTickets();

    renderTicketDetail(
        ticket
    );


    await loadMessages(
        id
    );

}


/* =========================================================
   DETAIL
========================================================= */

function renderTicketDetail(ticket) {

    const box =
        document.getElementById(
            "ticketDetail"
        );


    box.innerHTML = `

        <h2>
            📄 جزئیات درخواست
        </h2>


        <div class="detail-row">

            <b>کد پیگیری:</b>

            <br>

            ${escapeHTML(
                ticket._id
            )}

        </div>


        <div class="detail-row">

            <b>نوع درخواست:</b>

            <br>

            ${requestType(
                ticket.requestType
            )}

        </div>


        <div class="detail-row">

            <b>IC Name:</b>

            <br>

            ${escapeHTML(
                ticket.icName ||
                ticket.name ||
                "—"
            )}

        </div>


        <div class="detail-row">

            <b>OC Name:</b>

            <br>

            ${escapeHTML(
                ticket.ocName ||
                "—"
            )}

        </div>


        <div class="detail-row">

            <b>Discord:</b>

            <br>

            ${escapeHTML(
                ticket.discord ||
                ticket.discordId ||
                "—"
            )}

        </div>


        <div class="detail-row">

            <b>Steam Hex:</b>

            <br>

            ${escapeHTML(
                ticket.steamHex ||
                "—"
            )}

        </div>


        <div class="detail-row">

            <b>سن:</b>

            <br>

            ${escapeHTML(
                ticket.age ||
                "—"
            )}

        </div>


        <div class="detail-row">

            <b>وضعیت:</b>

            <br>

            ${statusHTML(
                ticket.status
            )}

        </div>


        ${
            ticket.score !== null &&
            ticket.score !== undefined
            ?
            `

                <div class="detail-row">

                    <b>📚 نمره آزمون:</b>

                    <br>

                    ${escapeHTML(
                        ticket.score
                    )}
                    از 20

                </div>

            `
            :
            ""
        }


        ${
            ticket.experience
            ?
            `

                <div class="detail-row">

                    <b>تجربه:</b>

                    <br>

                    ${escapeHTML(
                        ticket.experience
                    )}

                </div>

            `
            :
            ""
        }


        ${
            ticket.reason
            ?
            `

                <div class="detail-row">

                    <b>دلیل درخواست:</b>

                    <br>

                    ${escapeHTML(
                        ticket.reason
                    )}

                </div>

            `
            :
            ""
        }


        <div class="reply-box">

            <h2>
                ✍️ پاسخ فرماندهی
            </h2>


            <select
                id="statusSelect"
                class="status-select"
            >

                <option
                    value="Pending"
                    ${
                        ticket.status === "Pending"
                        ? "selected"
                        : ""
                    }
                >
                    🟡 در انتظار بررسی
                </option>

                <option
                    value="Accepted"
                    ${
                        ticket.status === "Accepted"
                        ? "selected"
                        : ""
                    }
                >
                    🟢 تایید شده
                </option>

                <option
                    value="Rejected"
                    ${
                        ticket.status === "Rejected"
                        ? "selected"
                        : ""
                    }
                >
                    🔴 رد شده
                </option>

            </select>


            <textarea
                id="replyInput"
                placeholder="پاسخ خود را برای متقاضی بنویسید..."
            >${
                escapeHTML(
                    ticket.reply ===
                    "در انتظار پاسخ فرماندهی"
                    ? ""
                    :
                    ticket.reply || ""
                )
            }</textarea>


            <button
                class="btn primary"
                style="width:100%;margin-top:10px;"
                onclick="updateTicket()"
            >
                💾 ثبت پاسخ
            </button>


            ${
                commander &&
                (
                    commander.role === "owner" ||
                    commander.isOwner === true
                )
                ?
                `

                    <button
                        class="delete-btn"
                        onclick="deleteTicket()"
                    >
                        🗑️ حذف این تیکت
                    </button>

                `
                :
                ""
            }

        </div>


        <div class="chat-box">

            <h2>
                💬 گفتگوی مستقیم
            </h2>


            <div
                id="messages"
                class="messages"
            >

                <div class="empty">
                    ⏳ در حال دریافت پیام‌ها...
                </div>

            </div>


            <textarea
                id="chatInput"
                class="chat-input"
                placeholder="پیام خود را برای متقاضی بنویسید..."
            ></textarea>


            <button
                class="btn primary"
                style="width:100%;margin-top:8px;"
                onclick="sendCommandMessage()"
            >
                📨 ارسال پیام
            </button>

        </div>

    `;

}


/* =========================================================
   UPDATE TICKET
========================================================= */

async function updateTicket() {

    if (!selectedTicketId) {

        return;

    }


    const statusElement =
        document.getElementById(
            "statusSelect"
        );


    const replyElement =
        document.getElementById(
            "replyInput"
        );


    if (
        !statusElement ||
        !replyElement
    ) {

        return;

    }


    const status =
        statusElement.value;


    const reply =
        replyElement.value.trim();


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ),

                {

                    method: "PUT",

                    headers:
                        authHeaders({

                            "Content-Type":
                                "application/json"

                        }),

                    body:
                        JSON.stringify({

                            status,

                            reply

                        })

                }

            );


        const data =
            await response.json();


        if (
            response.status === 401
        ) {

            alert(
                "❌ نشست شما منقضی شده است. دوباره وارد شوید."
            );

            logoutCommand();

            return;

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "خطا در ثبت پاسخ"
            );

        }


        alert(
            "✅ پاسخ با موفقیت ثبت شد."
        );


        await loadTickets();


        if (selectedTicketId) {

            await loadMessages(
                selectedTicketId
            );

        }


    } catch (error) {

        console.error(
            "UPDATE ERROR:",
            error
        );

        alert(
            "❌ ثبت پاسخ انجام نشد."
        );

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(id) {

    const box =
        document.getElementById(
            "messages"
        );


    if (!box) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id) +
                "/messages",

                {

                    method: "GET",

                    headers:
                        authHeaders(),

                    cache:
                        "no-store"

                }

            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const messages =
            await response.json();


        if (
            !Array.isArray(messages) ||
            messages.length === 0
        ) {

            box.innerHTML = `

                <div class="empty">
                    هنوز پیامی ثبت نشده است.
                </div>

            `;

            return;

        }


        box.innerHTML =
            messages
                .map(message => {

                    const isCommand =
                        message.sender ===
                        "command";


                    const senderName =
                        isCommand
                        ?
                        (
                            message.senderName ||
                            message.commanderName ||
                            "فرماندهی"
                        )
                        :
                        (
                            message.senderName ||
                            "👤 متقاضی"
                        );


                    const rank =
                        isCommand &&
                        (
                            message.senderRank ||
                            message.commanderRank
                        )
                        ?
                        ` - ${escapeHTML(
                            message.senderRank ||
                            message.commanderRank
                        )}`
                        :
                        "";


                    return `

                        <div class="
                            message
                            ${
                                isCommand
                                ? "command"
                                : "applicant"
                            }
                        ">

                            <div
                                class="message-name"
                            >

                                ${
                                    isCommand
                                    ? "👮 "
                                    : ""
                                }

                                ${escapeHTML(
                                    senderName
                                )}

                                ${rank}

                            </div>


                            <div>

                                ${escapeHTML(
                                    message.message
                                )}

                            </div>


                            <small
                                class="message-time"
                            >

                                ${
                                    message.createdAt
                                    ?
                                    new Date(
                                        message.createdAt
                                    ).toLocaleString(
                                        "fa-IR"
                                    )
                                    :
                                    ""
                                }

                            </small>

                        </div>

                    `;

                })
                .join("");


        box.scrollTop =
            box.scrollHeight;


    } catch (error) {

        console.error(
            "MESSAGES ERROR:",
            error
        );

        box.innerHTML = `

            <div class="empty">
                ❌ دریافت پیام‌ها ناموفق بود.
            </div>

        `;

    }

}


/* =========================================================
   SEND COMMAND MESSAGE
========================================================= */

async function sendCommandMessage() {

    if (!selectedTicketId) {

        return;

    }


    const input =
        document.getElementById(
            "chatInput"
        );


    if (!input) {

        return;

    }


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ) +
                "/messages",

                {

                    method: "POST",

                    headers:
                        authHeaders({

                            "Content-Type":
                                "application/json"

                        }),

                    body:
                        JSON.stringify({

                            message

                        })

                }

            );


        const data =
            await response.json();


        if (
            response.status === 401
        ) {

            alert(
                "❌ نشست شما معتبر نیست. دوباره وارد شوید."
            );

            logoutCommand();

            return;

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "خطا در ارسال پیام"
            );

        }


        input.value = "";


        await loadMessages(
            selectedTicketId
        );


        await loadTickets();


    } catch (error) {

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );

        alert(
            "❌ ارسال پیام انجام نشد."
        );

    }

}


/* =========================================================
   DELETE TICKET
========================================================= */

async function deleteTicket() {

    if (!selectedTicketId) {

        return;

    }


    if (
        !commander ||
        (
            commander.role !== "owner" &&
            commander.isOwner !== true
        )
    ) {

        alert(
            "❌ فقط Owner می‌تواند تیکت را حذف کند."
        );

        return;

    }


    const confirmed =
        confirm(
            "⚠️ آیا مطمئن هستید که می‌خواهید این تیکت را حذف کنید؟"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    selectedTicketId
                ),

                {

                    method: "DELETE",

                    headers:
                        authHeaders()

                }

            );


        const data =
            await response.json();


        if (
            response.status === 401
        ) {

            alert(
                "❌ نشست شما معتبر نیست."
            );

            logoutCommand();

            return;

        }


        if (
            response.status === 403
        ) {

            alert(
                "❌ فقط Owner اجازه حذف دارد."
            );

            return;

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "حذف انجام نشد"
            );

        }


        alert(
            "🗑️ تیکت با موفقیت حذف شد."
        );


        selectedTicketId =
            null;


        document
            .getElementById(
                "ticketDetail"
            )
            .innerHTML = `

                <div class="empty">

                    <h2>
                        📄 یک تیکت را انتخاب کنید
                    </h2>

                    <p>
                        تیکت حذف شد.
                    </p>

                </div>

            `;


        await loadTickets();


    } catch (error) {

        console.error(
            "DELETE ERROR:",
            error
        );

        alert(
            "❌ حذف تیکت انجام نشد."
        );

    }

}


/* =========================================================
   OWNER LOGS
========================================================= */

async function toggleLogs() {

    const box =
        document.getElementById(
            "logsBox"
        );


    if (
        box.style.display ===
        "block"
    ) {

        box.style.display =
            "none";

        return;

    }


    box.style.display =
        "block";


    await loadLogs();

}


/* =========================================================
   LOAD LOGS
========================================================= */

async function loadLogs() {

    const box =
        document.getElementById(
            "logsBox"
        );


    if (!box) {

        return;

    }


    if (
        !commander ||
        (
            commander.role !== "owner" &&
            commander.isOwner !== true
        )
    ) {

        box.innerHTML = `

            <div class="error-message">
                ❌ دسترسی فقط برای Owner است.
            </div>

        `;

        return;

    }


    box.innerHTML = `

        <div class="empty">
            ⏳ در حال دریافت لاگ‌ها...
        </div>

    `;


    try {

        const response =
            await fetch(

                API_URL +
                "/logs?limit=200",

                {

                    method: "GET",

                    headers:
                        authHeaders(),

                    cache:
                        "no-store"

                }

            );


        if (
            response.status === 403
        ) {

            throw new Error(
                "دسترسی فقط برای Owner است."
            );

        }


        if (
            response.status === 401
        ) {

            logoutCommand();

            return;

        }


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "خطا در دریافت لاگ‌ها"
            );

        }


        const logs =
            Array.isArray(
                data.logs
            )
            ? data.logs
            : [];


        if (!logs.length) {

            box.innerHTML = `

                <div class="empty">
                    📭 هنوز لاگی ثبت نشده است.
                </div>

            `;

            return;

        }


        box.innerHTML =
            logs
                .map(log => {

                    const actor =
                        log.actor || {};


                    const action =
                        log.action ||
                        "UNKNOWN";


                    const details =
                        log.details || {};


                    let detailsText =
                        "";


                    if (
                        details.message
                    ) {

                        detailsText +=
                            `پیام: ${details.message}`;

                    }


                    if (
                        details.reply
                    ) {

                        detailsText +=
                            `پاسخ: ${details.reply}`;

                    }


                    if (
                        details.oldStatus ||
                        details.newStatus
                    ) {

                        detailsText +=
                            `وضعیت: ${
                                details.oldStatus ||
                                "—"
                            } ← ${
                                details.newStatus ||
                                "—"
                            }`;

                    }


                    return `

                        <div
                            class="log-item"
                        >

                            <div
                                class="log-action"
                            >
                                ${escapeHTML(
                                    action
                                )}
                            </div>


                            <div
                                class="log-actor"
                            >

                                👤 نام:
                                ${escapeHTML(
                                    actor.name ||
                                    actor.username ||
                                    "System"
                                )}

                                <br>

                                🪪 Username:
                                ${escapeHTML(
                                    actor.username ||
                                    "System"
                                )}

                                <br>

                                🎖️ Rank:
                                ${escapeHTML(
                                    actor.rank ||
                                    "System"
                                )}

                                <br>

                                🎫 Ticket:
                                ${escapeHTML(
                                    log.ticketId ||
                                    "—"
                                )}

                            </div>


                            ${
                                detailsText
                                ?
                                `
                                    <div>
                                        ${escapeHTML(
                                            detailsText
                                        )}
                                    </div>
                                `
                                :
                                ""
                            }


                            <div
                                class="log-time"
                            >

                                ${
                                    log.createdAt
                                    ?
                                    new Date(
                                        log.createdAt
                                    ).toLocaleString(
                                        "fa-IR"
                                    )
                                    :
                                    ""
                                }

                            </div>

                        </div>

                    `;

                })
                .join("");


    } catch (error) {

        console.error(
            "LOGS ERROR:",
            error
        );

        box.innerHTML = `

            <div class="error-message">

                ❌ دریافت لاگ‌ها ناموفق بود.

                <br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================================================
   LOGOUT
========================================================= */

function logoutCommand() {

    localStorage.removeItem(
        "lspdCommandToken"
    );

    localStorage.removeItem(
        "lspdAdminToken"
    );

    localStorage.removeItem(
        "lspdCommander"
    );

    localStorage.removeItem(
        "lspdAdmin"
    );

    localStorage.removeItem(
        "lspdAdminUser"
    );

    localStorage.removeItem(
        "lspdAdminName"
    );

    localStorage.removeItem(
        "lspdAdminRank"
    );

    localStorage.removeItem(
        "lspdIsOwner"
    );


    window.location.href =
        "command-login.html";

}


/* =========================================================
   START
========================================================= */

async function startCommandPage() {

    const authenticated =
        await checkAuth();


    if (!authenticated) {

        return;

    }


    await loadTickets();

}


/* =========================================================
   AUTO REFRESH
========================================================= */

startCommandPage();


setInterval(
    async function() {

        if (!commander) {

            return;

        }

        await loadTickets();

    },
    5000
);


setInterval(
    async function() {

        if (!selectedTicketId) {

            return;

        }

        await loadMessages(
            selectedTicketId
        );

    },
    3000
);

</script>
