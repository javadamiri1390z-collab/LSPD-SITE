<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Application</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="form-page">


<div class="overlay"></div>


<header class="navbar">

<img src="badge.png" class="badge">


<div class="nav-title">

<h2>
Vanguard LSPD
</h2>

<span>
Recruitment Application
</span>

</div>


<a href="index.html" class="login-btn">
بازگشت
</a>


</header>




<main class="hero">


<div class="form-box">


<img
src="badge.png"
class="form-badge"
alt="LSPD Badge"
>


<h1>
فرم درخواست عضویت LSPD
</h1>


<p>
لطفاً اطلاعات خود را با دقت وارد کنید.
</p>





<form id="applicationForm">



<!-- OC NAME -->

<input
type="text"
id="ocName"
placeholder="OC Name"
required
>



<!-- IC NAME -->

<input
type="text"
id="icName"
placeholder="IC Name"
required
>



<!-- DISCORD -->

<input
type="text"
id="discord"
placeholder="Discord ID"
required
>



<!-- STEAM HEX -->

<input
type="text"
id="steamHex"
placeholder="Steam Hex : steam:110000..."
required
>



<!-- Phone number -->

<input
type="text"
id="number"
placeholder="number"
required
>



<!-- AGE -->

<input
type="number"
id="age"
placeholder="سن"
min="1"
required
>



<!-- EXPERIENCE -->

<textarea
id="experience"
placeholder="سابقه رول پلی و تجربه شما"
required></textarea>



<!-- REASON -->

<textarea
id="reason"
placeholder="چرا می خواهید عضو LSPD شوید؟"
required></textarea>




<button
type="submit"
class="btn primary"
>

🚔 ارسال درخواست

</button>



</form>





<div id="result"></div>



</div>



</main>






<script src="script.js"></script>


<script>


document
.getElementById("applicationForm")
.addEventListener("submit", async function(e){


e.preventDefault();




let data = {


ocName:
document.getElementById("ocName").value.trim(),


icName:
document.getElementById("icName").value.trim(),


discord:
document.getElementById("discord").value.trim(),


steamHex:
document.getElementById("steamHex").value.trim(),


cmx:
document.getElementById("cmx").value.trim(),


age:
document.getElementById("age").value,


experience:
document.getElementById("experience").value.trim(),


reason:
document.getElementById("reason").value.trim()


};






let id = await createTicket(data);





if(id){


document.getElementById("result").innerHTML = `


<h3>
درخواست شما ثبت شد ✅
</h3>


<p>
کد پیگیری:
</p>


<b>
${id}
</b>


<p>
این کد را نگه دارید.
</p>


`;



this.reset();


}



});


</script>



</body>

</html>
