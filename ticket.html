<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Tracking</title>

<link rel="stylesheet" href="style.css">

</head>



<body class="lobby-page">



<div class="overlay"></div>





<header class="navbar">


<img src="badge.png" class="badge">



<div class="nav-title">

<h2>
Vanguard LSPD
</h2>


<span>
Application Tracking
</span>


</div>




<a href="index.html" class="login-btn">

بازگشت

</a>



</header>








<main class="hero">





<div class="form-box">






<h1>
📄 پیگیری درخواست
</h1>





<p>
کد پیگیری MongoDB خود را وارد کنید.
</p>







<input

type="text"

id="ticketID"

placeholder="مثال: 65f8a12..."

>







<button

class="btn primary"

onclick="checkTicket()">

بررسی درخواست

</button>







<div id="ticketResult"></div>







</div>







</main>









<script>



const API_URL =
"https://lspd-site-11.onrender.com";







async function checkTicket(){



let id =
document
.getElementById("ticketID")
.value
.trim();




let result =
document.getElementById("ticketResult");





if(!id){


result.innerHTML = `

<p style="color:#ffaa00">

کد پیگیری را وارد کنید

</p>

`;

return;

}





result.innerHTML =
"⏳ در حال بررسی...";






try{



let response =
await fetch(
API_URL + "/tickets"
);




let tickets =
await response.json();






let ticket =
tickets.find(
t => String(t._id) === String(id)
);







if(ticket){



let color =
"#ffaa00";


if(ticket.status==="Accepted")
color="#00ff88";


if(ticket.status==="Rejected")
color="#ff3333";






result.innerHTML = `



<div class="ticket-result">



<h2>
✅ درخواست پیدا شد
</h2>




<p>
<b>نام:</b>
${ticket.name}
</p>





<p>
<b>وضعیت:</b>

<span style="color:${color}">
${ticket.status}
</span>

</p>






<p>
<b>پاسخ فرماندهی:</b>

<br>

${ticket.reply || "بدون پاسخ"}

</p>






<p>

<b>تاریخ ثبت:</b>

${new Date(ticket.createdAt)
.toLocaleString("fa-IR")}

</p>





</div>



`;




}else{



result.innerHTML = `


<p style="color:red">

❌ درخواستی با این کد پیدا نشد

</p>


`;



}




}

catch(error){



console.log(error);



result.innerHTML = `


<p style="color:red">

❌ خطا در اتصال به سرور

</p>


`;



}




}



</script>






</body>

</html>
