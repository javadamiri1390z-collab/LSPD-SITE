<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Ticket</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="overlay"></div>


<header class="navbar">

<img src="badge.png" class="badge">


<div class="nav-title">

<h2>Vanguard LSPD</h2>

<span>Application Tracking</span>

</div>


<a href="index.html" class="login-btn">
بازگشت
</a>


</header>





<main class="hero">


<div class="form-box">


<h1>
پیگیری درخواست
</h1>


<p>
کد پیگیری درخواست خود را وارد کنید.
</p>



<input 
type="text"
id="ticketID"
placeholder="کد پیگیری MongoDB را وارد کنید">





<button 
class="btn primary"
onclick="checkTicket()">

بررسی درخواست

</button>




<div id="ticketResult"></div>



</div>


</main>






<script>


const API_URL = "https://lspd-site-11.onrender.com";





async function checkTicket(){


let id =
document.getElementById("ticketID").value.trim();




if(!id){

alert("کد پیگیری را وارد کنید");

return;

}





let result =
document.getElementById("ticketResult");



result.innerHTML =
"در حال بررسی...";




try{


let response =
await fetch(API_URL + "/tickets");



let tickets =
await response.json();




let ticket =
tickets.find(t => 
t._id === id
);





if(ticket){


result.innerHTML = `


<hr>


<h3>
وضعیت درخواست
</h3>



<p>
نام:
${ticket.name}
</p>



<p>
وضعیت:
<b>
${ticket.status}
</b>
</p>



<p>
پاسخ فرماندهی:
<br>
${ticket.reply}
</p>



<p>
تاریخ ثبت:
${new Date(ticket.createdAt).toLocaleString("fa-IR")}
</p>



`;



}else{



result.innerHTML = `


<p style="color:red">

درخواستی با این کد پیدا نشد ❌

</p>


`;



}



}

catch(error){


console.error(error);



result.innerHTML = `

<p style="color:red">

خطا در اتصال به سرور ❌

</p>

`;



}



}




</script>



</body>

</html>
