<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Tracking</title>

<link rel="stylesheet" href="style.css">

<style>

.chat-section {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #ffffff18;
}

.chat-section h2 {
    margin-bottom: 10px;
}

.messages {
    max-height: 400px;
    overflow-y: auto;
    padding: 10px;
    background: #050a11;
    border: 1px solid #ffffff12;
    border-radius: 12px;
    margin-bottom: 12px;
}

.message {
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    background: #ffffff08;
}

.message.command {
    border-right: 3px solid #3aa0ff;
}

.message.applicant {
    border-right: 3px solid #35d07f;
}

.message-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.message-text {
    white-space: pre-wrap;
    line-height: 1.7;
}

.message-time {
    display: block;
    margin-top: 6px;
    color: #8995a3;
    font-size: 11px;
}

.chat-input {
    width: 100%;
    min-height: 100px;
    resize: vertical;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ffffff18;
    background: #050a11;
    color: white;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
}

.chat-send {
    width: 100%;
    margin-top: 8px;
}

.exam-score {
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
    background: #ffffff08;
}

.pass {
    color: #00ff88;
    font-weight: bold;
}

.fail {
    color: #ff4444;
    font-weight: bold;
}

.chat-status {
    font-size: 12px;
    color: #777;
    text-align: center;
    margin-top: 8px;
}

</style>

</head>


<body class="lobby-page">

<div class="overlay"></div>


<header class="navbar">

    <img
        src="badge.png"
        class="badge"
        alt="Vanguard LSPD"
    >

    <div class="nav-title">

        <h2>Vanguard LSPD</h2>

        <span>Application Tracking</span>

    </div>

    <a
        href="index.html"
        class="login-btn"
    >
        بازگشت
    </a>

</header>


<main class="hero">

<div class="form-box">

    <img
        src="badge.png"
        class="form-badge"
        alt="LSPD Badge"
    >

    <h1>📄 پیگیری درخواست</h1>

    <p>
        کد پیگیری درخواست خود را وارد کنید.
    </p>


    <input
        type="text"
        id="ticketID"
        placeholder="کد پیگیری را وارد کنید..."
        autocomplete="off"
    >


    <button
        type="button"
        class="btn primary"
        onclick="checkTicket()"
    >
        🔍 بررسی درخواست
    </button>


    <div id="ticketResult"></div>


    <!-- ================================= -->
    <!-- CHAT -->
    <!-- ================================= -->

    <div
        id="chatSection"
        class="chat-section"
        style="display:none;"
    >

        <h2>
            💬 چت با فرماندهی
        </h2>

        <p>
            در این بخش می‌توانید با فرماندهی درباره درخواست خود گفتگو کنید.
        </p>


        <div
            id="messages"
            class="messages"
        >
        </div>


        <div
            id="chatStatus"
            class="chat-status"
        >
            🔄 بروزرسانی خودکار فعال است
        </div>


        <textarea
            id="chatInput"
            class="chat-input"
            placeholder="پیام خود را بنویسید..."
        ></textarea>


        <button
            type="button"
            class="btn primary chat-send"
            onclick="sendMessage()"
        >
            📨 ارسال پیام
        </button>

    </div>

</div>

</main>


<script>


// ===================================
// API
// ===================================

const API_URL =
    "https://lspd-site-11.onrender.com";


// ===================================
// VARIABLES
// ===================================

let currentTicketId = "";

let pollingInterval = null;

let isLoadingMessages = false;

let isSendingMessage = false;

let lastMessagesSignature = "";

let lastTicketSignature = "";


// ===================================
// ESCAPE HTML
// ===================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ===================================
// VALUE
// ===================================

function valueOrDash(value) {

    if (
        value === undefined ||
        value === null ||
        String(value).trim() === ""
    ) {

        return "—";

    }

    return escapeHTML(value);

}


// ===================================
// REQUEST TYPE
// ===================================

function getRequestType(type) {

    switch (type) {

        case "membership":
            return "🚔 درخواست عضویت";

        case "division":
            return "🎖️ درخواست دیویژن";

        case "resignation":
            return "📤 درخواست استعفا";

        case "rankup":
            return "⬆️ درخواست Rankup";

        default:
            return "📄 درخواست";

    }

}


// ===================================
// STATUS COLOR
// ===================================

function getStatusColor(status) {

    if (status === "Accepted") {
        return "#00ff88";
    }

    if (status === "Rejected") {
        return "#ff3333";
    }

    return "#ffaa00";

}


// ===================================
// STATUS TEXT
// ===================================

function getStatusText(status) {

    if (status === "Accepted") {
        return "🟢 تایید شده";
    }

    if (status === "Rejected") {
        return "🔴 رد شده";
    }

    return "🟡 در انتظار بررسی";

}


// ===================================
// SHOW TICKET
// ===================================

function renderTicket(ticket) {

    const result =
        document.getElementById("ticketResult");


    if (!ticket) {
        return;
    }


    const color =
        getStatusColor(ticket.status);


    const statusText =
        getStatusText(ticket.status);


    const requestType =
        getRequestType(ticket.requestType);


    // ===================================
    // EXAM
    // ===================================

    let examHTML = "";


    if (
        ticket.requestType === "membership" &&
        ticket.score !== null &&
        ticket.score !== undefined
    ) {

        const passed =
            Number(ticket.score) >= 12;


        examHTML = `

            <div class="exam-score">

                <b>
                    📚 نمره آزمون:
                </b>

                ${escapeHTML(ticket.score)}
                از 20

                <br>

                <span class="${passed ? "pass" : "fail"}">

                    ${
                        passed
                        ? "✅ قبول شده"
                        : "❌ رد شده"
                    }

                </span>

                <br>

                <small>
                    حداقل نمره قبولی: 12 از 20
                </small>

            </div>

        `;

    }


    result.innerHTML = `

        <div
            class="ticket-result"
            style="margin-top:25px;"
        >

            <h2>
                ✅ درخواست پیدا شد
            </h2>


            <p>

                <b>
                    کد پیگیری:
                </b>

                ${escapeHTML(ticket._id)}

            </p>


            <p>

                <b>
                    نوع درخواست:
                </b>

                ${requestType}

            </p>


            <p>

                <b>
                    IC Name:
                </b>

                ${
                    valueOrDash(
                        ticket.icName ||
                        ticket.name
                    )
                }

            </p>


            <p>

                <b>
                    OOC Name:
                </b>

                ${
                    valueOrDash(
                        ticket.oocName ||
                        ticket.ocName
                    )
                }

            </p>


            <p>

                <b>
                    Discord:
                </b>

                ${
                    valueOrDash(
                        ticket.discordId ||
                        ticket.discord
                    )
                }

            </p>


            <p>

                <b>
                    وضعیت:
                </b>

                <span
                    style="
                        color:${color};
                        font-weight:bold;
                    "
                >

                    ${statusText}

                </span>

            </p>


            ${examHTML}


            <p>

                <b>
                    پاسخ فرماندهی:
                </b>


                <span
                    id="commandReply"
                    style="
                        display:block;
                        margin-top:8px;
                        white-space:pre-wrap;
                    "
                >

                    ${
                        valueOrDash(
                            ticket.reply
                        )
                    }

                </span>

            </p>


            <p>

                <b>
                    تاریخ ثبت:
                </b>

                ${
                    ticket.createdAt
                    ? new Date(
                        ticket.createdAt
                      ).toLocaleString(
                        "fa-IR"
                      )
                    : "—"
                }

            </p>

        </div>

    `;

}


// ===================================
// CHECK TICKET
// ===================================

async function checkTicket() {

    const input =
        document.getElementById("ticketID");


    const result =
        document.getElementById("ticketResult");


    const chatSection =
        document.getElementById("chatSection");


    const id =
        input.value.trim();


    if (!id) {

        result.innerHTML = `

            <p
                style="
                    color:#ffaa00;
                    margin-top:20px;
                "
            >

                ⚠️ لطفاً کد پیگیری را وارد کنید.

            </p>

        `;


        chatSection.style.display =
            "none";


        stopPolling();


        return;

    }


    result.innerHTML = `

        <div
            style="
                margin-top:20px;
                color:#ddd;
            "
        >

            ⏳ در حال بررسی درخواست...

        </div>

    `;


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(id) +
                "?t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        const ticket =
            await response.json();


        if (!response.ok) {

            throw new Error(
                ticket.message ||
                "Ticket not found"
            );

        }


        currentTicketId =
            String(ticket._id);


        lastTicketSignature = "";


        renderTicket(ticket);


        chatSection.style.display =
            "block";


        await loadMessages(true);


        startPolling();


    } catch (error) {

        console.error(
            "Tracking Error:",
            error
        );


        currentTicketId = "";


        stopPolling();


        chatSection.style.display =
            "none";


        result.innerHTML = `

            <div
                class="ticket-result"
                style="margin-top:20px;"
            >

                <p
                    style="
                        color:#ff3333;
                    "
                >

                    ❌ درخواست پیدا نشد.

                </p>


                <p
                    style="
                        color:#aaa;
                        font-size:13px;
                    "
                >

                    کد پیگیری را بررسی کنید.

                </p>

            </div>

        `;

    }

}


// ===================================
// LOAD CURRENT TICKET
// ===================================

async function refreshTicket() {

    if (!currentTicketId) {
        return;
    }


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    currentTicketId
                ) +
                "?t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        if (!response.ok) {
            return;
        }


        const ticket =
            await response.json();


        /*
         * فقط اگر اطلاعات اصلی تغییر کرده
         * صفحه را دوباره Render می‌کنیم.
         */

        const signature =
            JSON.stringify({

                status:
                    ticket.status,

                reply:
                    ticket.reply,

                updatedAt:
                    ticket.updatedAt,

                score:
                    ticket.score

            });


        if (
            signature !==
            lastTicketSignature
        ) {

            lastTicketSignature =
                signature;


            renderTicket(ticket);

        }

    } catch (error) {

        console.error(
            "Refresh Ticket Error:",
            error
        );

    }

}


// ===================================
// LOAD MESSAGES
// ===================================

async function loadMessages(force = false) {

    if (!currentTicketId) {
        return;
    }


    if (isLoadingMessages) {
        return;
    }


    isLoadingMessages = true;


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    currentTicketId
                ) +
                "/messages?t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                "Chat error"
            );

        }


        const messages =
            await response.json();


        if (
            !Array.isArray(messages)
        ) {

            return;

        }


        /*
         * یک Signature می‌سازیم.
         * اگر پیام جدیدی نیامده باشد،
         * HTML دوباره ساخته نمی‌شود.
         */

        const signature =
            JSON.stringify(
                messages.map(
                    message => ({

                        sender:
                            message.sender,

                        message:
                            message.message,

                        createdAt:
                            message.createdAt

                    })
                )
            );


        if (
            !force &&
            signature ===
            lastMessagesSignature
        ) {

            return;

        }


        lastMessagesSignature =
            signature;


        const messagesBox =
            document.getElementById(
                "messages"
            );


        const oldScrollTop =
            messagesBox.scrollTop;


        const wasNearBottom =
            (
                messagesBox.scrollHeight -
                messagesBox.scrollTop -
                messagesBox.clientHeight
            ) < 100;


        if (
            messages.length === 0
        ) {

            messagesBox.innerHTML = `

                <p
                    style="
                        color:#888;
                        text-align:center;
                    "
                >

                    هنوز پیامی ثبت نشده است.

                </p>

            `;

            return;

        }


        messagesBox.innerHTML =
            messages.map(
                message => {

                    const isCommand =
                        message.sender ===
                        "command";


                    return `

                        <div
                            class="
                                message
                                ${
                                    isCommand
                                    ? "command"
                                    : "applicant"
                                }
                            "
                        >

                            <div class="message-name">

                                ${
                                    isCommand
                                    ? "👮 فرماندهی"
                                    : "👤 شما"
                                }

                            </div>


                            <div class="message-text">

                                ${
                                    escapeHTML(
                                        message.message
                                    )
                                }

                            </div>


                            <small
                                class="message-time"
                            >

                                ${
                                    message.createdAt
                                    ? new Date(
                                        message.createdAt
                                      ).toLocaleString(
                                        "fa-IR"
                                      )
                                    : ""
                                }

                            </small>

                        </div>

                    `;

                }
            ).join("");


        /*
         * فقط اگر کاربر نزدیک انتهای چت بوده
         * اسکرول را پایین می‌بریم.
         */

        if (wasNearBottom || force) {

            messagesBox.scrollTop =
                messagesBox.scrollHeight;

        } else {

            messagesBox.scrollTop =
                oldScrollTop;

        }


    } catch (error) {

        console.error(
            "Load Messages Error:",
            error
        );

    } finally {

        isLoadingMessages = false;

    }

}


// ===================================
// AUTO POLLING
// ===================================

function startPolling() {

    stopPolling();


    /*
     * هر 2 ثانیه:
     *
     * 1. پیام‌های چت
     * 2. وضعیت درخواست
     * 3. پاسخ فرماندهی
     *
     * بررسی می‌شوند.
     */

    pollingInterval =
        setInterval(
            async () => {

                if (!currentTicketId) {
                    return;
                }


                await Promise.all([

                    loadMessages(false),

                    refreshTicket()

                ]);

            },
            2000
        );


    console.log(
        "🔄 Ticket auto refresh started."
    );

}


// ===================================
// STOP POLLING
// ===================================

function stopPolling() {

    if (pollingInterval) {

        clearInterval(
            pollingInterval
        );

        pollingInterval = null;

    }

}


// ===================================
// SEND MESSAGE
// ===================================

async function sendMessage() {

    if (!currentTicketId) {

        alert(
            "ابتدا یک درخواست را پیگیری کنید."
        );

        return;

    }


    if (isSendingMessage) {
        return;
    }


    const input =
        document.getElementById(
            "chatInput"
        );


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    if (message.length > 2000) {

        alert(
            "پیام نمی‌تواند بیشتر از ۲۰۰۰ کاراکتر باشد."
        );

        return;

    }


    const sendButton =
        document.querySelector(
            ".chat-send"
        );


    isSendingMessage = true;


    sendButton.disabled = true;

    sendButton.innerText =
        "⏳ در حال ارسال...";


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    currentTicketId
                ) +
                "/messages",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            sender:
                                "applicant"

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Send error"
            );

        }


        input.value = "";


        /*
         * بلافاصله بعد ارسال،
         * پیام را دریافت می‌کنیم.
         */

        await loadMessages(true);


    } catch (error) {

        console.error(
            "Send Message Error:",
            error
        );


        alert(
            "❌ ارسال پیام انجام نشد."
        );

    } finally {

        isSendingMessage = false;


        sendButton.disabled =
            false;


        sendButton.innerText =
            "📨 ارسال پیام";

    }

}


// ===================================
// ENTER SEARCH
// ===================================

document
.getElementById("ticketID")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            checkTicket();

        }

    }
);


// ===================================
// CTRL + ENTER CHAT
// ===================================

document
.getElementById("chatInput")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            event.ctrlKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


// ===================================
// PAGE CLOSE
// ===================================

window.addEventListener(
    "beforeunload",
    () => {

        stopPolling();

    }
);


console.log(
    "🚔 Vanguard LSPD Ticket Tracking Online"
);

</script>

</body>
</html>
