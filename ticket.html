<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard LSPD | Tracking</title>

<link rel="stylesheet" href="style.css">

<style>
.chat-section {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #ffffff18;
}

.chat-section h2 {
    margin-bottom: 10px;
}

.messages {
    max-height: 400px;
    overflow-y: auto;
    padding: 10px;
    background: #050a11;
    border: 1px solid #ffffff12;
    border-radius: 12px;
    margin-bottom: 12px;
}

.message {
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    background: #ffffff08;
}

.message.command {
    border-right: 3px solid #3aa0ff;
}

.message.applicant {
    border-right: 3px solid #35d07f;
}

.message-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.message-text {
    white-space: pre-wrap;
    line-height: 1.7;
}

.message-time {
    display: block;
    margin-top: 6px;
    color: #8995a3;
    font-size: 11px;
}

.chat-input {
    width: 100%;
    min-height: 100px;
    resize: vertical;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ffffff18;
    background: #050a11;
    color: white;
    font-family: inherit;
    outline: none;
}

.chat-send {
    width: 100%;
    margin-top: 8px;
}

.exam-score {
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
    background: #ffffff08;
}

.pass {
    color: #00ff88;
    font-weight: bold;
}

.fail {
    color: #ff4444;
    font-weight: bold;
}
</style>

</head>

<body class="lobby-page">

<div class="overlay"></div>

<header class="navbar">

<img
src="badge.png"
class="badge"
alt="Vanguard LSPD"
>

<div class="nav-title">

<h2>Vanguard LSPD</h2>

<span>Application Tracking</span>

</div>

<a
href="index.html"
class="login-btn"
>
بازگشت
</a>

</header>

<main class="hero">

<div class="form-box">

<img
src="badge.png"
class="form-badge"
alt="LSPD Badge"
>

<h1>📄 پیگیری درخواست</h1>

<p>
کد پیگیری درخواست خود را وارد کنید.
</p>

<input
type="text"
id="ticketID"
placeholder="کد پیگیری را وارد کنید..."
autocomplete="off"
>

<button
type="button"
class="btn primary"
onclick="checkTicket()"
>
🔍 بررسی درخواست
</button>

<div id="ticketResult"></div>

<!-- ============================= -->
<!-- CHAT -->
<!-- ============================= -->

<div
id="chatSection"
class="chat-section"
style="display:none;"
>

<h2>💬 چت با فرماندهی</h2>

<p>
در این بخش می‌توانید با فرماندهی درباره درخواست خود گفتگو کنید.
</p>

<div
id="messages"
class="messages"
>
</div>

<textarea
id="chatInput"
class="chat-input"
placeholder="پیام خود را بنویسید..."
></textarea>

<button
type="button"
class="btn primary chat-send"
onclick="sendMessage()"
>
📨 ارسال پیام
</button>

</div>

</div>

</main>

<script>

const API_URL =
"https://lspd-site-11.onrender.com";

let currentTicketId = "";


// ===================================
// امنیت نمایش متن
// ===================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ===================================
// نوع درخواست
// ===================================

function getRequestType(type) {

    switch (type) {

        case "membership":
            return "🚔 درخواست عضویت";

        case "division":
            return "🎖️ درخواست دیویژن";

        case "resignation":
            return "📤 درخواست استعفا";

        case "rankup":
            return "⬆️ درخواست Rankup";

        default:
            return "📄 درخواست";

    }

}


// ===================================
// رنگ وضعیت
// ===================================

function getStatusColor(status) {

    if (status === "Accepted") {
        return "#00ff88";
    }

    if (status === "Rejected") {
        return "#ff3333";
    }

    return "#ffaa00";

}


// ===================================
// متن وضعیت
// ===================================

function getStatusText(status) {

    if (status === "Accepted") {
        return "🟢 تایید شده";
    }

    if (status === "Rejected") {
        return "🔴 رد شده";
    }

    return "🟡 در انتظار بررسی";

}


// ===================================
// مقدار خالی
// ===================================

function valueOrDash(value) {

    if (
        value === undefined ||
        value === null ||
        String(value).trim() === ""
    ) {

        return "—";

    }

    return escapeHTML(value);

}


// ===================================
// پیگیری درخواست
// ===================================

async function checkTicket() {

    const input =
        document.getElementById("ticketID");

    const id =
        input.value.trim();

    const result =
        document.getElementById("ticketResult");

    const chatSection =
        document.getElementById("chatSection");


    if (!id) {

        result.innerHTML = `

            <p style="color:#ffaa00;margin-top:20px;">

                ⚠️ لطفاً کد پیگیری را وارد کنید.

            </p>

        `;

        chatSection.style.display = "none";

        return;

    }


    result.innerHTML = `

        <div style="
            margin-top:20px;
            color:#ddd;
        ">

            ⏳ در حال بررسی درخواست...

        </div>

    `;


    try {

        /*
         * مستقیم درخواست را با ID می‌گیریم.
         * لازم نیست کل تیکت‌ها دانلود شوند.
         */

        const response =
            await fetch(
                API_URL +
                "/tickets/" +
                encodeURIComponent(id)
            );


        const ticket =
            await response.json();


        if (!response.ok) {

            throw new Error(
                ticket.message ||
                "Ticket not found"
            );

        }


        currentTicketId =
            String(ticket._id);


        const color =
            getStatusColor(
                ticket.status
            );


        const statusText =
            getStatusText(
                ticket.status
            );


        const requestType =
            getRequestType(
                ticket.requestType
            );


        // ==============================
        // نمره آزمون
        // ==============================

        let examHTML = "";

        if (
            ticket.requestType ===
            "membership" &&
            ticket.score !== null &&
            ticket.score !== undefined
        ) {

            const passed =
                Number(ticket.score) >= 12;

            examHTML = `

                <div class="exam-score">

                    <b>
                        📚 نمره آزمون:
                    </b>

                    ${escapeHTML(ticket.score)}
                    از 20

                    <br>

                    <span class="
                        ${passed ? "pass" : "fail"}
                    ">

                        ${
                            passed
                            ? "✅ قبول شده"
                            : "❌ رد شده"
                        }

                    </span>

                    <br>

                    <small>
                        حداقل نمره قبولی: 12 از 20
                    </small>

                </div>

            `;

        }


        result.innerHTML = `

            <div
            class="ticket-result"
            style="margin-top:25px;"
            >

                <h2>
                    ✅ درخواست پیدا شد
                </h2>

                <p>
                    <b>کد پیگیری:</b>
                    ${escapeHTML(ticket._id)}
                </p>

                <p>

                    <b>
                        نوع درخواست:
                    </b>

                    ${requestType}

                </p>

                <p>

                    <b>
                        IC Name:
                    </b>

                    ${
                        valueOrDash(
                            ticket.icName ||
                            ticket.name
                        )
                    }

                </p>

                <p>

                    <b>
                        OOC Name:
                    </b>

                    ${
                        valueOrDash(
                            ticket.oocName ||
                            ticket.ocName
                        )
                    }

                </p>

                <p>

                    <b>
                        Discord:
                    </b>

                    ${
                        valueOrDash(
                            ticket.discordId ||
                            ticket.discord
                        )
                    }

                </p>

                <p>

                    <b>
                        وضعیت:
                    </b>

                    <span style="
                        color:${color};
                        font-weight:bold;
                    ">

                        ${statusText}

                    </span>

                </p>

                ${examHTML}

                <p>

                    <b>
                        پاسخ فرماندهی:
                    </b>

                    <span style="
                        display:block;
                        margin-top:8px;
                        white-space:pre-wrap;
                    ">

                        ${
                            valueOrDash(
                                ticket.reply
                            )
                        }

                    </span>

                </p>

                <p>

                    <b>
                        تاریخ ثبت:
                    </b>

                    ${
                        ticket.createdAt
                        ? new Date(
                            ticket.createdAt
                          ).toLocaleString(
                            "fa-IR"
                          )
                        : "—"
                    }

                </p>

            </div>

        `;


        // ==============================
        // باز کردن چت
        // ==============================

        chatSection.style.display =
            "block";


        await loadMessages();


    } catch (error) {

        console.error(
            "Tracking Error:",
            error
        );


        currentTicketId = "";


        chatSection.style.display =
            "none";


        result.innerHTML = `

            <div
            class="ticket-result"
            style="margin-top:20px;"
            >

                <p style="color:#ff3333;">

                    ❌ درخواست پیدا نشد.

                </p>

                <p style="
                    color:#aaa;
                    font-size:13px;
                ">

                    کد پیگیری را بررسی کنید.

                </p>

            </div>

        `;

    }

}


// ===================================
// دریافت پیام‌های چت
// ===================================

async function loadMessages() {

    if (!currentTicketId) {
        return;
    }


    const messagesBox =
        document.getElementById(
            "messages"
        );


    messagesBox.innerHTML = `

        <p style="color:#aaa;">
            ⏳ در حال دریافت پیام‌ها...
        </p>

    `;


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    currentTicketId
                ) +
                "/messages"

            );


        if (!response.ok) {

            throw new Error(
                "Chat error"
            );

        }


        const messages =
            await response.json();


        if (
            !Array.isArray(messages) ||
            messages.length === 0
        ) {

            messagesBox.innerHTML = `

                <p style="color:#888;">

                    هنوز پیامی از فرماندهی ثبت نشده است.

                </p>

            `;

            return;

        }


        messagesBox.innerHTML =
            messages.map(
                message => {

                    const isCommand =
                        message.sender ===
                        "command";


                    return `

                        <div class="
                            message
                            ${
                                isCommand
                                ? "command"
                                : "applicant"
                            }
                        ">

                            <div class="message-name">

                                ${
                                    isCommand
                                    ? "👮 فرماندهی"
                                    : "👤 شما"
                                }

                            </div>

                            <div class="message-text">

                                ${
                                    escapeHTML(
                                        message.message
                                    )
                                }

                            </div>

                            <small class="message-time">

                                ${
                                    message.createdAt
                                    ? new Date(
                                        message.createdAt
                                      ).toLocaleString(
                                        "fa-IR"
                                      )
                                    : ""
                                }

                            </small>

                        </div>

                    `;

                }
            ).join("");


        messagesBox.scrollTop =
            messagesBox.scrollHeight;


    } catch (error) {

        console.error(
            "Load Messages Error:",
            error
        );


        messagesBox.innerHTML = `

            <p style="color:#ff5555;">

                ❌ خطا در دریافت پیام‌ها.

            </p>

        `;

    }

}


// ===================================
// ارسال پیام متقاضی
// ===================================

async function sendMessage() {

    if (!currentTicketId) {

        alert(
            "ابتدا یک درخواست را پیگیری کنید."
        );

        return;

    }


    const input =
        document.getElementById(
            "chatInput"
        );


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    if (message.length > 2000) {

        alert(
            "پیام نمی‌تواند بیشتر از ۲۰۰۰ کاراکتر باشد."
        );

        return;

    }


    const sendButton =
        document.querySelector(
            ".chat-send"
        );


    sendButton.disabled = true;

    sendButton.innerText =
        "⏳ در حال ارسال...";


    try {

        const response =
            await fetch(

                API_URL +
                "/tickets/" +
                encodeURIComponent(
                    currentTicketId
                ) +
                "/messages",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        message:

                            message,

                        sender:
                            "applicant"

                    })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Send error"
            );

        }


        input.value = "";


        await loadMessages();


    } catch (error) {

        console.error(
            "Send Message Error:",
            error
        );


        alert(
            "❌ ارسال پیام انجام نشد."
        );

    } finally {

        sendButton.disabled = false;

        sendButton.innerText =
            "📨 ارسال پیام";

    }

}


// ===================================
// Enter برای جستجو
// ===================================

document
.getElementById("ticketID")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            checkTicket();

        }

    }
);


// ===================================
// Ctrl + Enter برای ارسال پیام
// ===================================

document
.getElementById("chatInput")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            event.ctrlKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>

</body>
</html>
